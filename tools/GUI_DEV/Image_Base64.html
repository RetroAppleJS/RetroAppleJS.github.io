<!DOCTYPE html>
<html>
  <head>
      <title>Image / Base64 Converter</title>
      <script type="text/javascript" src="../TOOLS_Header.js"></script>
        <meta name="description" content="Image to Base64 and Base64 to image converter">
        <meta name="author" content="Freddy Vandriessche">
        <meta charset="utf-8"> 
  </head>
  <body onload="document.getElementById('slider_title').outerHTML=_TITLE();update()">

    <div id="slider_title">
    </div>
    <div class="slider_overlay">
      <div id="topmenu">
      </div>
      <div id="main" style="height:100%;overflow-x:hidden;overflow-y:auto;background: linear-gradient(180deg, rgba(220,220,220,1) 0%, rgba(251,251,251,1) 50%);">

        <div style="padding: 5px 10px;">
          <b>IMAGE → BASE64</b>
        </div>
        <input id="myinput" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" onchange="encode();" style="padding: 5px 10px; margin: 10px;" />
        <button style="padding: 5px 10px; margin: 10px;" onclick="copy(document.getElementById('txt').value)">COPY BASE64</button>

        <div style="padding: 5px 10px; margin-top: 5px;">
          <b>BASE64 → IMAGE</b>
        </div>
        <button style="padding: 5px 10px; margin: 10px;" onclick="decode();">SHOW IMAGE</button>
        <button id="downloadButton" style="padding: 5px 10px; margin: 10px;" onclick="downloadDecodedImage();" disabled>DOWNLOAD IMAGE</button>
        <span id="status" style="margin: 10px;"></span>

        <div id="dummy" style="padding: 10px;">
        </div>
        <div>
          <textarea style="width:98%;height:500px;" id="txt" placeholder="PNG, JPEG, GIF, WebP or BMP: Base64 data URL or raw Base64"></textarea>
        </div>

        <script>
        var CONF_version="0.0.3"
        var CONF_builddate="20260926-153400"
        var imageObjectURL=""
        var decodedMime=""

          function encode() {
            clearImage();
            var selectedfile = document.getElementById("myinput").files;
            if (selectedfile.length > 0) {
              var imageFile = selectedfile[0];
              var fileReader = new FileReader();
              fileReader.onload = function(fileLoadedEvent) {
                try {
                  var srcData = fileLoadedEvent.target.result;
                  showImage(srcData);
                  document.getElementById("txt").value = srcData;
                  setStatus("");
                } catch (err) {
                  clearImage();
                  setStatus(err.message, true);
                }
              }
              fileReader.onerror = function() {
                clearImage();
                setStatus("The image file could not be read.", true);
              }
              fileReader.readAsDataURL(imageFile);
            }
          }

          function toImageDataURL(input) {
            var value = String(input || "").trim();
            if (!value) {
              throw new Error("No Base64 image data supplied.");
            }

            var dataUrlMatch = value.match(/^data:(image\/[a-z0-9.+-]+);base64,([\s\S]*)$/i);
            if (!dataUrlMatch && /^data:/i.test(value)) {
              throw new Error("The data URL must contain an image MIME type and Base64 data.");
            }

            var declaredMime = dataUrlMatch ? dataUrlMatch[1].toLowerCase() : "";
            if (declaredMime && !/^image\/(png|jpeg|gif|webp|bmp)$/.test(declaredMime)) {
              throw new Error("Only PNG, JPEG, GIF, WebP and BMP images are supported.");
            }
            var payload = cleanBase64(dataUrlMatch ? dataUrlMatch[2] : value);
            validateBase64(payload);
            var mime = detectImageMime(payload);
            if (!mime) {
              throw new Error("The data is not a supported PNG, JPEG, GIF, WebP or BMP image.");
            }
            if (declaredMime && declaredMime !== mime) {
              throw new Error("The image MIME type does not match its contents.");
            }
            return "data:" + mime + ";base64," + payload;
          }

          function cleanBase64(value) {
            return String(value || "").replace(/\s+/g, "");
          }

          function validateBase64(payload) {
            if (!payload || !/^[A-Za-z0-9+/]*={0,2}$/.test(payload) || payload.length % 4 === 1) {
              throw new Error("Invalid Base64 image data.");
            }
            try {
              atob(payload);
            } catch (err) {
              throw new Error("Invalid Base64 image data.");
            }
          }

          function detectImageMime(payload) {
            var bytes = atob(payload);
            if (bytes.slice(0,8) === "\x89PNG\r\n\x1a\n") return "image/png";
            if (bytes.slice(0,3) === "\xff\xd8\xff") return "image/jpeg";
            if (bytes.slice(0,6) === "GIF87a" || bytes.slice(0,6) === "GIF89a") return "image/gif";
            if (bytes.slice(0,4) === "RIFF" && bytes.slice(8,12) === "WEBP") return "image/webp";
            if (bytes.length >= 14 && bytes.slice(0,2) === "BM") return "image/bmp";
            return "";
          }

          function decode() {
            try {
              decodedMime = showImage(document.getElementById("txt").value);
              document.getElementById("downloadButton").disabled = false;
              setStatus("Image decoded.");
            } catch (err) {
              clearImage();
              setStatus(err.message, true);
            }
          }

          function showImage(srcData) {
            var dataURL = toImageDataURL(srcData);
            var separator = dataURL.indexOf(",");
            var mime = dataURL.slice(5, dataURL.indexOf(";"));
            var binary = atob(dataURL.slice(separator+1));
            var bytes = new Uint8Array(binary.length);
            for (var i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
            // Only a browser-generated URL for validated raster bytes reaches the DOM.
            var objectURL = URL.createObjectURL(new Blob([bytes], {type:mime}));
            clearImage();
            imageObjectURL = objectURL;
            var newImage = document.createElement("img");
            newImage.src = imageObjectURL;
            newImage.alt = "Decoded image";
            newImage.style.maxWidth = "98%";
            newImage.style.height = "auto";
            document.getElementById("dummy").appendChild(newImage);
            return mime;
          }

          function clearImage() {
            document.getElementById("dummy").replaceChildren();
            if (imageObjectURL) URL.revokeObjectURL(imageObjectURL);
            imageObjectURL = "";
            decodedMime = "";
            document.getElementById("downloadButton").disabled = true;
          }

          function downloadDecodedImage() {
            if (!imageObjectURL || !decodedMime) return;
            var link = document.createElement("a");
            link.href = imageObjectURL;
            link.download = "decoded-image." + extensionForMime(decodedMime);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }

          function extensionForMime(mime) {
            var extensions = {
              "image/png": "png",
              "image/jpeg": "jpg",
              "image/gif": "gif",
              "image/webp": "webp",
              "image/bmp": "bmp"
            };
            return extensions[mime] || "img";
          }

          function setStatus(message, isError) {
            var status = document.getElementById("status");
            status.textContent = message;
            status.style.color = isError ? "#a00000" : "";
          }

          function copy(text) {
            navigator.clipboard.writeText(text).then(function() {
              //alert('Copied to clipboard');
            }, function(err) {
              alert('Could not copy text: ' + err);
            });
          }
        </script>

      </div>
    </div>
  </body>

</html>
