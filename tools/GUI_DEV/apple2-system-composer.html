<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple II System Composer</title>
<style>
:root{--bg:#e9e4d9;--panel:#f7f4ec;--line:#b7b0a4;--ink:#292722;--muted:#746f66;--accent:#8c3c2d;--sel:#1e6ba8;--danger:#a5382a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit}button{border:1px solid var(--line);background:#fffdf8;color:var(--ink);border-radius:5px;padding:7px 11px;cursor:pointer}button:hover:not(:disabled){background:#fff}button:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:2px}button:disabled{opacity:.45;cursor:default}.danger{color:var(--danger)}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:4}.title{font-weight:700;margin-right:auto;letter-spacing:.02em}.workspace{min-height:0;display:grid;grid-template-columns:285px 1fr;gap:0}.sidebar{border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}.sidebar h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.layer-list{display:flex;flex-direction:column;gap:5px;margin-bottom:18px}.layer-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:7px;border:1px solid var(--line);border-radius:5px;background:#fffdf8;cursor:pointer}.layer-row.selected{outline:2px solid var(--sel);outline-offset:-1px}.layer-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.missing{font-size:10px;font-weight:700;color:var(--danger);letter-spacing:.06em}.props{border-top:1px solid var(--line);padding-top:12px}.filename{font-weight:600;overflow-wrap:anywhere;margin:0 0 10px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.field input[type=number],.field input[type=text]{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;background:#fff}.check{display:flex;gap:7px;align-items:center;margin:10px 0}.zbuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.remove{margin-top:7px;width:100%}.shadow-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.shadow-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}.shadow-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shadow-section.disabled .shadow-fields{opacity:.45}.empty{color:var(--muted);font-style:italic;padding:8px 2px}.metadata-section{margin:10px 0 14px;padding:10px;border:1px solid var(--line);border-radius:5px;background:#fffaf2}.metadata-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.metadata-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.id-mode{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.metadata-labels{display:flex;flex-direction:column;gap:5px;margin:7px 0}.metadata-row{display:grid;grid-template-columns:minmax(72px,.8fr) minmax(90px,1.2fr) auto;gap:5px;align-items:center}.metadata-row input{min-width:0;width:100%;padding:5px;border:1px solid var(--line);border-radius:4px;background:#fff}.metadata-row input[readonly]{background:#eeeae1;color:var(--muted)}.metadata-row .remove-label{padding:4px 7px}.metadata-actions{display:flex;gap:6px;margin-top:7px}.metadata-actions button{padding:5px 8px;font-size:12px}.configuration-bar{width:min(1144px,calc(100vw - 340px));max-width:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35}.configuration-tabs{display:flex;gap:6px;flex-wrap:wrap}.configuration-tab.active{outline:2px solid var(--sel);outline-offset:-1px;background:#eef6fc}.stage-content{min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{min-width:0;min-height:0;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(45deg,#ded9ce 25%,transparent 25%) 0 0/20px 20px,linear-gradient(45deg,transparent 75%,#ded9ce 75%) 0 0/20px 20px,linear-gradient(45deg,transparent 75%,#ded9ce 75%) 10px -10px/20px 20px,linear-gradient(45deg,#ded9ce 25%,#eee9df 25%) 10px -10px/20px 20px}.canvas-shell{box-shadow:0 2px 18px #0002;border:1px solid #b9b4aa;background:transparent;line-height:0;max-width:100%}canvas{display:block;width:min(1144px,calc(100vw - 340px));height:auto;max-width:100%;touch-action:none;background:transparent}.status{padding:7px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:850px){.workspace{grid-template-columns:220px 1fr}.title{display:none}canvas{width:min(1144px,calc(100vw - 270px))}}
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="title">Apple II System Composer</div>
    <button id="undoBtn" type="button" disabled>Undo</button>
    <button id="redoBtn" type="button" disabled>Redo</button>
    <button id="importBtn">Import Images</button>
    <button id="unloadImagesBtn" type="button">Unload Images</button>
    <button id="loadBtn">Load Layout</button>
    <button id="saveBtn">Save Layout</button>
    <button id="saveEmbeddedBtn">Save Embedded JSON</button>
    <button id="exportJsBtn">Export JS</button>
    <button id="exportBtn">Export PNG</button>
    <input id="imageInput" type="file" accept="image/png,.png" multiple hidden>
    <input id="layoutInput" type="file" accept="application/json,.json" hidden>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <h2>Layers</h2>
      <div id="layerList" class="layer-list"></div>
      <section class="props">
        <h2>Selected layer</h2>
        <div id="noSelection" class="empty">No layer selected</div>
        <div id="selectionControls" hidden>
          <div id="selectedFilename" class="filename"></div>
          <section class="metadata-section">
            <div class="metadata-head"><div class="metadata-title">Element identity</div><span id="idModeBadge" class="id-mode">auto</span></div>
            <div class="field"><label for="semanticIdInput">Semantic ID</label><input id="semanticIdInput" type="text" placeholder="DISKII.D2.LED"></div>
            <div class="metadata-title" style="margin-top:9px">Labels</div>
            <div id="labelsEditor" class="metadata-labels"></div>
            <div class="metadata-actions">
              <button id="addLabelBtn" type="button">+ Add label</button>
              <button id="resetSuggestedIdBtn" type="button">Reset to suggested ID</button>
            </div>
          </section>
          <div class="field-grid">
            <div class="field"><label for="xInput">X</label><input id="xInput" type="number" step="1"></div>
            <div class="field"><label for="yInput">Y</label><input id="yInput" type="number" step="1"></div>
          </div>
          <label class="check"><input id="visibleInput" type="checkbox"> Visible</label>
          <section id="shadowSection" class="shadow-section">
            <div class="shadow-title">Shadow</div>
            <label class="check"><input id="shadowEnabledInput" type="checkbox"> Cast shadow</label>
            <div class="shadow-fields">
              <div class="field"><label for="shadowOffsetXInput">Offset X</label><input id="shadowOffsetXInput" type="number" step="1"></div>
              <div class="field"><label for="shadowOffsetYInput">Offset Y</label><input id="shadowOffsetYInput" type="number" step="1"></div>
              <div class="field"><label for="shadowBlurInput">Blur</label><input id="shadowBlurInput" type="number" min="0" step="1"></div>
              <div class="field"><label for="shadowOpacityInput">Opacity</label><input id="shadowOpacityInput" type="number" min="0" max="1" step="0.05"></div>
            </div>
          </section>
          <div class="zbuttons">
            <button id="forwardBtn">Bring Forward</button>
            <button id="backwardBtn">Send Backward</button>
          </div>
          <button id="removeBtn" class="remove danger">Remove</button>
          <div class="hint">Arrow keys: 1 px · Shift+Arrow: 10 px</div>
        </div>
      </section>
    </aside>
    <section class="stage">
      <div class="stage-content">
        <div id="configurationBar" class="configuration-bar" aria-label="Visual configurations">
          <button id="baseConfigurationBtn" class="configuration-tab active" type="button">Base</button>
          <div id="configurationTabs" class="configuration-tabs"></div>
          <button id="addConfigurationBtn" type="button" title="Add visual configuration">+</button>
          <button id="duplicateConfigurationBtn" type="button" disabled>Duplicate</button>
          <button id="renameConfigurationBtn" type="button" disabled>Rename</button>
          <button id="deleteConfigurationBtn" type="button" class="danger" disabled>Delete</button>
          <button id="importConfigurationBtn" type="button">Import Configuration</button>
          <button id="exportConfigurationBtn" type="button" disabled>Export Configuration</button>
          <input id="configurationInput" type="file" accept="application/json,.json" hidden>
        </div>
        <div class="canvas-shell"><canvas id="previewCanvas" width="1144" height="1144" aria-label="Apple II composition canvas" tabindex="0"></canvas></div>
      </div>
    </section>
  </main>
  <footer id="statusBar" class="status">0 layers | No layer selected</footer>
</div>
<script>
'use strict';
const CANVAS_W=1144, CANVAS_H=1144, LAYOUT_VERSION=3;
const CONFIGURATION_FILE_TYPE='apple2-system-composer-configuration', CONFIGURATION_FILE_VERSION=1;
const DEFAULT_SHADOW=Object.freeze({enabled:false,offsetX:0,offsetY:15,blur:12,opacity:0.75});
const HISTORY_LIMIT=100;
const state={layers:[],configurations:[],activeConfigurationId:null,selectedLayerUid:null,assets:new Map(),dragging:null,history:{undo:[],redo:[]}};
let runtimeCounter=1, semanticCounter=1;
const $=id=>document.getElementById(id);
const canvas=$('previewCanvas'), ctx=canvas.getContext('2d');
const imageInput=$('imageInput'), layoutInput=$('layoutInput'), configurationInput=$('configurationInput');

function makeRuntimeId(){ return `layer-${Date.now().toString(36)}-${runtimeCounter++}`; }
function makeDefaultSemanticId(){ return `SYSTEM.LAYER${semanticCounter++}`; }
function getSelectedLayer(){ return state.layers.find(l=>l.uid===state.selectedLayerUid)||null; }
function setLayers(layers){ state.layers=layers; state.selectedLayerUid=layers[0]?.uid||null; refreshUI(); renderPreview(); }

function validateShadow(raw,index){
  if(raw==null) return {...DEFAULT_SHADOW};
  if(typeof raw!=='object' || Array.isArray(raw)) throw new Error(`Layer ${index+1} shadow must be an object.`);
  const enabled=raw.enabled ?? false;
  const offsetX=raw.offsetX ?? DEFAULT_SHADOW.offsetX;
  const offsetY=raw.offsetY ?? DEFAULT_SHADOW.offsetY;
  const blur=raw.blur ?? DEFAULT_SHADOW.blur;
  const opacity=raw.opacity ?? DEFAULT_SHADOW.opacity;
  if(typeof enabled!=='boolean') throw new Error(`Layer ${index+1} shadow enabled must be boolean.`);
  if(!Number.isInteger(offsetX) || !Number.isInteger(offsetY)) throw new Error(`Layer ${index+1} shadow offsets must be integer pixels.`);
  if(typeof blur!=='number' || !Number.isFinite(blur) || blur<0) throw new Error(`Layer ${index+1} shadow blur must be a non-negative number.`);
  if(typeof opacity!=='number' || !Number.isFinite(opacity) || opacity<0 || opacity>1) throw new Error(`Layer ${index+1} shadow opacity must be between 0 and 1.`);
  return {enabled,offsetX,offsetY,blur,opacity};
}

function validateAssets(raw){
  if(raw==null) return null;
  if(typeof raw!=='object' || Array.isArray(raw)) throw new Error('Layout assets must be an object keyed by filename.');
  const assets={};
  for(const [filename,dataUrl] of Object.entries(raw)){
    if(typeof filename!=='string' || !filename.trim()) throw new Error('Asset filenames must be non-empty.');
    if(typeof dataUrl!=='string' || !dataUrl.startsWith('data:image/png;base64,')) throw new Error(`Asset ${filename} must be an inline PNG data URL.`);
    assets[filename]=dataUrl;
  }
  return assets;
}

function validateSemanticId(raw,index){
  if(typeof raw!=='string' || !raw.trim()) throw new Error(`Layer ${index+1} id must be a non-empty semantic identifier.`);
  const id=raw.trim();
  if(!/^[A-Za-z0-9._-]+$/.test(id)) throw new Error(`Layer ${index+1} id may contain only letters, digits, '.', '_' and '-'.`);
  return id;
}

function validateLabels(raw,index){
  if(raw==null) return {};
  if(typeof raw!=='object' || Array.isArray(raw)) throw new Error(`Layer ${index+1} labels must be an object.`);
  const labels={};
  const seen=new Set();
  for(const [rawKey,value] of Object.entries(raw)){
    const key=String(rawKey).trim().toUpperCase();
    if(!key) throw new Error(`Layer ${index+1} label keys must be non-empty.`);
    if(!/^[A-Z][A-Z0-9_-]*$/.test(key)) throw new Error(`Layer ${index+1} label key ${rawKey} is invalid.`);
    if(key==='UNIT') throw new Error(`Layer ${index+1} label UNIT is runtime topology metadata and is not part of Composer v3.`);
    if(seen.has(key)) throw new Error(`Layer ${index+1} has duplicate label key ${key}.`);
    if(typeof value!=='string') throw new Error(`Layer ${index+1} label ${key} must have a string value.`);
    seen.add(key);
    labels[key]=value;
  }
  return labels;
}

function validateConfigurations(raw,layerIds){
  if(!Array.isArray(raw)) throw new Error('Layout configurations must be an array.');
  const seenIds=new Set();
  return raw.map((config,index)=>{
    if(!config || typeof config!=='object' || Array.isArray(config)) throw new Error('Configuration '+(index+1)+' is malformed.');
    if(typeof config.id!=='string' || !config.id.trim()) throw new Error('Configuration '+(index+1)+' id must be non-empty.');
    const id=config.id.trim();
    if(!/^[A-Za-z0-9._-]+$/.test(id)) throw new Error('Configuration '+(index+1)+' id is invalid.');
    if(seenIds.has(id)) throw new Error('Duplicate configuration id: '+id);
    seenIds.add(id);
    if(typeof config.title!=='string' || !config.title.trim()) throw new Error('Configuration '+id+' title must be non-empty.');
    const title=config.title.trim();
    if(!Array.isArray(config.visible)) throw new Error('Configuration '+id+' visible must be an array.');
    const seenVisible=new Set();
    const visible=config.visible.map((rawId,itemIndex)=>{
      if(typeof rawId!=='string' || !rawId.trim()) throw new Error('Configuration '+id+' visible entry '+(itemIndex+1)+' must be a semantic ID.');
      const semanticId=rawId.trim();
      if(!layerIds.has(semanticId)) throw new Error('Configuration '+id+' references unknown semantic ID '+semanticId+'.');
      if(seenVisible.has(semanticId)) throw new Error('Configuration '+id+' contains duplicate visible semantic ID '+semanticId+'.');
      seenVisible.add(semanticId);
      return semanticId;
    });
    return {id,title,visible};
  });
}

function canonicalSuggestionSegment(value){
  return String(value??'').trim().toUpperCase().replace(/[^A-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');
}
function suggestSemanticId(layer){
  const labels=layer?.labels||{};
  const pcode=canonicalSuggestionSegment(labels.PCODE);
  const dcode=canonicalSuggestionSegment(labels.DCODE);
  const role=canonicalSuggestionSegment(labels.ROLE);
  const parts=[];
  if(pcode) parts.push(pcode); else if(dcode||role) parts.push('SYSTEM');
  if(dcode) parts.push(dcode);
  if(role) parts.push(role);
  return parts.join('.');
}
function syncSuggestedSemanticId(layer){
  if(!layer || layer.idMode==='custom') return layer?.id||'';
  const suggested=suggestSemanticId(layer);
  layer.idMode='auto';
  if(suggested) layer.id=suggested;
  return layer.id||'';
}
function setLayerSemanticId(layer,value){
  layer.id=validateSemanticId(value,0);
  layer.idMode='custom';
  return layer.id;
}
function setLayerLabel(layer,key,value){
  const normalized=String(key??'').trim().toUpperCase();
  if(!/^[A-Z][A-Z0-9_-]*$/.test(normalized)) throw new Error('Label key is invalid.');
  layer.labels=layer.labels||{};
  layer.labels[normalized]=String(value??'');
  syncSuggestedSemanticId(layer);
  return layer.labels[normalized];
}
function resetSemanticIdToSuggested(layer){
  layer.idMode='auto';
  const suggested=suggestSemanticId(layer);
  if(suggested) layer.id=suggested;
  return layer.id||'';
}
function normalizeComposerDocument(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('Layout must be a JSON object.');
  if(raw.version!==2 && raw.version!==3) throw new Error(`Unsupported layout version ${raw.version}; Composer accepts versions 2 and 3.`);
  if(raw.version===3) return {...raw,configurations:raw.configurations??[]};
  const layers=Array.isArray(raw.layers)?raw.layers.map(layer=>{
    if(!layer || typeof layer!=='object' || Array.isArray(layer)) return layer;
    const labels={};
    if(layer.labels && typeof layer.labels==='object' && !Array.isArray(layer.labels)){
      for(const [key,value] of Object.entries(layer.labels)) if(String(key).trim().toUpperCase()!=='UNIT') labels[key]=value;
    }
    const {slotN,...rest}=layer;
    return {...rest,labels};
  }):raw.layers;
  return {version:3,canvas:raw.canvas,assets:raw.assets,layers,configurations:[]};
}

function validateLayout(raw){
  const doc=normalizeComposerDocument(raw);
  if(!doc.canvas || doc.canvas.width!==CANVAS_W || doc.canvas.height!==CANVAS_H) throw new Error('Canvas must be exactly 1144 × 1144.');
  if(!Array.isArray(doc.layers)) throw new Error('Layout layers must be an array.');
  if(!Array.isArray(doc.configurations)) throw new Error('Layout configurations must be an array.');
  const assets=validateAssets(doc.assets);
  const seenIds=new Set();
  const layers=doc.layers.map((l,i)=>{
    if(!l || typeof l!=='object' || Array.isArray(l)) throw new Error(`Layer ${i+1} is malformed.`);
    if(typeof l.file!=='string' || !l.file.trim()) throw new Error(`Layer ${i+1} filename must be non-empty.`);
    if(!Number.isInteger(l.x) || !Number.isInteger(l.y)) throw new Error(`Layer ${i+1} X/Y coordinates must be integer pixels.`);
    if(typeof l.visible!=='boolean') throw new Error(`Layer ${i+1} visibility must be boolean.`);
    const id=validateSemanticId(l.id,i);
    if(seenIds.has(id)) throw new Error(`Duplicate Composer semantic id: ${id}`);
    seenIds.add(id);
    const labels=validateLabels(l.labels,i);
    return {id,labels,file:l.file,x:l.x,y:l.y,visible:l.visible,shadow:validateShadow(l.shadow,i)};
  });
  const configurations=validateConfigurations(doc.configurations,seenIds);
  return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},assets,layers,configurations};
}

function findCachedAsset(filename){
  if(state.assets.has(filename)) return state.assets.get(filename);
  const lower=filename.toLowerCase();
  for(const [name,a] of state.assets){ if(name.toLowerCase()===lower) return a; }
  return null;
}
function attachAsset(layer,asset){ layer.image=asset.image;layer.width=asset.width;layer.height=asset.height;layer.resolved=true; }
function captureHistorySnapshot(){
  return {
    layers:state.layers.map(layer=>({uid:layer.uid,id:layer.id,idMode:layer.idMode==='auto'?'auto':'custom',labels:{...(layer.labels||{})},file:layer.file,x:layer.x,y:layer.y,visible:!!layer.visible,shadow:{...(layer.shadow||{})}})),
    configurations:(state.configurations||[]).map(config=>({...config,visible:[...(config.visible||[])]})),
    selectedLayerUid:state.selectedLayerUid||null,
    activeConfigurationId:state.activeConfigurationId||null
  };
}
function historySnapshotsEqual(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function updateHistoryButtons(){
  $('undoBtn').disabled=state.history.undo.length===0;
  $('redoBtn').disabled=state.history.redo.length===0;
}
function restoreHistorySnapshot(snapshot){
  const next=(snapshot.layers||[]).map(entry=>{
    const layer={uid:entry.uid||makeRuntimeId(),id:entry.id,idMode:entry.idMode==='auto'?'auto':'custom',labels:{...(entry.labels||{})},file:entry.file,x:entry.x,y:entry.y,visible:!!entry.visible,shadow:{...(entry.shadow||{})},image:null,width:0,height:0,resolved:false};
    const asset=findCachedAsset(entry.file);if(asset)attachAsset(layer,asset);return layer;
  });
  state.layers=next;
  state.configurations=(snapshot.configurations||[]).map(config=>({...config,visible:[...(config.visible||[])]}));
  state.activeConfigurationId=snapshot.activeConfigurationId&&state.configurations.some(config=>config.id===snapshot.activeConfigurationId)?snapshot.activeConfigurationId:null;
  state.selectedLayerUid=snapshot.selectedLayerUid&&next.some(layer=>layer.uid===snapshot.selectedLayerUid)?snapshot.selectedLayerUid:(next[0]?.uid||null);
  state.dragging=null;
  refreshUI();renderPreview();
}
function commitHistory(snapshot){
  if(!snapshot)return false;
  const current=captureHistorySnapshot();
  if(historySnapshotsEqual(snapshot,current)){updateHistoryButtons();return false;}
  state.history.undo.push(snapshot);
  if(state.history.undo.length>HISTORY_LIMIT)state.history.undo.splice(0,state.history.undo.length-HISTORY_LIMIT);
  state.history.redo.length=0;
  updateHistoryButtons();return true;
}
function resetHistory(){state.history.undo.length=0;state.history.redo.length=0;updateHistoryButtons();}
function undo(){
  if(!state.history.undo.length){updateHistoryButtons();return false;}
  const current=captureHistorySnapshot(),previous=state.history.undo.pop();
  state.history.redo.push(current);if(state.history.redo.length>HISTORY_LIMIT)state.history.redo.shift();
  restoreHistorySnapshot(previous);updateHistoryButtons();return true;
}
function redo(){
  if(!state.history.redo.length){updateHistoryButtons();return false;}
  const current=captureHistorySnapshot(),next=state.history.redo.pop();
  state.history.undo.push(current);if(state.history.undo.length>HISTORY_LIMIT)state.history.undo.shift();
  restoreHistorySnapshot(next);updateHistoryButtons();return true;
}
function commitAuthoringMutation(mutator){const before=captureHistorySnapshot();const result=mutator();commitHistory(before);return result;}
function layerFromLayout(entry){
  const l={uid:makeRuntimeId(),id:entry.id,idMode:"custom",labels:{...(entry.labels||{})},file:entry.file,x:entry.x,y:entry.y,visible:entry.visible,shadow:{...(entry.shadow||DEFAULT_SHADOW)},image:null,width:0,height:0,resolved:false};
  const a=findCachedAsset(entry.file); if(a) attachAsset(l,a); return l;
}
function applyLayout(layout){
  const next=layout.layers.map(layerFromLayout);
  state.layers=next;state.configurations=(layout.configurations||[]).map(c=>({...c,visible:[...c.visible]}));state.activeConfigurationId=null;state.selectedLayerUid=next[0]?.uid||null;state.dragging=null;resetHistory();refreshUI();renderPreview();
}
function serializeLayer({id,labels,file,x,y,visible,shadow}){
  const cleanLabels={};
  for(const [key,value] of Object.entries(labels||{})) if(String(key).trim().toUpperCase()!=='UNIT') cleanLabels[key]=value;
  return {id,labels:cleanLabels,file,x,y,visible,shadow:{...shadow}};
}
function serializeLayout(){return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},layers:state.layers.map(serializeLayer),configurations:(state.configurations||[]).map(c=>({...c,visible:Array.isArray(c.visible)?[...c.visible]:c.visible}))};}
function serializeEmbeddedLayout(){const usedFiles=[...new Set(state.layers.map(l=>l.file))];const assets={};for(const file of usedFiles){const asset=findCachedAsset(file);if(asset?.dataUrl)assets[file]=asset.dataUrl;}return {...serializeLayout(),assets};}

function resolveLayersForAsset(asset){
  const exact=state.layers.filter(l=>!l.resolved && l.file===asset.file);
  if(exact.length){exact.forEach(l=>attachAsset(l,asset));return exact.length;}

layoutInput.addEventListener('change',async()=>{const f=layoutInput.files?.[0];layoutInput.value='';if(!f)return;try{const raw=JSON.parse(await f.text());const valid=validateLayout(raw);await cacheEmbeddedAssets(valid.assets);applyLayout(valid);}catch(e){alert(`Could not load layout: ${e.message}`);}});
$('saveBtn').addEventListener('click',()=>downloadBlob(new Blob([JSON.stringify(serializeLayout(),null,2)],{type:'application/json'}),'apple2-layout.json'));
function getEmbeddedExportBlockers(){return [...new Set(state.layers.filter(l=>!findCachedAsset(l.file)?.dataUrl).map(l=>l.file))];}
function saveEmbeddedJSON(){const blockers=getEmbeddedExportBlockers();if(blockers.length){alert(`Cannot save embedded JSON. Missing inline image data for:
${blockers.join('\n')}`);return;}downloadBlob(new Blob([JSON.stringify(serializeEmbeddedLayout(),null,2)],{type:'application/json'}),'apple2-layout-embedded.json');}
$('saveEmbeddedBtn').addEventListener('click',saveEmbeddedJSON);
function exportJS(){const blockers=getEmbeddedExportBlockers();if(blockers.length){alert(`Cannot export JS. Missing inline image data for:
${blockers.join('\n')}`);return;}const source=`var composer =
${JSON.stringify(serializeEmbeddedLayout(),null,2)};
`;downloadBlob(new Blob([source],{type:'text/javascript'}),'COM_LAYOUT_CONFIG.js');}
$('exportJsBtn').addEventListener('click',exportJS);
function getExportBlockers(){return [...new Set(state.layers.filter(l=>isLayerVisibleInActiveView(l)&&!l.resolved).map(l=>l.file))];}
function buildExportCanvas(){const c=document.createElement('canvas');c.width=CANVAS_W;c.height=CANVAS_H;const cctx=c.getContext('2d');cctx.clearRect(0,0,CANVAS_W,CANVAS_H);for(let i=state.layers.length-1;i>=0;i--)drawLayer(cctx,state.layers[i]);return c;}
function exportPNG(){const blockers=getExportBlockers();if(blockers.length){alert(`Cannot export PNG. Missing visible assets:\n${blockers.join('\n')}`);return;}const c=buildExportCanvas();c.toBlob(blob=>{if(blob)downloadBlob(blob,'apple2-composition.png');else alert('PNG export failed.');},'image/png');}
$('exportBtn').addEventListener('click',exportPNG);

refreshUI();renderPreview();
</script>
</body>
</html>
