<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple II System Composer</title>
<style>
:root{--bg:#e9e4d9;--panel:#f7f4ec;--line:#b7b0a4;--ink:#292722;--muted:#746f66;--accent:#8c3c2d;--sel:#1e6ba8;--danger:#a5382a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit}button{border:1px solid var(--line);background:#fffdf8;color:var(--ink);border-radius:5px;padding:7px 11px;cursor:pointer}button:hover:not(:disabled){background:#fff}button:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:2px}button:disabled{opacity:.45;cursor:default}.danger{color:var(--danger)}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:4}.title{font-weight:700;margin-right:auto;letter-spacing:.02em}.workspace{min-height:0;display:grid;grid-template-columns:285px 1fr;gap:0}.sidebar{border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}.sidebar h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.layer-list{display:flex;flex-direction:column;gap:5px;margin-bottom:18px}.layer-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:7px;border:1px solid var(--line);border-radius:5px;background:#fffdf8;cursor:pointer}.layer-row.selected{outline:2px solid var(--sel);outline-offset:-1px}.layer-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.missing{font-size:10px;font-weight:700;color:var(--danger);letter-spacing:.06em}.props{border-top:1px solid var(--line);padding-top:12px}.filename{font-weight:600;overflow-wrap:anywhere;margin:0 0 10px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.field input[type=number]{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;background:#fff}.check{display:flex;gap:7px;align-items:center;margin:10px 0}.zbuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.remove{margin-top:7px;width:100%}.empty{color:var(--muted);font-style:italic;padding:8px 2px}
.stage{min-width:0;min-height:0;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(45deg,#ded9ce 25%,transparent 25%) 0 0/20px 20px,linear-gradient(45deg,transparent 75%,#ded9ce 75%) 0 0/20px 20px,linear-gradient(45deg,transparent 75%,#ded9ce 75%) 10px -10px/20px 20px,linear-gradient(45deg,#ded9ce 25%,#eee9df 25%) 10px -10px/20px 20px}.canvas-shell{box-shadow:0 2px 18px #0002;border:1px solid #b9b4aa;background:transparent;line-height:0;max-width:100%}canvas{display:block;width:min(1144px,calc(100vw - 340px));height:auto;max-width:100%;touch-action:none;background:transparent}.status{padding:7px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:850px){.workspace{grid-template-columns:220px 1fr}.title{display:none}canvas{width:min(1144px,calc(100vw - 270px))}}
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="title">Apple II System Composer</div>
    <button id="importBtn">Import Images</button>
    <button id="loadBtn">Load Layout</button>
    <button id="saveBtn">Save Layout</button>
    <button id="exportBtn">Export PNG</button>
    <input id="imageInput" type="file" accept="image/png,.png" multiple hidden>
    <input id="layoutInput" type="file" accept="application/json,.json" hidden>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <h2>Layers</h2>
      <div id="layerList" class="layer-list"></div>
      <section class="props">
        <h2>Selected layer</h2>
        <div id="noSelection" class="empty">No layer selected</div>
        <div id="selectionControls" hidden>
          <div id="selectedFilename" class="filename"></div>
          <div class="field-grid">
            <div class="field"><label for="xInput">X</label><input id="xInput" type="number" step="1"></div>
            <div class="field"><label for="yInput">Y</label><input id="yInput" type="number" step="1"></div>
          </div>
          <label class="check"><input id="visibleInput" type="checkbox"> Visible</label>
          <div class="zbuttons">
            <button id="forwardBtn">Bring Forward</button>
            <button id="backwardBtn">Send Backward</button>
          </div>
          <button id="removeBtn" class="remove danger">Remove</button>
          <div class="hint">Arrow keys: 1 px · Shift+Arrow: 10 px</div>
        </div>
      </section>
    </aside>
    <section class="stage">
      <div class="canvas-shell"><canvas id="previewCanvas" width="1144" height="1144" aria-label="Apple II composition canvas" tabindex="0"></canvas></div>
    </section>
  </main>
  <footer id="statusBar" class="status">0 layers | No layer selected</footer>
</div>
<script>
'use strict';
const CANVAS_W=1144, CANVAS_H=1144, LAYOUT_VERSION=1;
const state={layers:[],selectedLayerId:null,assets:new Map(),dragging:null};
let runtimeCounter=1;
const $=id=>document.getElementById(id);
const canvas=$('previewCanvas'), ctx=canvas.getContext('2d');
const imageInput=$('imageInput'), layoutInput=$('layoutInput');

function makeRuntimeId(){ return `layer-${Date.now().toString(36)}-${runtimeCounter++}`; }
function getSelectedLayer(){ return state.layers.find(l=>l.id===state.selectedLayerId)||null; }
function setLayers(layers){ state.layers=layers; state.selectedLayerId=layers[0]?.id||null; refreshUI(); renderPreview(); }

function validateLayout(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('Layout must be a JSON object.');
  if(raw.version!==LAYOUT_VERSION) throw new Error(`Unsupported layout version; expected version ${LAYOUT_VERSION}.`);
  if(!raw.canvas || raw.canvas.width!==CANVAS_W || raw.canvas.height!==CANVAS_H) throw new Error('Canvas must be exactly 1144 × 1144.');
  if(!Array.isArray(raw.layers)) throw new Error('Layout layers must be an array.');
  const layers=raw.layers.map((l,i)=>{
    if(!l || typeof l!=='object') throw new Error(`Layer ${i+1} is malformed.`);
    if(typeof l.file!=='string' || !l.file.trim()) throw new Error(`Layer ${i+1} filename must be non-empty.`);
    if(!Number.isInteger(l.x) || !Number.isInteger(l.y)) throw new Error(`Layer ${i+1} X/Y coordinates must be integer pixels.`);
    if(typeof l.visible!=='boolean') throw new Error(`Layer ${i+1} visibility must be boolean.`);
    return {file:l.file,x:l.x,y:l.y,visible:l.visible};
  });
  return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},layers};
}

function findCachedAsset(filename){
  if(state.assets.has(filename)) return state.assets.get(filename);
  const lower=filename.toLowerCase();
  for(const [name,a] of state.assets){ if(name.toLowerCase()===lower) return a; }
  return null;
}
function attachAsset(layer,asset){ layer.image=asset.image;layer.width=asset.width;layer.height=asset.height;layer.resolved=true; }
function layerFromLayout(entry){
  const l={id:makeRuntimeId(),file:entry.file,x:entry.x,y:entry.y,visible:entry.visible,image:null,width:0,height:0,resolved:false};
  const a=findCachedAsset(entry.file); if(a) attachAsset(l,a); return l;
}
function applyLayout(layout){
  const next=layout.layers.map(layerFromLayout);
  state.layers=next; state.selectedLayerId=next[0]?.id||null; state.dragging=null; refreshUI();renderPreview();
}
function serializeLayout(){return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},layers:state.layers.map(({file,x,y,visible})=>({file,x,y,visible}))};}

function resolveLayersForAsset(asset){
  const exact=state.layers.filter(l=>!l.resolved && l.file===asset.file);
  if(exact.length){exact.forEach(l=>attachAsset(l,asset));return exact.length;}
  const lower=asset.file.toLowerCase();
  const ci=state.layers.filter(l=>!l.resolved && l.file.toLowerCase()===lower);
  ci.forEach(l=>attachAsset(l,asset));return ci.length;
}
function addLayerFromAsset(asset){
  const l={id:makeRuntimeId(),file:asset.file,x:Math.round((CANVAS_W-asset.width)/2),y:Math.round((CANVAS_H-asset.height)/2),visible:true,image:asset.image,width:asset.width,height:asset.height,resolved:true};
  state.layers.unshift(l); state.selectedLayerId=l.id; return l;
}
function loadImageFile(file){
  return new Promise((resolve,reject)=>{
    if(file.type && file.type!=='image/png' && !file.name.toLowerCase().endsWith('.png')) return reject(new Error(`${file.name}: only PNG images are supported.`));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>resolve({file:file.name,image:img,width:img.naturalWidth,height:img.naturalHeight,objectUrl:url});
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error(`${file.name}: image decode failed.`));};
    img.src=url;
  });
}
async function importImageFiles(files){
  const errors=[];
  for(const file of Array.from(files)){
    try{
      const asset=await loadImageFile(file);
      const old=state.assets.get(asset.file); if(old?.objectUrl) URL.revokeObjectURL(old.objectUrl);
      state.assets.set(asset.file,asset);
      const resolved=resolveLayersForAsset(asset); if(!resolved) addLayerFromAsset(asset);
    }catch(e){errors.push(e.message);}
  }
  refreshUI();renderPreview(); if(errors.length) alert(errors.join('\n')); imageInput.value='';
}
function removeSelectedLayer(){
  const idx=state.layers.findIndex(l=>l.id===state.selectedLayerId); if(idx<0)return;
  state.layers.splice(idx,1); const next=state.layers[Math.min(idx,state.layers.length-1)]||null; state.selectedLayerId=next?.id||null; refreshUI();renderPreview();
}
function selectLayer(id){state.selectedLayerId=id;refreshUI();renderPreview();}
function moveSelected(dx,dy){const l=getSelectedLayer();if(!l)return;l.x+=dx;l.y+=dy;refreshUI();renderPreview();}
function bringForward(){const i=state.layers.findIndex(l=>l.id===state.selectedLayerId);if(i>0){[state.layers[i-1],state.layers[i]]=[state.layers[i],state.layers[i-1]];refreshUI();renderPreview();}}
function sendBackward(){const i=state.layers.findIndex(l=>l.id===state.selectedLayerId);if(i>=0&&i<state.layers.length-1){[state.layers[i],state.layers[i+1]]=[state.layers[i+1],state.layers[i]];refreshUI();renderPreview();}}

function hitTest(x,y){for(const l of state.layers){if(l.visible&&l.resolved&&x>=l.x&&x<l.x+l.width&&y>=l.y&&y<l.y+l.height)return l;}return null;}
function canvasPoint(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};}
function renderPreview(){
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  for(let i=state.layers.length-1;i>=0;i--){const l=state.layers[i];if(l.visible&&l.resolved)ctx.drawImage(l.image,l.x,l.y);}
  const s=getSelectedLayer(); if(s&&s.visible&&s.resolved){ctx.save();ctx.strokeStyle='#1e6ba8';ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.strokeRect(s.x+.5,s.y+.5,s.width-1,s.height-1);ctx.restore();}
}

function refreshUI(){
  const list=$('layerList');list.textContent='';
  if(!state.layers.length){const d=document.createElement('div');d.className='empty';d.textContent='No layers';list.appendChild(d);}
  state.layers.forEach(l=>{
    const row=document.createElement('div');row.className='layer-row'+(l.id===state.selectedLayerId?' selected':'');row.dataset.id=l.id;row.title=l.file;
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=l.visible;cb.setAttribute('aria-label',`Show ${l.file}`);cb.addEventListener('click',e=>e.stopPropagation());cb.addEventListener('change',()=>{l.visible=cb.checked;refreshUI();renderPreview();});
    const name=document.createElement('span');name.className='layer-name';name.textContent=l.file;
    const tag=document.createElement('span');tag.className='missing';tag.textContent=l.resolved?'':'MISSING';
    row.append(cb,name,tag);row.addEventListener('click',()=>selectLayer(l.id));list.appendChild(row);
  });
  const s=getSelectedLayer(), controls=$('selectionControls'); $('noSelection').hidden=!!s;controls.hidden=!s;
  if(s){$('selectedFilename').textContent=s.file;$('xInput').value=s.x;$('yInput').value=s.y;$('visibleInput').checked=s.visible;const i=state.layers.indexOf(s);$('forwardBtn').disabled=i<=0;$('backwardBtn').disabled=i<0||i>=state.layers.length-1;}
  const missing=state.layers.filter(l=>!l.resolved).length; $('statusBar').textContent=`${state.layers.length} layer${state.layers.length===1?'':'s'} | ${s?`Selected: ${s.file} | x=${s.x} y=${s.y}`:'No layer selected'}${missing?` | ${missing} missing asset${missing===1?'':'s'}`:''}`;
}

canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e),l=hitTest(p.x,p.y);if(!l){state.selectedLayerId=null;refreshUI();renderPreview();return;}selectLayer(l.id);state.dragging={id:l.id,dx:p.x-l.x,dy:p.y-l.y,pointerId:e.pointerId};canvas.setPointerCapture?.(e.pointerId);e.preventDefault();});
canvas.addEventListener('pointermove',e=>{const d=state.dragging;if(!d||d.pointerId!==e.pointerId)return;const l=state.layers.find(x=>x.id===d.id);if(!l)return;const p=canvasPoint(e);l.x=Math.round(p.x-d.dx);l.y=Math.round(p.y-d.dy);refreshUI();renderPreview();e.preventDefault();});
function endDrag(e){if(state.dragging&&(!e||state.dragging.pointerId===e.pointerId))state.dragging=null;}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);

function commitNumber(input,key){const l=getSelectedLayer();if(!l)return;const n=Number(input.value);if(Number.isInteger(n)){l[key]=n;refreshUI();renderPreview();}}
$('xInput').addEventListener('change',()=>commitNumber($('xInput'),'x'));$('yInput').addEventListener('change',()=>commitNumber($('yInput'),'y'));
$('xInput').addEventListener('keydown',e=>{if(e.key==='Enter'){commitNumber($('xInput'),'x');e.target.blur();}});$('yInput').addEventListener('keydown',e=>{if(e.key==='Enter'){commitNumber($('yInput'),'y');e.target.blur();}});
$('visibleInput').addEventListener('change',()=>{const l=getSelectedLayer();if(l){l.visible=$('visibleInput').checked;refreshUI();renderPreview();}});
$('forwardBtn').addEventListener('click',bringForward);$('backwardBtn').addEventListener('click',sendBackward);$('removeBtn').addEventListener('click',removeSelectedLayer);

document.addEventListener('keydown',e=>{const tag=e.target?.tagName?.toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||e.target?.isContentEditable)return;if(!getSelectedLayer())return;const step=e.shiftKey?10:1;const delta={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];if(delta){e.preventDefault();moveSelected(...delta);}});

function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('importBtn').addEventListener('click',()=>imageInput.click());imageInput.addEventListener('change',()=>importImageFiles(imageInput.files));
$('loadBtn').addEventListener('click',()=>layoutInput.click());
layoutInput.addEventListener('change',async()=>{const f=layoutInput.files?.[0];layoutInput.value='';if(!f)return;try{const raw=JSON.parse(await f.text());const valid=validateLayout(raw);applyLayout(valid);}catch(e){alert(`Could not load layout: ${e.message}`);}});
$('saveBtn').addEventListener('click',()=>downloadBlob(new Blob([JSON.stringify(serializeLayout(),null,2)],{type:'application/json'}),'apple2-layout.json'));
function getExportBlockers(){return [...new Set(state.layers.filter(l=>l.visible&&!l.resolved).map(l=>l.file))];}
function buildExportCanvas(){const c=document.createElement('canvas');c.width=CANVAS_W;c.height=CANVAS_H;const cctx=c.getContext('2d');cctx.clearRect(0,0,CANVAS_W,CANVAS_H);for(let i=state.layers.length-1;i>=0;i--){const l=state.layers[i];if(l.visible&&l.resolved)cctx.drawImage(l.image,l.x,l.y);}return c;}
function exportPNG(){const blockers=getExportBlockers();if(blockers.length){alert(`Cannot export PNG. Missing visible assets:\n${blockers.join('\n')}`);return;}const c=buildExportCanvas();c.toBlob(blob=>{if(blob)downloadBlob(blob,'apple2-composition.png');else alert('PNG export failed.');},'image/png');}
$('exportBtn').addEventListener('click',exportPNG);

refreshUI();renderPreview();
</script>
</body>
</html>
