name: Device attachment UI acceptance

permissions:
  contents: read

on:
  push:
    paths:
      - "res/EMU_apple2main.js"
      - "res/EMU_apple2io.js"
      - "res/EMU_CARD_LIRON.js"
      - "res/EMU_DEVICE_UNIDISK35.js"
      - "res/EMU_DEVICE_HD20.js"
      - "index.html"
      - "tests/device_attachment_ui.test.js"
      - "tests/device_instance_identity.test.js"
      - "tests/liron_iwm.test.js"
      - "tests/liron_smartport_bus.test.js"
      - "tests/liron_smartport_transport.test.js"
      - "tests/liron_readblock.test.js"
      - "tests/liron_writeblock.test.js"
      - "tests/smartport_port_metadata.test.js"
      - "tests/hd20_smartport_device.test.js"
      - "tests/hd20_writeblock.test.js"
      - "tests/hd20_media_routing.test.js"
      - "tests/hd20_toolbox_media.test.js"
      - "tests/liron_browser_mount.test.js"
      - "tests/liron_toolbox.test.js"
      - "tests/liron_toolbox_eject.test.js"
      - "tests/liron_loader_diagnostics.test.js"
      - ".github/workflows/device-attachment-ui-iteration.yml"
  pull_request:
    paths:
      - "res/EMU_apple2main.js"
      - "res/EMU_apple2io.js"
      - "res/EMU_CARD_LIRON.js"
      - "res/EMU_DEVICE_UNIDISK35.js"
      - "res/EMU_DEVICE_HD20.js"
      - "index.html"
      - "tests/device_attachment_ui.test.js"
      - "tests/device_instance_identity.test.js"
      - "tests/liron_iwm.test.js"
      - "tests/liron_smartport_bus.test.js"
      - "tests/liron_smartport_transport.test.js"
      - "tests/liron_readblock.test.js"
      - "tests/liron_writeblock.test.js"
      - "tests/smartport_port_metadata.test.js"
      - "tests/hd20_smartport_device.test.js"
      - "tests/hd20_writeblock.test.js"
      - "tests/hd20_media_routing.test.js"
      - "tests/hd20_toolbox_media.test.js"
      - "tests/liron_browser_mount.test.js"
      - "tests/liron_toolbox.test.js"
      - "tests/liron_toolbox_eject.test.js"
      - "tests/liron_loader_diagnostics.test.js"
      - ".github/workflows/device-attachment-ui-iteration.yml"
  workflow_dispatch:

jobs:
  device-attachment-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Cover attachment identity, IWM/SmartPort transport, writable HD20 media, and legacy Liron behavior.
      - name: Syntax checks
        run: |
          node --check res/EMU_apple2main.js
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --check res/EMU_DEVICE_HD20.js
          node --check tests/device_attachment_ui.test.js
          node --check tests/device_instance_identity.test.js
          node --check tests/liron_iwm.test.js
          node --check tests/liron_smartport_bus.test.js
          node --check tests/liron_smartport_transport.test.js
          node --check tests/liron_readblock.test.js
          node --check tests/liron_writeblock.test.js
          node --check tests/smartport_port_metadata.test.js
          node --check tests/hd20_smartport_device.test.js
          node --check tests/hd20_writeblock.test.js
          node --check tests/hd20_media_routing.test.js
          node --check tests/hd20_toolbox_media.test.js
          node --check tests/liron_browser_mount.test.js
          node --check tests/liron_toolbox.test.js
          node --check tests/liron_toolbox_eject.test.js
          node --check tests/liron_loader_diagnostics.test.js
      - name: Device attachment acceptance
        run: |
          node --test \
            tests/device_attachment_ui.test.js \
            tests/device_instance_identity.test.js \
            tests/liron_iwm.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js \
            tests/liron_readblock.test.js \
            tests/liron_writeblock.test.js \
            tests/smartport_port_metadata.test.js \
            tests/hd20_smartport_device.test.js \
            tests/hd20_writeblock.test.js \
            tests/hd20_media_routing.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/liron_browser_mount.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/liron_loader_diagnostics.test.js
