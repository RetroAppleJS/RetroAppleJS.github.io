name: Device attachment UI acceptance

permissions:
  contents: write

on:
  push:
    paths:
      - "tools/patch_smartport_write_format.py"
      - ".github/workflows/device-attachment-ui-iteration.yml"
  workflow_dispatch:

jobs:
  device-attachment-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply SmartPort WRITE BLOCK and FORMAT patch
        run: python3 tools/patch_smartport_write_format.py
      - name: Syntax checks
        run: |
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_HD20.js
          node --check tests/hd20_writeblock.test.js
          node --check tests/liron_writeblock.test.js
      - name: SmartPort write-format acceptance
        run: |
          node --test \
            tests/hd20_writeblock.test.js \
            tests/liron_writeblock.test.js \
            tests/liron_readblock.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js
      - name: Commit patched SmartPort transport
        run: |
          if git diff --quiet -- res/EMU_CARD_LIRON.js; then
            echo "No SmartPort transport changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_CARD_LIRON.js
          git diff --cached --check
          git commit -m "feat: add SmartPort WRITE BLOCK and FORMAT transport"
          git push origin HEAD:${GITHUB_REF_NAME}
