name: Liron UniDisk surface map Task 3 native
permissions:
  contents: write
on:
  push:
    branches:
      - feature/liron-unidisk-surface-map
    paths:
      - .github/workflows/liron-unidisk-surface-map-task3-native.yml
jobs:
  task3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-surface-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: RED capability action strip
        shell: bash
        run: |
          cat >> tests/liron_toolbox.test.js <<'TEST'

          test('shared media row renders ordered optional capability actions after Download', () => {
              const context=vm.createContext({
                  console,
                  oEMU:{component:{IO:{ACTION_MAP:[]}},system:{A2P:{active:true}}},
                  oEMUI:{slotConfig(){},slotsRender(){},deviceBtn(){}}
              });
              vm.runInContext(apple2ioSource,context,{filename:'EMU_apple2io.js'});
              const html=context.EMU_deviceMediaRowHTML({
                  label:'UNIDISK Unit1',downloadID:'d1',downloadOnClick:'download1()',downloadTitle:'Save disk',
                  capabilityActions:[
                      {id:'map1',icon:'fa fa-th',title:'Disk Surface Map',onClick:'map1()'},
                      {id:'off1',icon:'fa fa-ban',title:'Unavailable',onClick:'bad()',disabled:true}
                  ]
              });
              assert.ok(html.indexOf('fa-cloud-download-alt') < html.indexOf('id="map1"'));
              assert.ok(html.indexOf('id="map1"') < html.indexOf('id="off1"'));
              assert.match(html,/id="map1"[^>]*title="Disk Surface Map"[^>]*onclick="map1\(\)"/);
              const disabled=html.match(/<button[^>]*id="off1"[^>]*>/)[0];
              assert.match(disabled,/disabled/);
              assert.doesNotMatch(disabled,/onclick=/);
          });
          TEST
          set +e
          node --test tests/liron_toolbox.test.js > /tmp/task3-red.log 2>&1
          rc=$?
          cat /tmp/task3-red.log
          test "$rc" -ne 0
      - name: GREEN action strip renderer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_apple2io.js')
          s=p.read_text()
          old='''        + "      <button class=appbut value=\\"Download\\""\n        + (spec.downloadID ? " id=\\\""+attr(spec.downloadID)+"\\\"" : "")\n        + (spec.downloadDisabled ? " disabled" : (spec.downloadOnClick ? " onclick=\\\""+spec.downloadOnClick+"\\\"" : ""))\n        + " title=\\\""+attr(downloadTitle)+"\\\" style=\\\"float:right\\\">"\n        + "<i class=\\\"fa fa-cloud-download-alt\\\"></i></button>"\n        + "    </div>";'''
          new='''        + "      <span style=\\"float:right;white-space:nowrap\\">"\n        + "<button class=appbut value=\\"Download\\""\n        + (spec.downloadID ? " id=\\\""+attr(spec.downloadID)+"\\\"" : "")\n        + (spec.downloadDisabled ? " disabled" : (spec.downloadOnClick ? " onclick=\\\""+spec.downloadOnClick+"\\\"" : ""))\n        + " title=\\\""+attr(downloadTitle)+"\\\">"\n        + "<i class=\\\"fa fa-cloud-download-alt\\\"></i></button>"\n        + (function()\n          {\n              var out=\"\";\n              var actions=Array.isArray(spec.capabilityActions) ? spec.capabilityActions : [];\n              for(var i=0;i<actions.length;i++)\n              {\n                  var action=actions[i] || {};\n                  out += "<button class=\\\"appbut\\\""\n                      + (action.id ? " id=\\\""+attr(action.id)+"\\\"" : "")\n                      + (action.disabled ? " disabled" : (action.onClick ? " onclick=\\\""+action.onClick+"\\\"" : ""))\n                      + " title=\\\""+attr(action.title || "")+"\\\">"\n                      + "<i class=\\\""+attr(action.icon || "fa fa-circle")+"\\\"></i></button>";\n              }\n              return out;\n          })()\n        + "</span>"\n        + "    </div>";'''
          if old not in s: raise SystemExit('shared media download renderer marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check res/EMU_apple2io.js
          node --check tests/liron_toolbox.test.js
          node --test tests/liron_toolbox.test.js
      - name: Verify Disk II source unchanged
        shell: bash
        run: |
          git diff --exit-code HEAD -- res/EMU_CARD_appledisk2.js
      - name: Commit Task 3
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/liron-unidisk-surface-map-task3-native.yml
          git add res/EMU_apple2io.js tests/liron_toolbox.test.js .github/workflows/liron-unidisk-surface-map-task3-native.yml
          git commit -m "feat: add per-device media row actions"
          git push origin HEAD:feature/liron-unidisk-surface-map
