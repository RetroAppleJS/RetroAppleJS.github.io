name: Temporary HD20 gzip media support

permissions:
  contents: write

on:
  push:
    branches: ["feature/hd20-po-gz"]
    paths:
      - ".github/workflows/hd20-po-gz-temp.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hd20-po-gz
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: RED - encode HD20 gzip behavior
        shell: bash
        run: |
          python3 tests/_tmp_hd20_gzip_red.py
          set +e
          node --test tests/hd20_toolbox_media.test.js
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected RED failure, but gzip regression tests passed before implementation."
            exit 1
          fi
          echo "RED confirmed: current HD20 media path has no .po.gz support."

      - name: GREEN - implement HD20 gzip behavior
        shell: bash
        run: |
          python3 tests/_tmp_hd20_gzip_green.py
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_CARD_LIRON.js')
          s=p.read_text()
          lines=[]
          for line in s.splitlines(True):
              if 'gzip support unavailable' not in line and 'if(typeof(pako)' in line and 'pako.ungzip' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+'if(typeof pako === "undefined" || !pako || !pako.ungzip)\n'
              elif 'gzip support unavailable' not in line and 'if(typeof(pako)' in line and 'pako.gzip' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+'if(typeof pako === "undefined" || !pako || !pako.gzip)\n'
              lines.append(line)
          p.write_text(''.join(lines))
          PY

      - name: Verify HD20 gzip and SmartPort regression suite
        shell: bash
        run: |
          node --check res/EMU_DEVICE_HD20.js
          node --check res/EMU_CARD_LIRON.js
          node --check tests/hd20_toolbox_media.test.js
          node --test \
            tests/device_attachment_ui.test.js \
            tests/device_instance_identity.test.js \
            tests/liron_iwm.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js \
            tests/liron_readblock.test.js \
            tests/liron_writeblock.test.js \
            tests/smartport_port_metadata.test.js \
            tests/hd20_smartport_device.test.js \
            tests/hd20_writeblock.test.js \
            tests/hd20_media_routing.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/hd20_surface_map.test.js \
            tests/liron_browser_mount.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/liron_loader_diagnostics.test.js

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/hd20-po-gz-temp.yml tests/_tmp_hd20_gzip_red.py tests/_tmp_hd20_gzip_green.py
          git add res/EMU_DEVICE_HD20.js res/EMU_CARD_LIRON.js tests/hd20_toolbox_media.test.js
          git commit -m "feat: support gzip HD20 media images"
          git fetch origin feature/hd20-po-gz
          git rebase origin/feature/hd20-po-gz
          git push origin HEAD:feature/hd20-po-gz
