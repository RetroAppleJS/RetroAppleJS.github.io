          new="""        var filename=exportable ? String(device.getSuggestedFilename() || (hardDisk ? "HD20.po" : "UNIDISK.po")) : "";
        var downloadFilename=deviceToolArchiveFilename(filename,hardDisk);
        var displayFilename=hardDisk"""
          if old not in s:
