name: HD20 media integration patch temp

permissions:
  contents: write

on:
  push:
    paths:
      - "tools/patch_hd20_media_integration.py"
      - ".github/workflows/hd20-media-integration-temp.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-smartport-device-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply HD20 media integration patch
        run: python3 tools/patch_hd20_media_integration.py
      - name: Verify syntax and SmartPort media regressions
        run: |
          node --check res/EMU_apple2main.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_HD20.js
          node --test \
            tests/device_attachment_ui.test.js \
            tests/device_instance_identity.test.js \
            tests/liron_smartport_bus.test.js \
            tests/smartport_port_metadata.test.js \
            tests/hd20_smartport_device.test.js \
            tests/hd20_media_routing.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/liron_browser_mount.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_loader_diagnostics.test.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2main.js res/EMU_CARD_LIRON.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: route HD20 SmartPort media by unit"
          git push
