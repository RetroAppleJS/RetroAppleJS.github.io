name: Temporary STEP TRACE breakpoint scenario completion

permissions:
  contents: write

on:
  push:
    branches: ["feat/steptrace-breakpoint-scenario-complete"]
    paths:
      - ".github/workflows/steptrace-breakpoint-scenario-complete-temp.yml"

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steptrace-breakpoint-scenario-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply remaining breakpoint-scenario implementation
        env:
          CORE_B64: >-
            
          HARNESS_B64: >-
            
          INFLATE_TEST_B64: >-
            
        shell: bash
        run: |
          python3 <<'PY'
          import base64,gzip,os
          from pathlib import Path
          def unpack(env,path):
              data=gzip.decompress(base64.b64decode(os.environ[env]))
              Path(path).write_bytes(data)
          unpack('CORE_B64','/tmp/steptrace-core.patch')
          unpack('HARNESS_B64','asm/_TODO/INFLATE_ASM_CORE_testbench.js')
          unpack('INFLATE_TEST_B64','tests/inflate_steptrace_harness.test.js')
          PY
          git apply /tmp/steptrace-core.patch
          python3 <<'PY'
          from pathlib import Path

          # Add the visible, assembly-owned eternal test loop.
          asm=Path('asm/_TODO/INFLATE_ASM_CORE.S')
          s=asm.read_text()
          if 'inflate_test_loop' not in s:
              marker='\n        .END'
              if marker not in s:
                  raise SystemExit('INFLATE .END marker not found')
              driver='''\n\n; STEP TRACE breakpoint-driven validation driver.\n; $0D10 is deliberately outside inflate scratch/data ($0A00-$0CFC)\n; and its guard area. The live 6502 owns the loop; scenario JavaScript only\n; prepares a vector at inflate_test_loop and verifies it at inflate_test_done.\n        ORG     $0D10\ninflate_test_loop\n        JSR     inflate\ninflate_test_done\n        JMP     inflate_test_loop\n'''
              s=s.replace(marker,driver+marker,1)
              asm.write_text(s)

          # Bring the user manual in line with breakpoint-action semantics.
          manual=Path('docs/STEP_TRACE_MANUAL.md')
          m=manual.read_text()
          m=m.replace(
              'After a condition matches, it is one-shot/disarmed. The expression remains in the editor and can be armed again with one click.',
              'In the default **HALT at breakpoint** mode, a match is one-shot/disarmed and the expression remains in the editor for re-arming. In **RUN script at breakpoint** mode, a successful scenario callback leaves the same BREAK IF armed so an assembly-owned loop can trigger it repeatedly.'
          )
          m=m.replace(
              'When the condition is false, execution continues and the condition remains armed. When it becomes true, STEP TRACE stops at the clean instruction boundary **before the next opcode at that boundary is fetched or executed**. The main execution pictogram becomes `fa-parking`.',
              'When the condition is false, execution continues and the condition remains armed. When it becomes true, STEP TRACE reaches the clean instruction boundary **before the next opcode at that boundary is fetched or executed**. In HALT mode it stops there and shows `fa-parking`; in RUN-script mode it executes the registered scenario callback synchronously and then continues through that opcode unless the callback requests a halt or fails.'
          )
          anchor='The condition can stop fixed-IPS execution, Max/SYSTEM execution, Step Over, or Step Out because the observer is evaluated by the live CPU at instruction boundaries.\n\n---\n\n## 9. LISTING column control'
          section='''The condition can stop fixed-IPS execution, Max/SYSTEM execution, Step Over, or Step Out because the observer is evaluated by the live CPU at instruction boundaries.\n\n### STEP TRACE SCENARIO — breakpoint actions\n\nThe code pictogram opens the **STEP TRACE SCENARIO** companion. Its action control has two states and does not start, pause, step, or otherwise own the emulator:\n\n- `<i class="fa fa-pause"></i>` **HALT at breakpoint** — default. A true BREAK IF behaves as an ordinary STEP TRACE stop.\n- `<i class="fa fa-sign-in-alt"></i>` **RUN script at breakpoint** — the editor is evaluated once, must register exactly one `onBreakpoint(fn)` callback, and that persistent callback runs on every true BREAK IF match.\n\nThe callback runs synchronously at the clean boundary before the matching opcode. It receives `A`, `X`, `Y`, `SP`, `P`, `PC`, `INS`, the armed condition text, and the 1-based hit count. A normal return leaves BREAK IF armed and execution continues. Calling `haltAtBreakpoint()` converts the current match into the normal STEP TRACE halt and returns the scenario control to HALT mode. Callback exceptions, async returns, or re-entry also fail safe to the same halt.\n\nClosing the scenario popup does not disarm an active callback; reopening derives the control state from the debugger runtime. **Ctrl/Cmd+Enter** while editing performs the same HALT-to-RUN arm operation and never starts the CPU.\n\nScenario symbols come only from the symbol table loaded into STEP TRACE. The same case-insensitive labels/EQU values are usable in BREAK IF and through `sym()`, `symbol()`, and `symbols()`. For example:\n\n```text\nPC==inflate_test_loop || PC==inflate_test_done\n```\n\nA repeated test therefore belongs in the 6502 control flow itself, for example an assembly loop that calls the routine and jumps back. JavaScript prepares input at the loop breakpoint, validates output at the done breakpoint, advances its own vector index, and finally calls `haltAtBreakpoint()`.\n\nMigration from the former scenario runner is deliberately explicit: `scenario()`, `cpu.start()`, scenario-owned `breakIf()`, `reset()`, `buildInfo()`, and `syncBuild()` are removed. `STB.assert()` accepts a JavaScript boolean rather than a STEP TRACE expression string. The special **LOAD LIVE** workflow is gone; use the normal assembler/emulator workflow and load the desired symbols into STEP TRACE.\n\n---\n\n## 9. LISTING column control'''
          if '### STEP TRACE SCENARIO — breakpoint actions' not in m:
              if anchor not in m:
                  raise SystemExit('STEP TRACE manual insertion anchor not found')
              m=m.replace(anchor,section,1)
          symbol_anchor='The tooltip provides file name and more detailed counts.\n\n---'
          symbol_text='''The tooltip provides file name and more detailed counts.\n\nLoaded labels and EQU symbols also form the symbolic constant table used by `BREAK IF` and STEP TRACE SCENARIO. Name lookup is case-insensitive, and replacing or clearing the loaded symbol file replaces or clears that table atomically; there is no assembler-symbol fallback.\n\n---'''
          if 'symbolic constant table used by `BREAK IF`' not in m:
              if symbol_anchor not in m:
                  raise SystemExit('STEP TRACE symbol documentation anchor not found')
              m=m.replace(symbol_anchor,symbol_text,1)
          quick='| Main Run/Pause | start execution after arming, or pause execution |'
          quick_new='''| Scenario `fa-pause` | HALT at breakpoint; BREAK IF pauses normally |\n| Scenario `fa-sign-in-alt` | RUN script at breakpoint and continue after a successful callback |\n| Main Run/Pause | start execution after arming, or pause execution |'''
          if 'Scenario `fa-sign-in-alt`' not in m and quick in m:
              m=m.replace(quick,quick_new,1)
          hit_old='''3. a true result stops the active execution owner without consuming the target opcode;\n4. the breakpoint becomes disarmed/one-shot after the hit;\n5. the Run/Pause control changes to the parking icon.'''
          hit_new='''3. a true result reaches the breakpoint-action router without consuming the target opcode;\n4. with no RUN scenario action, the breakpoint disarms and stops exactly as before;\n5. a successful RUN callback leaves the condition armed and returns control to the emulator so the target opcode executes next;\n6. `haltAtBreakpoint()`, callback failure, async return, or re-entry clears the action and stops at that same boundary.'''
          if hit_old in m:
              m=m.replace(hit_old,hit_new,1)
          manual.write_text(m)

          # Pin the manual contract in the scenario regression file.
          t=Path('tests/debugger_steptrace_scenario.test.js')
          text=t.read_text()
          if "manual documents breakpoint-driven scenario workflow" not in text:
              text += '''\n\ntest('manual documents breakpoint-driven scenario workflow',()=>{\n  const manual=fs.readFileSync(path.join(__dirname,'..','docs','STEP_TRACE_MANUAL.md'),'utf8');\n  for(const phrase of ['HALT at breakpoint','RUN script at breakpoint','onBreakpoint','haltAtBreakpoint','PC==inflate_test_loop || PC==inflate_test_done']) assert.match(manual,new RegExp(phrase.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')));\n  assert.match(manual,/normal assembler\/emulator workflow/);\n});\n'''
              t.write_text(text)

          # PR #93 accidentally merged only staging payload chunks; remove them now.
          tmp=Path('.superpowers-tmp/steptrace-finish')
          if tmp.exists():
              for p in tmp.glob('core.*'):
                  p.unlink()
          PY
      - name: Verify focused STEP TRACE regressions
        shell: bash
        run: |
          node --check res/EMU_apple2debug.js
          node --check res/DBG_steptrace_scenario.js
          node --check asm/_TODO/INFLATE_ASM_CORE_testbench.js
          node --test \
            tests/cpu_execution_condition.test.js \
            tests/debugger_steptrace_scenario.test.js \
            tests/debugger_testbench_loader.test.js \
            tests/inflate_steptrace_harness.test.js
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/steptrace-breakpoint-scenario-complete-temp.yml
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add \
            res/EMU_apple2debug.js \
            tests/cpu_execution_condition.test.js \
            tests/debugger_steptrace_scenario.test.js \
            asm/_TODO/INFLATE_ASM_CORE.S \
            asm/_TODO/INFLATE_ASM_CORE_testbench.js \
            tests/inflate_steptrace_harness.test.js \
            docs/STEP_TRACE_MANUAL.md
          git add -u .superpowers-tmp .github/workflows
          git commit -m "feat: complete STEP TRACE breakpoint scenarios"
          git fetch origin feat/steptrace-breakpoint-scenario-complete
          git rebase origin/feat/steptrace-breakpoint-scenario-complete
          git push origin HEAD:feat/steptrace-breakpoint-scenario-complete
