name: Dithertizer fallback temp

permissions:
  contents: write

on:
  push:
    branches:
      - fix/dithertizer-no-camera-hgr-fallback
  pull_request:
    paths:
      - 'res/EMU_CARD_dithertizer.js'
      - 'tests/dithertizer_foundation.test.js'
      - 'tests/dithertizer_camera_toggle.test.js'
      - '.github/workflows/dithertizer-fallback-temp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dithertizer-no-camera-hgr-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair accidental strict-inequality typos and push once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('res/EMU_CARD_dithertizer.js')
          s=p.read_text()
          count=s.count('!===')
          print('accidental operators:',count)
          if count:
              p.write_text(s.replace('!===','!=='))
          PY
          if ! git diff --quiet -- res/EMU_CARD_dithertizer.js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add res/EMU_CARD_dithertizer.js
            git commit -m 'fix: repair Dithertizer strict inequality typos'
            git push origin HEAD:fix/dithertizer-no-camera-hgr-fallback
            exit 0
          fi
      - run: node --check res/EMU_CARD_dithertizer.js
      - run: node --test tests/dithertizer_foundation.test.js tests/dithertizer_camera_toggle.test.js
