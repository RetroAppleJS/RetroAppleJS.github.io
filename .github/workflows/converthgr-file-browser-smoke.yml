name: ConvertHGR file browser smoke

on:
  push:
    branches:
      - fix/converthgr-shared-worker-end-to-end

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Chromium file:// camera + DSCAN smoke
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome executable found" >&2
            exit 1
          fi
          "$CHROME" --version

          cat > /tmp/converthgr-browser-smoke.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function waitForDebugPort() {
            let last;
            for (let i = 0; i < 100; i++) {
              try {
                const r = await fetch('http://127.0.0.1:9222/json/list');
                if (r.ok) return await r.json();
              } catch (e) { last = e; }
              await sleep(100);
            }
            throw last || new Error('Chrome DevTools port did not become ready');
          }

          const pages = await waitForDebugPort();
          const page = pages.find(p => p.type === 'page');
          if (!page || !page.webSocketDebuggerUrl)
            throw new Error('No Chrome page target found');

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, {once:true});
            ws.addEventListener('error', reject, {once:true});
          });

          let nextId = 1;
          const pending = new Map();
          const browserErrors = [];
          ws.addEventListener('message', event => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              const {resolve, reject} = pending.get(msg.id);
              pending.delete(msg.id);
              if (msg.error) reject(new Error(JSON.stringify(msg.error)));
              else resolve(msg.result);
              return;
            }
            if (msg.method === 'Runtime.exceptionThrown')
              browserErrors.push(msg.params?.exceptionDetails?.text || 'Runtime exception');
            if (msg.method === 'Runtime.consoleAPICalled' && msg.params?.type === 'error')
              browserErrors.push((msg.params.args || []).map(a => a.value || a.description || '').join(' '));
            if (msg.method === 'Log.entryAdded' && msg.params?.entry?.level === 'error')
              browserErrors.push(msg.params.entry.text || 'Log error');
          });

          function send(method, params={}) {
            const id = nextId++;
            return new Promise((resolve, reject) => {
              pending.set(id, {resolve, reject});
              ws.send(JSON.stringify({id, method, params}));
            });
          }

          async function evaluate(expression, awaitPromise=true) {
            const result = await send('Runtime.evaluate', {
              expression,
              awaitPromise,
              returnByValue: true,
              userGesture: true
            });
            if (result.exceptionDetails)
              throw new Error(result.exceptionDetails.text + ': ' + (result.exceptionDetails.exception?.description || ''));
            return result.result?.value;
          }

          await send('Runtime.enable');
          await send('Log.enable');
          await send('Page.enable');

          let ready = false;
          for (let i = 0; i < 200; i++) {
            ready = await evaluate(`document.readyState === 'complete' &&
              typeof DithertizerII === 'function' &&
              typeof DithertizerConvertHGRAdapter === 'function' &&
              typeof CONVERTHGR_WORKER_SOURCE === 'string' &&
              CONVERTHGR_WORKER_SOURCE.length > 1000`);
            if (ready) break;
            await sleep(100);
          }
          if (!ready) throw new Error('Dithertizer/ConvertHGR scripts did not initialize from file://');

          const setup = await evaluate(`(() => {
            const card = new DithertizerII();
            window.__smokeCard = card;
            const controlID = 'dither_ctrl_S7';
            const holder = document.createElement('div');
            holder.id = 'converthgr-smoke-holder';
            holder.innerHTML = card.deviceToolSlotHTML({toolboxID:'converthgr_smoke_tool',slotID:'S7',slotN:7});
            document.body.appendChild(holder);
            const tool = document.getElementById('converthgr_smoke_tool');
            if (tool) tool.hidden = false;
            const button = document.getElementById(controlID + '_camera');
            const status = document.getElementById(controlID + '_camera_status');
            if (!button || !status) throw new Error('Camera UI was not generated');

            function capture() {
              const writes = [];
              card.writeSlotIO(0, 0x80, {});
              card.readSlotIO(8, {
                bRO:false,
                vid:{state:{page2:false}},
                hw:{write(a,d){writes.push([a & 0xffff, d & 0xff]);}}
              });
              const data = writes.map(x => x[1]);
              return {
                count:writes.length,
                nonzero:data.filter(x => x !== 0).length,
                unique:[...new Set(data)].length,
                first:data.slice(0,16)
              };
            }

            window.__smokeCapture = capture;
            window.__smokeBefore = capture();
            window.__smokePromise = null;
            button.onclick = function() {
              window.__smokePromise = card.deviceToolCameraToggle(controlID);
            };
            button.click();
            return {
              href:location.href,
              initialStatus:status.textContent,
              workerBytes:CONVERTHGR_WORKER_SOURCE.length,
              before:window.__smokeBefore
            };
          })()`);

          console.log('SETUP', JSON.stringify(setup));
          if (!String(setup.href || '').startsWith('file://'))
            throw new Error('Smoke page was not loaded via file://');
          if (!setup.before || setup.before.count !== 192 * 40)
            throw new Error('Baseline DSCAN did not write a full HGR frame');
          if (setup.before.nonzero !== 0)
            throw new Error('Baseline DSCAN was expected to be black before camera startup');

          const started = await evaluate(`window.__smokePromise`);
          console.log('CAMERA_START_RESULT', JSON.stringify(started));
          if (started !== true)
            throw new Error('Camera toggle did not resolve true');

          await sleep(900);

          const final = await evaluate(`(() => {
            const controlID = 'dither_ctrl_S7';
            const button = document.getElementById(controlID + '_camera');
            const status = document.getElementById(controlID + '_camera_status');
            const after = window.__smokeCapture();
            return {
              status:status && status.textContent,
              pressed:button && button.getAttribute('aria-pressed'),
              after
            };
          })()`);
          console.log('FINAL', JSON.stringify(final));

          if (final.status !== 'ON')
            throw new Error('Camera status did not remain ON: ' + final.status);
          if (final.pressed !== 'true')
            throw new Error('Camera button aria-pressed did not remain true');
          if (!final.after || final.after.count !== 192 * 40)
            throw new Error('DSCAN did not write a full 7680-byte HGR frame');
          if (final.after.nonzero === 0)
            throw new Error('DSCAN frame remained black after converted camera frame publication');
          if (final.after.unique < 2)
            throw new Error('DSCAN frame did not contain varying converted HGR bytes');

          const relevantErrors = browserErrors.filter(e =>
            /Dithertizer|ConvertHGR|worker|camera|fetch|cross origin|wasm/i.test(e)
          );
          if (relevantErrors.length) {
            console.error('BROWSER_ERRORS', JSON.stringify(relevantErrors));
            throw new Error('Relevant browser console/runtime errors were observed');
          }

          console.log('SMOKE_PASS file:// camera stayed ON; ConvertHGR startup completed; DSCAN received non-black varying HGR bytes');
          ws.close();
          NODE

          PROFILE="$(mktemp -d)"
          LOG=/tmp/converthgr-chrome.log
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE" \
            --use-fake-device-for-media-stream \
            --use-fake-ui-for-media-stream \
            --allow-file-access-from-files \
            "file://$GITHUB_WORKSPACE/index.html" \
            >"$LOG" 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true; echo "--- Chrome log ---"; tail -200 "$LOG" || true' EXIT

          node /tmp/converthgr-browser-smoke.mjs
