name: Apply device unit controls patch

permissions:
  contents: write

on:
  push:
    branches:
      - feat/device-unit-controls
    paths:
      - ".github/workflows/zz-apply-device-unit-controls.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/device-unit-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python3 tools/one_shot_device_unit_patch.py
      - name: Verify focused patch
        run: |
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_LIRON.js
          node --check tests/device_attachment_ui.test.js
          node --check tests/liron_smartport_bus.test.js
          node --test tests/device_attachment_ui.test.js tests/liron_smartport_bus.test.js
      - name: Commit patch and remove one-shot helpers
        run: |
          rm .github/workflows/zz-apply-device-unit-controls.yml tools/one_shot_device_unit_patch.py
          git config user.name "RetroAppleJS automation"
          git config user.email "actions@users.noreply.github.com"
          git add res/EMU_apple2io.js res/EMU_CARD_LIRON.js tests/liron_smartport_bus.test.js .github/workflows/zz-apply-device-unit-controls.yml tools/one_shot_device_unit_patch.py
          git commit -m "feat: add device unit controls"
          git push origin HEAD:feat/device-unit-controls
