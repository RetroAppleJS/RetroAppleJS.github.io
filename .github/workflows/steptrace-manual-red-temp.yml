name: Temporary STEP TRACE manual RED

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/steptrace-breakpoint-scenario-manual
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove manual contract is RED
        shell: bash
        run: |
          set +e
          node --test tests/debugger_steptrace_scenario.test.js > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED but test suite passed.' >&2
            exit 1
          fi
          grep -q 'manual documents breakpoint-driven scenarios' /tmp/red.log
          grep -Eq 'HALT at breakpoint|RUN script at breakpoint|onBreakpoint|haltAtBreakpoint|inflate_test_loop' /tmp/red.log
          echo 'RED confirmed: manual lacks breakpoint-scenario guidance.'
