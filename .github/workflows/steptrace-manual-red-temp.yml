name: Temporary STEP TRACE manual RED

on:
  pull_request:
    branches: ["main"]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steptrace-breakpoint-scenario-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove manual contract is RED
        shell: bash
        run: |
          set +e
          node --test tests/debugger_steptrace_scenario.test.js > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED but manual test passed.' >&2
            exit 1
          fi
          grep -q 'manual documents breakpoint-driven scenarios' /tmp/red.log
          echo 'RED confirmed: active manual does not yet describe the breakpoint-scenario workflow.'
