name: Temporary persistent Disk II layer ID migration

permissions:
  contents: write

on:
  push:
    branches: ["refactor/persistent-diskii-layer-ids"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/persistent-diskii-layer-ids
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply persistent layer ID migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'{path}: expected one old pattern, found {s.count(old)}')
                  p.write_text(s.replace(old,new,1))
                  return
              if new in s:
                  return
              raise SystemExit(f'{path}: neither old nor new pattern found')

          # Runtime compositor: semantic IDs come only from the emulator layout schema.
          p = Path('res/COM_A2P_LAYOUT.js')
          s = p.read_text()
          legacy = '''function legacyDiskIILayerId(layer)
          {
              if(!layer || typeof layer.file != "string") return null;

              if(layer.file == "A2P_FULL_DISKII_LED.png")
                  return layer.x < 300 ? "A2P.DISKII.D1.LED" : "A2P.DISKII.D2.LED";

              if(layer.file == "A2P_FULL_DISKII_LID.png")
                  return layer.x < 400 ? "A2P.DISKII.D1.LID" : "A2P.DISKII.D2.LID";

              return null;
          }

          '''
          if legacy in s:
              s = s.replace(legacy,'',1)
          elif 'legacyDiskIILayerId' in s:
              raise SystemExit('res/COM_A2P_LAYOUT.js: unexpected legacy helper shape')
          old = '        var id = validateLayerId(layer.id,index) || legacyDiskIILayerId(layer);'
          new = '        var id = validateLayerId(layer.id,index);'
          if old in s:
              s = s.replace(old,new,1)
          if old in s or 'legacyDiskIILayerId' in s:
              raise SystemExit('res/COM_A2P_LAYOUT.js: legacy Disk II inference remains')
          p.write_text(s)

          ids = {
              ('A2P_FULL_DISKII_LED.png',154): 'A2P.DISKII.D1.LED',
              ('A2P_FULL_DISKII_LED.png',545): 'A2P.DISKII.D2.LED',
              ('A2P_FULL_DISKII_LID.png',207): 'A2P.DISKII.D1.LID',
              ('A2P_FULL_DISKII_LID.png',591): 'A2P.DISKII.D2.LID'
          }

          def migrate_layout(obj, label):
              found = set()
              for layer in obj.get('layers',[]):
                  key = (layer.get('file'), layer.get('x'))
                  if key in ids:
                      layer['id'] = ids[key]
                      found.add(key)
              if found != set(ids):
                  raise SystemExit(f'{label}: expected four Disk II layers, found {sorted(found)}')
              return obj

          for filename in [
              'tools/GUI_DEV/assets/apple2-layout.json',
              'tools/GUI_DEV/assets/apple2-layout-embedded.json'
          ]:
              p = Path(filename)
              obj = migrate_layout(json.loads(p.read_text()),filename)
              p.write_text(json.dumps(obj,indent=2) + '\n')

          p = Path('res/COM_LAYOUT_CONFIG.js')
          src = p.read_text()
          prefix = 'var composer =\n'
          if not src.startswith(prefix):
              raise SystemExit('COM_LAYOUT_CONFIG.js: unexpected prefix')
          body = src[len(prefix):].rstrip()
          if not body.endswith(';'):
              raise SystemExit('COM_LAYOUT_CONFIG.js: expected trailing semicolon')
          obj = migrate_layout(json.loads(body[:-1]),'COM_LAYOUT_CONFIG.js')
          p.write_text(prefix + json.dumps(obj,indent=2) + ';\n')

          # Composer: editor identity is private uid; id belongs to emulator schema.
          path = 'tools/GUI_DEV/apple2-system-composer.html'
          p = Path(path)
          s = p.read_text()

          replacements = [
              ('.field input[type=number]{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;background:#fff}',
               '.field input[type=number],.field input[type=text]{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;background:#fff}'),
              ('          <div id="selectedFilename" class="filename"></div>\n          <div class="field-grid">',
               '          <div id="selectedFilename" class="filename"></div>\n          <div class="field"><label for="runtimeIdInput">Runtime ID</label><input id="runtimeIdInput" type="text" placeholder="optional semantic runtime ID"></div>\n          <div class="field-grid">'),
              ('const state={layers:[],selectedLayerId:null,assets:new Map(),dragging:null};',
               'const state={layers:[],selectedLayerUid:null,assets:new Map(),dragging:null};'),
              ('function getSelectedLayer(){ return state.layers.find(l=>l.id===state.selectedLayerId)||null; }',
               'function getSelectedLayer(){ return state.layers.find(l=>l.uid===state.selectedLayerUid)||null; }'),
              ('function setLayers(layers){ state.layers=layers; state.selectedLayerId=layers[0]?.id||null; refreshUI(); renderPreview(); }',
               'function setLayers(layers){ state.layers=layers; state.selectedLayerUid=layers[0]?.uid||null; refreshUI(); renderPreview(); }')
          ]
          for old,new in replacements:
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'{path}: expected one match for {old[:40]!r}')
                  s = s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'{path}: missing old/new pattern {old[:40]!r}')

          old_validate = '''function validateLayout(raw){
            if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('Layout must be a JSON object.');
            if(raw.version!==LAYOUT_VERSION) throw new Error(`Unsupported layout version; expected version ${LAYOUT_VERSION}.`);
            if(!raw.canvas || raw.canvas.width!==CANVAS_W || raw.canvas.height!==CANVAS_H) throw new Error('Canvas must be exactly 1144 × 1144.');
            if(!Array.isArray(raw.layers)) throw new Error('Layout layers must be an array.');
            const assets=validateAssets(raw.assets);
            const layers=raw.layers.map((l,i)=>{
              if(!l || typeof l!=='object') throw new Error(`Layer ${i+1} is malformed.`);
              if(typeof l.file!=='string' || !l.file.trim()) throw new Error(`Layer ${i+1} filename must be non-empty.`);
              if(!Number.isInteger(l.x) || !Number.isInteger(l.y)) throw new Error(`Layer ${i+1} X/Y coordinates must be integer pixels.`);
              if(typeof l.visible!=='boolean') throw new Error(`Layer ${i+1} visibility must be boolean.`);
              return {file:l.file,x:l.x,y:l.y,visible:l.visible,shadow:validateShadow(l.shadow,i)};
            });
            return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},assets,layers};
          }'''
          new_validate = '''function validateLayerId(raw,index){
            if(raw==null || raw==='') return null;
            if(typeof raw!=='string' || !raw.trim()) throw new Error(`Layer ${index+1} id must be a non-empty string when supplied.`);
            return raw.trim();
          }

          function validateLayout(raw){
            if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('Layout must be a JSON object.');
            if(raw.version!==LAYOUT_VERSION) throw new Error(`Unsupported layout version; expected version ${LAYOUT_VERSION}.`);
            if(!raw.canvas || raw.canvas.width!==CANVAS_W || raw.canvas.height!==CANVAS_H) throw new Error('Canvas must be exactly 1144 × 1144.');
            if(!Array.isArray(raw.layers)) throw new Error('Layout layers must be an array.');
            const assets=validateAssets(raw.assets);
            const seenIds=new Set();
            const layers=raw.layers.map((l,i)=>{
              if(!l || typeof l!=='object') throw new Error(`Layer ${i+1} is malformed.`);
              if(typeof l.file!=='string' || !l.file.trim()) throw new Error(`Layer ${i+1} filename must be non-empty.`);
              if(!Number.isInteger(l.x) || !Number.isInteger(l.y)) throw new Error(`Layer ${i+1} X/Y coordinates must be integer pixels.`);
              if(typeof l.visible!=='boolean') throw new Error(`Layer ${i+1} visibility must be boolean.`);
              const id=validateLayerId(l.id,i);
              if(id&&seenIds.has(id)) throw new Error(`Duplicate layout layer id: ${id}`);
              if(id) seenIds.add(id);
              return {id,file:l.file,x:l.x,y:l.y,visible:l.visible,shadow:validateShadow(l.shadow,i)};
            });
            return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},assets,layers};
          }'''
          if old_validate in s:
              s = s.replace(old_validate,new_validate,1)
          elif new_validate not in s:
              raise SystemExit(f'{path}: validateLayout block shape changed')

          old_model = '''function layerFromLayout(entry){
            const l={id:makeRuntimeId(),file:entry.file,x:entry.x,y:entry.y,visible:entry.visible,shadow:{...(entry.shadow||DEFAULT_SHADOW)},image:null,width:0,height:0,resolved:false};
            const a=findCachedAsset(entry.file); if(a) attachAsset(l,a); return l;
          }
          function applyLayout(layout){
            const next=layout.layers.map(layerFromLayout);
            state.layers=next; state.selectedLayerId=next[0]?.id||null; state.dragging=null; refreshUI();renderPreview();
          }
          function serializeLayout(){return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},layers:state.layers.map(({file,x,y,visible,shadow})=>({file,x,y,visible,shadow:{...shadow}}))};}'''
          new_model = '''function layerFromLayout(entry){
            const l={uid:makeRuntimeId(),id:entry.id??null,file:entry.file,x:entry.x,y:entry.y,visible:entry.visible,shadow:{...(entry.shadow||DEFAULT_SHADOW)},image:null,width:0,height:0,resolved:false};
            const a=findCachedAsset(entry.file); if(a) attachAsset(l,a); return l;
          }
          function applyLayout(layout){
            const next=layout.layers.map(layerFromLayout);
            state.layers=next; state.selectedLayerUid=next[0]?.uid||null; state.dragging=null; refreshUI();renderPreview();
          }
          function serializeLayer({id,file,x,y,visible,shadow}){const out={file,x,y,visible,shadow:{...shadow}};if(id)out.id=id;return out;}
          function serializeLayout(){return {version:LAYOUT_VERSION,canvas:{width:CANVAS_W,height:CANVAS_H},layers:state.layers.map(serializeLayer)};}'''
          if old_model in s:
              s = s.replace(old_model,new_model,1)
          elif new_model not in s:
              raise SystemExit(f'{path}: layer model block shape changed')

          pairs = [
              ('  const l={id:makeRuntimeId(),file:asset.file,x:Math.round((CANVAS_W-asset.width)/2),y:Math.round((CANVAS_H-asset.height)/2),visible:true,shadow:{...DEFAULT_SHADOW},image:asset.image,width:asset.width,height:asset.height,resolved:true};\n  state.layers.unshift(l); state.selectedLayerId=l.id; return l;',
               '  const l={uid:makeRuntimeId(),id:null,file:asset.file,x:Math.round((CANVAS_W-asset.width)/2),y:Math.round((CANVAS_H-asset.height)/2),visible:true,shadow:{...DEFAULT_SHADOW},image:asset.image,width:asset.width,height:asset.height,resolved:true};\n  state.layers.unshift(l); state.selectedLayerUid=l.uid; return l;'),
              ('  const idx=state.layers.findIndex(l=>l.id===state.selectedLayerId); if(idx<0)return;\n  state.layers.splice(idx,1); const next=state.layers[Math.min(idx,state.layers.length-1)]||null; state.selectedLayerId=next?.id||null; refreshUI();renderPreview();',
               '  const idx=state.layers.findIndex(l=>l.uid===state.selectedLayerUid); if(idx<0)return;\n  state.layers.splice(idx,1); const next=state.layers[Math.min(idx,state.layers.length-1)]||null; state.selectedLayerUid=next?.uid||null; refreshUI();renderPreview();'),
              ('function selectLayer(id){state.selectedLayerId=id;refreshUI();renderPreview();}',
               'function selectLayer(uid){state.selectedLayerUid=uid;refreshUI();renderPreview();}'),
              ('function bringForward(){const i=state.layers.findIndex(l=>l.id===state.selectedLayerId);if(i>0){[state.layers[i-1],state.layers[i]]=[state.layers[i],state.layers[i-1]];refreshUI();renderPreview();}}',
               'function bringForward(){const i=state.layers.findIndex(l=>l.uid===state.selectedLayerUid);if(i>0){[state.layers[i-1],state.layers[i]]=[state.layers[i],state.layers[i-1]];refreshUI();renderPreview();}}'),
              ('function sendBackward(){const i=state.layers.findIndex(l=>l.id===state.selectedLayerId);if(i>=0&&i<state.layers.length-1){[state.layers[i],state.layers[i+1]]=[state.layers[i+1],state.layers[i]];refreshUI();renderPreview();}}',
               'function sendBackward(){const i=state.layers.findIndex(l=>l.uid===state.selectedLayerUid);if(i>=0&&i<state.layers.length-1){[state.layers[i],state.layers[i+1]]=[state.layers[i+1],state.layers[i]];refreshUI();renderPreview();}}'),
              ("    const row=document.createElement('div');row.className='layer-row'+(l.id===state.selectedLayerId?' selected':'');row.dataset.id=l.id;row.title=l.file;",
               "    const row=document.createElement('div');row.className='layer-row'+(l.uid===state.selectedLayerUid?' selected':'');row.dataset.uid=l.uid;row.title=l.file;"),
              ("    row.append(cb,name,tag);row.addEventListener('click',()=>selectLayer(l.id));list.appendChild(row);",
               "    row.append(cb,name,tag);row.addEventListener('click',()=>selectLayer(l.uid));list.appendChild(row);"),
              ("    $('selectedFilename').textContent=s.file;$('xInput').value=s.x;$('yInput').value=s.y;$('visibleInput').checked=s.visible;",
               "    $('selectedFilename').textContent=s.file;$('runtimeIdInput').value=s.id||'';$('xInput').value=s.x;$('yInput').value=s.y;$('visibleInput').checked=s.visible;"),
              ("canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e),l=hitTest(p.x,p.y);if(!l){state.selectedLayerId=null;refreshUI();renderPreview();return;}selectLayer(l.id);state.dragging={id:l.id,dx:p.x-l.x,dy:p.y-l.y,pointerId:e.pointerId};canvas.setPointerCapture?.(e.pointerId);e.preventDefault();});",
               "canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e),l=hitTest(p.x,p.y);if(!l){state.selectedLayerUid=null;refreshUI();renderPreview();return;}selectLayer(l.uid);state.dragging={uid:l.uid,dx:p.x-l.x,dy:p.y-l.y,pointerId:e.pointerId};canvas.setPointerCapture?.(e.pointerId);e.preventDefault();});"),
              ("canvas.addEventListener('pointermove',e=>{const d=state.dragging;if(!d||d.pointerId!==e.pointerId)return;const l=state.layers.find(x=>x.id===d.id);if(!l)return;const p=canvasPoint(e);l.x=Math.round(p.x-d.dx);l.y=Math.round(p.y-d.dy);refreshUI();renderPreview();e.preventDefault();});",
               "canvas.addEventListener('pointermove',e=>{const d=state.dragging;if(!d||d.pointerId!==e.pointerId)return;const l=state.layers.find(x=>x.uid===d.uid);if(!l)return;const p=canvasPoint(e);l.x=Math.round(p.x-d.dx);l.y=Math.round(p.y-d.dy);refreshUI();renderPreview();e.preventDefault();});")
          ]
          for old,new in pairs:
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'{path}: expected one pair match {old[:50]!r}')
                  s = s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'{path}: missing pair {old[:50]!r}')

          old_visible = "$('visibleInput').addEventListener('change',()=>{const l=getSelectedLayer();if(l){l.visible=$('visibleInput').checked;refreshUI();renderPreview();}});"
          new_visible = """function commitRuntimeId(){const l=getSelectedLayer();if(!l)return;const id=$('runtimeIdInput').value.trim()||null;if(id&&state.layers.some(other=>other!==l&&other.id===id)){alert(`Runtime ID already used: ${id}`);refreshUI();return;}l.id=id;refreshUI();}
          $('runtimeIdInput').addEventListener('change',commitRuntimeId);$('runtimeIdInput').addEventListener('keydown',e=>{if(e.key==='Enter'){commitRuntimeId();e.target.blur();}});
          $('visibleInput').addEventListener('change',()=>{const l=getSelectedLayer();if(l){l.visible=$('visibleInput').checked;refreshUI();renderPreview();}});"""
          if old_visible in s:
              s = s.replace(old_visible,new_visible,1)
          elif new_visible not in s:
              raise SystemExit(f'{path}: runtime ID handler insertion point changed')

          if 'selectedLayerId' in s:
              raise SystemExit(f'{path}: old editor selection identity remains')
          if 'id:makeRuntimeId()' in s:
              raise SystemExit(f'{path}: semantic id still used as editor identity')
          for required in ['uid:makeRuntimeId()','id:entry.id??null','id="runtimeIdInput"','Duplicate layout layer id']:
              if required not in s:
                  raise SystemExit(f'{path}: missing required migration token {required!r}')
          p.write_text(s)
          PY

      - name: Run focused migration regressions
        run: node --test tests/apple2_composer_layer_ids.test.js tests/apple2_html_layout.test.js tests/appledisk2_layout_visuals.test.js tests/script_include_ownership.test.js tests/preview_distribution.test.js

      - name: Verify legacy Disk II inference is gone
        shell: bash
        run: |
          if grep -RFn 'legacyDiskIILayerId' res tools tests --exclude='persistent-diskii-layer-ids-temp.yml'; then
            echo "legacyDiskIILayerId remains"
            exit 1
          fi
          if grep -Fn 'layer.x < 300\|layer.x < 400' res/COM_A2P_LAYOUT.js; then
            echo "coordinate-based Disk II ID inference remains"
            exit 1
          fi

      - name: Run full Node suite and confirm existing baseline only
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js > /tmp/all-tests.log 2>&1
          status=$?
          set -e
          cat /tmp/all-tests.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -q 'ℹ fail 5' /tmp/all-tests.log
          grep -q 'default Apple II Plus boot mounts AppleMouse in physical slot 4' /tmp/all-tests.log
          grep -q 'fixed scenario companion is mounted in viewport coordinate space' /tmp/all-tests.log
          grep -q 'layout companion prefers the right side, falls back left, and uses a narrower preferred width' /tmp/all-tests.log
          grep -q 'Liron advertises HD20 as optional and attaches mixed SmartPort devices to distinct units' /tmp/all-tests.log
          grep -q 'UniDisk Surface Map capability button toggles the popup open and closed' /tmp/all-tests.log

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/COM_A2P_LAYOUT.js res/COM_LAYOUT_CONFIG.js tools/GUI_DEV/apple2-system-composer.html tools/GUI_DEV/assets/apple2-layout.json tools/GUI_DEV/assets/apple2-layout-embedded.json
          git commit -m "refactor: persist Disk II layout layer IDs"
          git fetch origin refactor/persistent-diskii-layer-ids
          git rebase origin/refactor/persistent-diskii-layer-ids
          git push origin HEAD:refactor/persistent-diskii-layer-ids
