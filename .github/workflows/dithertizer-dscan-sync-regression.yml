name: Dithertizer DSCAN sync regression

permissions:
  contents: read

on:
  push:
    paths:
      - "res/EMU_CARD_dithertizer.js"
      - "res/DBG_steptrace_scenario.js"
      - "res/EMU_cpu6502.js"
      - "tests/dithertizer_foundation.test.js"
      - "tests/dithertizer_camera_toggle.test.js"
      - "tests/dithertizer_dscan_sync_browser.js"
      - "tests/dithertizer_fallback_steptrace_browser.js"
      - "disks/GFX/Computer Stations Dithertizer II Driver Software for II II+.dsk"
      - ".github/workflows/dithertizer-dscan-sync-regression.yml"
  pull_request:
    paths:
      - "res/EMU_CARD_dithertizer.js"
      - "res/DBG_steptrace_scenario.js"
      - "res/EMU_cpu6502.js"
      - "tests/dithertizer_foundation.test.js"
      - "tests/dithertizer_camera_toggle.test.js"
      - "tests/dithertizer_dscan_sync_browser.js"
      - "tests/dithertizer_fallback_steptrace_browser.js"
      - "disks/GFX/Computer Stations Dithertizer II Driver Software for II II+.dsk"
      - ".github/workflows/dithertizer-dscan-sync-regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Dithertizer unit regressions
        run: node --test tests/dithertizer_foundation.test.js tests/dithertizer_camera_toggle.test.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real DSCAN regressions
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node tests/dithertizer_dscan_sync_browser.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dithertizer_fallback_steptrace_browser.js')
          s=p.read_text()
          old="assert.ok(trace && trace.done,'four-capture fallback trace did not finish');"
          new="console.log('FALLBACK_TRACE_TIMEOUT_STATE',JSON.stringify(trace)); console.log('FALLBACK_TRACE_TIMEOUT_PC',await page.evaluate(()=>apple2plus.cpuObj().watch().pc&0xFFFF)); "+old
          if old not in s: raise SystemExit('trace assertion marker missing')
          p.write_text(s.replace(old,new))
          PY
          NODE_PATH="$PWD/node_modules" node tests/dithertizer_fallback_steptrace_browser.js
