name: Dithertizer DSCAN sync regression

permissions:
  contents: read

on:
  push:
    paths:
      - "res/EMU_CARD_dithertizer.js"
      - "res/DBG_steptrace_scenario.js"
      - "res/EMU_cpu6502.js"
      - "tests/dithertizer_foundation.test.js"
      - "tests/dithertizer_camera_toggle.test.js"
      - "tests/dithertizer_wr_mapping.test.js"
      - "tests/dithertizer_dscan_sync_browser.js"
      - "tests/dithertizer_fallback_steptrace_browser.js"
      - "tests/dithertizer_c0f8_write_trace_browser.js"
      - "disks/GFX/Computer Stations Dithertizer II Driver Software for II II+.dsk"
      - ".github/workflows/dithertizer-dscan-sync-regression.yml"
  pull_request:
    paths:
      - "res/EMU_CARD_dithertizer.js"
      - "res/DBG_steptrace_scenario.js"
      - "res/EMU_cpu6502.js"
      - "tests/dithertizer_foundation.test.js"
      - "tests/dithertizer_camera_toggle.test.js"
      - "tests/dithertizer_wr_mapping.test.js"
      - "tests/dithertizer_dscan_sync_browser.js"
      - "tests/dithertizer_fallback_steptrace_browser.js"
      - "tests/dithertizer_c0f8_write_trace_browser.js"
      - "disks/GFX/Computer Stations Dithertizer II Driver Software for II II+.dsk"
      - ".github/workflows/dithertizer-dscan-sync-regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Dithertizer unit regressions
        run: node --test tests/dithertizer_foundation.test.js tests/dithertizer_camera_toggle.test.js tests/dithertizer_wr_mapping.test.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real DSCAN sync regression
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node tests/dithertizer_dscan_sync_browser.js
      - name: Trace every C0F8 PAGE1 HGR write
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-trace.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node tests/dithertizer_c0f8_write_trace_browser.js
      - name: Run four-capture fallback STEP TRACE
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-fallback.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node tests/dithertizer_fallback_steptrace_browser.js
      - name: Upload Dithertizer traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dithertizer-traces
          path: |
            test-results/dithertizer-c0f8-write-trace.json
            test-results/dithertizer-fallback-steptrace.json
          if-no-files-found: warn
