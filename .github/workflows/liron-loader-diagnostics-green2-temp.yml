name: Temporary UniDisk loader diagnostics GREEN2
on:
  push:
    branches: [feature/liron-unidisk-loader-diagnostics]
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-loader-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_apple2main.js'); s=p.read_text()
          old='''    if(bytes.length===819200 || unidiskTarget)\n    {\n        if(bytes.length!==819200) return false;\n        var unidisk=EMU_unidisk35Device(slotN,unit);\n        if(!unidisk || typeof(unidisk.loadImage)!=="function") return false;\n        unidisk.loadImage(bytes,{"filename":filepath || ""});\n        return true;\n    }\n'''
          new='''    if(bytes.length===819200 || unidiskTarget)\n    {\n        var details={"slotN":slotN,"unit":unit,"filename":filepath || "","bytes":bytes.length};\n        if(bytes.length!==819200)\n        {\n            console.error("UniDisk 3.5 mount failed: invalid image size",{"slotN":slotN,"unit":unit,"filename":filepath || "","expected":819200,"actual":bytes.length});\n            return false;\n        }\n        var unidisk=EMU_unidisk35Device(slotN,unit);\n        if(!unidisk)\n        {\n            console.error("UniDisk 3.5 mount failed: target device not found",details);\n            return false;\n        }\n        if(typeof(unidisk.loadImage)!=="function")\n        {\n            console.error("UniDisk 3.5 mount failed: target device cannot load images",details);\n            return false;\n        }\n        try { unidisk.loadImage(bytes,{"filename":filepath || ""}); }\n        catch(err)\n        {\n            console.error("UniDisk 3.5 mount failed: device load exception",details,err);\n            throw err;\n        }\n        console.log("UniDisk 3.5 mount succeeded",details);\n        return true;\n    }\n'''
          if old not in s: raise SystemExit('router marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('res/EMU_CARD_LIRON.js'); s=p.read_text()
          old='''    if(Number(file.size)!==819200)\n    {\n        if(typeof(alert)==="function")\n            alert("UniDisk 3.5 image must contain exactly 819200 bytes.");\n        clearInput();\n        return false;\n    }\n'''
          new='''    if(Number(file.size)!==819200)\n    {\n        console.error("UniDisk 3.5 load failed: invalid image size",{"slotN":slotN,"unit":unit,"filename":file.name || "","expected":819200,"actual":Number(file.size)});\n        if(typeof(alert)==="function") alert("UniDisk 3.5 image must contain exactly 819200 bytes.");\n        clearInput();\n        return false;\n    }\n'''
          if old not in s: raise SystemExit('invalid-size marker missing')
          s=s.replace(old,new,1)

          old='''            var mounted=typeof(EMU_mountDiskImage)==="function" &&\n                EMU_mountDiskImage(bytes,slotN,"UNIDISK35",file.name || "",unit);\n            if(!mounted) throw new Error("Unable to mount UniDisk 3.5 image.");\n'''
          new='''            var mounted=typeof(EMU_mountDiskImage)==="function" &&\n                EMU_mountDiskImage(bytes,slotN,"UNIDISK35",file.name || "",unit);\n            if(!mounted)\n            {\n                console.error("UniDisk 3.5 load failed: mount rejected",{"slotN":slotN,"unit":unit,"filename":file.name || "","bytes":bytes.length});\n                if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: mount rejected.");\n                return;\n            }\n'''
          if old not in s: raise SystemExit('mount-rejection marker missing')
          s=s.replace(old,new,1)

          old='''        catch(err)\n        {\n            console.error("UniDisk 3.5 load failed",err);\n            if(typeof(alert)==="function")\n                alert("UniDisk 3.5 load failed: "+(err && err.message ? err.message : err));\n        }\n'''
          new='''        catch(err)\n        {\n            console.error("UniDisk 3.5 load failed: exception",{"slotN":slotN,"unit":unit,"filename":file.name || "","error":err && err.message ? err.message : String(err)},err);\n            if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: "+(err && err.message ? err.message : err));\n        }\n'''
          if old not in s: raise SystemExit('exception marker missing')
          s=s.replace(old,new,1)

          old='''    reader.onerror=function()\n    {\n        var msg=reader.error && reader.error.message\n            ? reader.error.message\n            : "Unable to read file.";\n        console.error("UniDisk 3.5 load failed: "+msg);\n        if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: "+msg);\n        clearInput();\n    };\n'''
          new='''    reader.onerror=function()\n    {\n        var msg=reader.error && reader.error.message ? reader.error.message : "Unable to read file.";\n        console.error("UniDisk 3.5 load failed: FileReader error",{"slotN":slotN,"unit":unit,"filename":file.name || "","error":msg});\n        if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: "+msg);\n        clearInput();\n    };\n'''
          if old not in s: raise SystemExit('reader marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify diagnostics and regressions
        run: |
          node --check res/EMU_apple2main.js
          node --check res/EMU_CARD_LIRON.js
          node --test tests/liron_loader_diagnostics.test.js tests/liron_browser_mount.test.js tests/liron_toolbox.test.js tests/liron_browser_integration.test.js tests/liron_card.test.js tests/liron_iwm.test.js tests/liron_readblock.test.js tests/liron_smartport_bus.test.js tests/liron_smartport_transport.test.js tests/unidisk35.test.js
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "RetroAppleJS CI"
          git config user.email "actions@users.noreply.github.com"
          git add res/EMU_apple2main.js res/EMU_CARD_LIRON.js tests/liron_loader_diagnostics.test.js
          git commit -m "feat: log UniDisk loader outcomes"
          git pull --rebase origin feature/liron-unidisk-loader-diagnostics
          git push origin HEAD:feature/liron-unidisk-loader-diagnostics
