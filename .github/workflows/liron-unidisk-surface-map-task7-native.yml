name: Liron UniDisk surface map final verification

permissions:
  contents: write

on:
  push:
    branches:
      - feature/liron-unidisk-surface-map
    paths:
      - .github/workflows/liron-unidisk-surface-map-task7-native.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-surface-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax checks
        run: |
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_apple2io.js
          node --check res/EMU_apple2main.js
          node --check tests/unidisk35.test.js
          node --check tests/liron_toolbox.test.js
          node --check tests/liron_surface_map.test.js
          node --check tests/liron_surface_map_browser_acceptance.js
          node --check tests/cardcat_unidisk_browser_acceptance.js

      - name: Direct regression suite
        run: |
          node --test \
            tests/unidisk35.test.js \
            tests/liron_surface_map.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/unidisk_media_export.test.js \
            tests/hd20_media_routing.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/liron_loader_diagnostics.test.js \
            tests/device_instance_identity.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js \
            tests/liron_readblock.test.js

      - name: Inventory full Node suite
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js > /tmp/full-node-suite.log 2>&1
          rc=$?
          set -e
          echo "FULL_NODE_SUITE_RC=$rc"
          tail -n 120 /tmp/full-node-suite.log
          echo "--- FULL NODE FAILURES ---"
          grep -E '^not ok |# fail ' /tmp/full-node-suite.log || true

      - name: Audit runtime UniDisk identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          patterns=[r"(['\"])UNIDISK35\1",r'UNIDISK35_',r'UNIDISK35\.po']
          for root in ('res','tests'):
              for p in Path(root).glob('*.js'):
                  text=p.read_text()
                  for pat in patterns:
                      if re.search(pat,text): bad.append(f'{p}: {pat}')
          if bad:
              raise SystemExit('Unexpected runtime UNIDISK35 tokens:\n'+'\n'.join(bad))
          print('Runtime identifier audit: clean')
          PY

      - name: Verify Disk II production source unchanged
        run: git diff --exit-code 9534b27856a32c55d24eb426e2760ae16ad50960 -- res/EMU_CARD_appledisk2.js

      - name: Verify standalone build without retaining generated dist
        run: |
          node .github/scripts/inline.cjs
          test -s dist/RetroAppleJS.html
          grep -q 'lironSurfaceMap_popup' dist/RetroAppleJS.html
          grep -q 'deviceToolSurfaceMapHTML' dist/RetroAppleJS.html
          git checkout -- dist/RetroAppleJS.html
          git diff --exit-code -- dist/RetroAppleJS.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Card Cat UniDisk browser acceptance
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-cardcat.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/cardcat_unidisk_browser_acceptance.js

      - name: UniDisk surface-map browser acceptance
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-surface.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_surface_map_browser_acceptance.js

      - name: Confirm known two-device ProDOS baseline failure remains isolated
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-two-device.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          set +e
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_two_device_prodos_acceptance.js > /tmp/two-device.log 2>&1
          rc=$?
          set -e
          cat /tmp/two-device.log
          if [ "$rc" -eq 0 ]; then
            echo "Two-device acceptance unexpectedly passed; this is fine."
            exit 0
          fi
          grep -q 'S5,D2 driver vector still points to NO DEVICE CONNECTED' /tmp/two-device.log
          echo "Observed only the documented pre-existing two-device acceptance failure (rc=$rc)."

      - name: Remove temporary final-verification workflow
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/liron-unidisk-surface-map-task7-native.yml
          git add -A
          git commit -m "test: verify UniDisk surface map implementation"
          git push origin HEAD:feature/liron-unidisk-surface-map
