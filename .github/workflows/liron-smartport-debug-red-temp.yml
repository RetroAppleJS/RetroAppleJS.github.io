name: Temporary Liron SmartPort debug RED
on:
  push:
    branches:
      - feature/liron-smartport-debug
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-smartport-debug
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/liron_smartport_debug.test.js
