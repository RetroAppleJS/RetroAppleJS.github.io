name: Temporary Liron ROM enumeration trace

on:
  push:
    branches: [ "feature/liron-unidisk-bus" ]
    paths:
      - ".github/workflows/liron-rom-trace-temp.yml"

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect authentic Liron write-handshake loop
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const vm=require('node:vm');
          const actionMap={Hslot:null,RD:new Array(0x1000),WR:new Array(0x1000)};
          const ctx={console,oEMU:{component:{IO:{ACTION_MAP:actionMap}}}};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('res/EMU_CARD_LIRON.js','utf8'),ctx,{filename:'EMU_CARD_LIRON.js'});
          const rom=(new ctx.AppleLiron()).getROM();
          function hex(v,n=2){return (v>>>0).toString(16).toUpperCase().padStart(n,'0');}
          for(let addr=0xC920;addr<=0xC93F;addr+=8){
            const off=0x800+(addr-0xC800);
            const bytes=Array.from(rom.slice(off,off+8));
            console.log('$'+hex(addr,4)+': '+bytes.map(v=>hex(v)).join(' '));
          }
          console.log('C92C..C930 =',Array.from(rom.slice(0x92C,0x931)).map(v=>hex(v)).join(' '));
          NODE
