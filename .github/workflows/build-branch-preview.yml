name: Build branch preview distro

on:
  push:
    branches:
      - fix-diskii-led-lid-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-diskii-led-lid-runtime

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply and verify Disk II runtime visual patch
        shell: bash
        run: |
          python3 .github/scripts/patch_diskii_green.py
          node --test tests/apple2_html_layout.test.js tests/appledisk2_layout_visuals.test.js tests/preview_distribution.test.js

      - name: Commit production runtime patch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add res/EMU_CARD_appledisk2.js res/EMU_apple2plus.js tests/appledisk2_layout_visuals.test.js
          git commit -m "fix: wire Disk II LEDs and lids to layout API"
          git push origin HEAD:fix-diskii-led-lid-runtime
