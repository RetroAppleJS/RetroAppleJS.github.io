name: Build branch preview distro

on:
  push:
    branches:
      - fix-diskii-main-gui-update

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-diskii-main-gui-update

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Disk II main GUI hotfix and verify
        shell: bash
        run: |
          python3 .github/scripts/patch_diskii_main_gui.py
          node --test tests/apple2_html_layout.test.js tests/appledisk2_layout_visuals.test.js tests/preview_distribution.test.js

      - name: Commit production hotfix only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2main.js
          if git diff --cached --quiet; then
            echo "Production hotfix already applied."
          else
            git commit -m "fix: remove legacy Disk II GUI DOM wiring"
            git push origin HEAD:fix-diskii-main-gui-update
          fi
