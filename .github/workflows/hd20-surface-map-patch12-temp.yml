name: HD20 surface map patch v12 temp

permissions:
  contents: write

on:
  push:
    branches:
      - hd20-surface-map-geometry-20260923
    paths:
      - ".github/workflows/hd20-surface-map-patch12-temp.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-surface-map-geometry-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge current main and apply production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit

          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/hd20-surface-map-patch3-temp.yml').read_text()
          section=text.split('      - name: Build production patch\n',1)[1].split('      - name: Commit implementation\n',1)[0]
          body=section.split('        run: |\n',1)[1]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          needle='node --check res/EMU_DEVICE_HD20.js'
          cleanup="""python3 - <<'PYFIX'\nfrom pathlib import Path\np=Path('res/EMU_CARD_LIRON.js')\ns=p.read_text().replace('!===','!==')\np.write_text(s)\nPYFIX\n\n"""
          if needle not in body: raise SystemExit('verification marker missing')
          body=body.replace(needle,cleanup+needle,1)
          Path('/tmp/build.sh').write_text(body+'\n')
          PY
          bash /tmp/build.sh

      - name: Commit and push implementation
        shell: bash
        run: |
          git add res/EMU_DEVICE_HD20.js res/EMU_CARD_LIRON.js tests/liron_toolbox.test.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: add paged HD20 surface map"
          fi
          git push origin HEAD:hd20-surface-map-geometry-20260923
