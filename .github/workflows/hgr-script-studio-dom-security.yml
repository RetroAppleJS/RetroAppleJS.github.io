name: HGR Script Studio DOM security

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'tools/HGR_SCRIPT_STUDIO.html'
      - 'tests/hgr_script_studio_dom_security.test.js'
      - '.github/workflows/hgr-script-studio-dom-security.yml'
  push:
    paths:
      - 'tools/HGR_SCRIPT_STUDIO.html'
      - 'tests/hgr_script_studio_dom_security.test.js'
      - '.github/workflows/hgr-script-studio-dom-security.yml'
  workflow_dispatch:

jobs:
  dom-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DOM rendering and XSS regressions
        run: node --test tests/hgr_script_studio_dom_security.test.js
