name: Temporary Liron IWM drain regression

on:
  push:
    branches: [ "feature/liron-unidisk-bus" ]
    paths:
      - "tests/liron_iwm.test.js"
      - "res/EMU_CARD_LIRON.js"
      - ".github/workflows/liron-iwm-drain-temp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply IWM write-drain fix in working tree
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_CARD_LIRON.js')
          s=p.read_text()
          s=s.replace(',"writeReady":true\n        ,"underrun":false',',"writeReady":true\n        ,"underrun":false\n        ,"writeDrainPending":false')
          s=s.replace('''    function readHandshake()\n    {\n        return (0x3F | (state.writeReady?0x80:0) | (!state.underrun?0x40:0))&0xFF;\n    }''','''    function readHandshake()\n    {\n        if(state.writeDrainPending)\n        {\n            state.writeDrainPending=false;\n            state.writeReady=true;\n\n            // Without cycle-accurate IWM timing, a handshake poll advances the\n            // pending transmit byte. Only the final packet byte may underrun:\n            // SmartPortBus reaches RESPONSE_PENDING after accepting its $C8.\n            var busState = bus && typeof(bus.getState)==="function" ? bus.getState() : null;\n            if(busState && busState.protocolState==="RESPONSE_PENDING")\n                state.underrun=true;\n        }\n        return (0x3F | (state.writeReady?0x80:0) | (!state.underrun?0x40:0))&0xFF;\n    }''')
          s=s.replace('''    function writeData(value,ctx)\n    {\n        state.writeData = Number(value)&0xFF;\n        if(bus && typeof(bus.writeData)==="function") bus.writeData(state.writeData,state.lines,ctx);\n    }''','''    function writeData(value,ctx)\n    {\n        state.writeData = Number(value)&0xFF;\n        state.writeReady=false;\n        state.underrun=false;\n        state.writeDrainPending=true;\n        if(bus && typeof(bus.writeData)==="function") bus.writeData(state.writeData,state.lines,ctx);\n    }''')
          s=s.replace('''        state.writeReady=true; state.underrun=false;\n        if(bus && typeof(bus.reset)==="function") bus.reset();''','''        state.writeReady=true; state.underrun=false; state.writeDrainPending=false;\n        if(bus && typeof(bus.reset)==="function") bus.reset();''')
          p.write_text(s)
          PY
      - name: Run full Liron and UniDisk regression suite
        shell: bash
        run: |
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --test \
            tests/liron_iwm.test.js \
            tests/liron_card.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js \
            tests/liron_browser_integration.test.js \
            tests/unidisk35.test.js
      - name: Run authentic Liron ROM STATUS enumeration
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const vm=require('node:vm');
          function hex(v,n=2){return '$'+(v>>>0).toString(16).toUpperCase().padStart(n,'0');}
          const cpuCtx={console}; vm.createContext(cpuCtx);
          vm.runInContext(fs.readFileSync('res/EMU_cpu6502.js','utf8'),cpuCtx,{filename:'EMU_cpu6502.js'});
          const actionMap={Hslot:null,RD:new Array(0x1000),WR:new Array(0x1000)};
          const ctx={console,oEMU:{component:{IO:{ACTION_MAP:actionMap}}}}; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('res/EMU_DEVICE_UNIDISK35.js','utf8'),ctx,{filename:'EMU_DEVICE_UNIDISK35.js'});
          vm.runInContext(fs.readFileSync('res/EMU_CARD_LIRON.js','utf8'),ctx,{filename:'EMU_CARD_LIRON.js'});
          const card=new ctx.AppleLiron(), iwm=card.getIWM(), bus=card.getBus(), rom=card.getROM();
          const mem=new Uint8Array(0x10000);
          const entry=(0xC500+(rom[0x5FF]&0xFF)+3)&0xFFFF, params=0x0280, statusBuf=0x0400, returnPC=0x0206;
          mem[0x0200]=0x20; mem[0x0201]=entry&0xFF; mem[0x0202]=entry>>8;
          mem[0x0203]=0x00; mem[0x0204]=params&0xFF; mem[0x0205]=params>>8; mem[0x0206]=0xEA;
          mem[params]=0x03; mem[params+1]=0x00; mem[params+2]=statusBuf&0xFF; mem[params+3]=statusBuf>>8; mem[params+4]=0x00;
          mem[0xFFFC]=0x00; mem[0xFFFD]=0x02;
          let currentPC=0, sawFinalDrain=false, sawResponse=false;
          const hw={irq_signal:0,nmi_signal:0}; hw.lineDecode=addr=>(addr>>>8)&0xFF; hw.RD=new Array(256); hw.WR=new Array(256);
          for(let p=0;p<256;p++){hw.RD[p]=a=>mem[a&0xFFFF];hw.WR[p]=(a,v)=>{mem[a&0xFFFF]=v&0xFF;};}
          hw.RD[0xC0]=addr=>{addr&=0xFFFF;if(addr>=0xC0D0&&addr<=0xC0DF){const reg=addr&15;const v=iwm.read(reg,{pc:currentPC});if(currentPC===0xC92C&&(v&0x40)===0)sawFinalDrain=true;if(bus.getState().protocolState==='SEND_RESPONSE')sawResponse=true;return v&0xFF;}return mem[addr];};
          hw.WR[0xC0]=(addr,v)=>{addr&=0xFFFF;if(addr>=0xC0D0&&addr<=0xC0DF){iwm.write(addr&15,v,{pc:currentPC});return;}mem[addr]=v&0xFF;};
          hw.RD[0xC5]=addr=>rom[0x500+(addr&0xFF)];
          for(let p=0xC8;p<=0xCF;p++)hw.RD[p]=addr=>rom[0x800+((addr&0xFFFF)-0xC800)];
          for(let p=0xC5;p<=0xCF;p++)hw.WR[p]=()=>{};
          const cpu=new cpuCtx.Cpu6502(hw); cpu.reset();
          function step(){currentPC=cpu.watch().pc&0xFFFF;cpu.cycle();while(cpu.watch().cycle_delay>0)cpu.cycle();}
          let returned=false,instructions=0;
          for(;instructions<500000;instructions++){if(instructions>0&&cpu.watch().cycle_delay===0&&(cpu.watch().pc&0xFFFF)===returnPC){returned=true;break;}step();}
          console.log('entry',hex(entry,4),'returned',returned,'instructions',instructions,'status0',hex(mem[statusBuf]),'finalDrain',sawFinalDrain,'response',sawResponse,'bus',JSON.stringify(bus.getState()));
          if(!returned||mem[statusBuf]!==1||!sawFinalDrain||!sawResponse)process.exit(1);
          NODE
      - name: Commit production fix when needed
        shell: bash
        run: |
          if git diff --quiet -- res/EMU_CARD_LIRON.js; then
            echo "Production source already contains the verified fix."
            exit 0
          fi
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add res/EMU_CARD_LIRON.js
          git commit -m "fix: drain Liron IWM write buffer after SmartPort packet"
          git push origin HEAD:feature/liron-unidisk-bus
