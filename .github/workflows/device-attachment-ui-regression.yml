name: Device attachment UI regression

permissions:
  contents: read

on:
  push:
    branches:
      - device-attachment-ui-20260919
    paths:
      - ".github/workflows/device-attachment-ui-regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_UNIDISK35.js
      - name: Device and Liron regression tests
        run: |
          node --test \
            tests/device_attachment_ui.test.js \
            tests/unidisk35.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_browser_integration.test.js \
            tests/liron_browser_mount.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js
