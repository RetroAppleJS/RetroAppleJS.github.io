name: Device instance patch temp

permissions:
  contents: write

on:
  push:
    branches:
      - device-instance-identity-20260920
    paths:
      - "tools/patch_device_instance_identity.py"
      - ".github/workflows/device-instance-patch-temp.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: device-instance-identity-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply device instance patch
        run: python3 tools/patch_device_instance_identity.py
      - name: Syntax and focused acceptance
        run: |
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --test \
            tests/device_instance_identity.test.js \
            tests/device_attachment_ui.test.js \
            tests/liron_smartport_bus.test.js \
            tests/unidisk35.test.js \
            tests/liron_browser_integration.test.js \
            tests/liron_browser_mount.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js res/EMU_CARD_LIRON.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: support distinct device instances"
          git push
