name: Temporary Liron browser integration

on:
  push:
    branches: [ "feature/liron-unidisk-bus" ]
    paths:
      - ".github/workflows/liron-browser-integration-temp.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify RED before browser wiring
        shell: bash
        run: |
          set +e
          node --test tests/liron_browser_integration.test.js > /tmp/liron-red.log 2>&1
          rc=$?
          cat /tmp/liron-red.log
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected browser integration test to fail before index.html wiring"
            exit 1
          fi
          grep -q "index.html must load EMU_DEVICE_UNIDISK35.js" /tmp/liron-red.log

      - name: Insert UniDisk script before Liron
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          device = '            <script type="text/javascript" src="res/EMU_DEVICE_UNIDISK35.js"></script>\n'
          liron = '            <script type="text/javascript" src="res/EMU_CARD_LIRON.js"></script>'
          if device.strip() not in text:
              if liron not in text:
                  raise SystemExit('Liron script marker not found')
              text = text.replace(liron, device + liron, 1)
              p.write_text(text)

      - name: Verify GREEN integration and regressions
        shell: bash
        run: |
          set -e
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --check res/EMU_CARD_LIRON.js
          node --test \
            tests/unidisk35.test.js \
            tests/liron_iwm.test.js \
            tests/liron_card.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_browser_integration.test.js

      - name: Commit index.html integration
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No index.html change to commit"
            exit 0
          fi
          git commit -m "feat: load UniDisk before Liron"
          git push origin HEAD:feature/liron-unidisk-bus
