name: Apply WASM IC breakpoint patch v2

on:
  push:
    branches: [ "chatgpt/wasm-ic-breakpoint" ]
    paths:
      - ".github/workflows/chatgpt-apply-wasm-ic-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wasm-ic-breakpoint

      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('res/EMU_WASMcpu6502.js')
          s=p.read_text()

          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)

          once('    const ACTIVITY_GROUP_MARKER_ADR=0xFFFF;\n',
               '    const ACTIVITY_GROUP_MARKER_ADR=0xFFFF;\n    const INSTRUCTION_COUNT_MODULO=0x1000000000000; // 2^48\n',
               'counter constant')

          once('    var sessionInstructions=0;\n',
               '''    var sessionInstructions=0;\n    // Global 48-bit instruction position shared with Cpu6502.\n    // cpu_get_last_executed() reports the exact number completed by every\n    // WASM chunk, so an IC breakpoint can shorten only the final chunk.\n    var instructionCount=0;\n    var instructionBreakpoint=null;\n    var instructionBreakpointArmed=false;\n''',
               'counter state')

          marker='    function parseOptionalAddress(value)\n'
          helpers=r'''    function normalizeInstructionCount(value)
    {
        value=Math.floor(Number(value));
        if(!Number.isFinite(value)) return 0;
        value%=INSTRUCTION_COUNT_MODULO;
        if(value<0) value+=INSTRUCTION_COUNT_MODULO;
        return value;
    }

    function instructionHex(value)
    {
        return "$"+normalizeInstructionCount(value).toString(16).toUpperCase().padStart(12,"0");
    }

    // BREAK IC uses hexadecimal values, with optional + / - arithmetic.
    // Example: $000000123456-$08
    function parseInstructionCountTerm(value)
    {
        var t=String(value==null?"":value).trim().replace(/^\$/,'').replace(/^0x/i,'');
        if(!/^[0-9a-f]{1,12}$/i.test(t)) throw new Error("Invalid IC term: "+value);
        return parseInt(t,16);
    }

    function parseOptionalInstructionCount(value)
    {
        var text=String(value==null?"":value).replace(/\s+/g,"");
        if(!text) return null;
        var parts=text.match(/[+-]?[^+-]+/g);
        if(!parts||parts.join("")!==text) throw new Error("Invalid IC expression: "+value);
        var total=0;
        for(var i=0;i<parts.length;i++)
        {
            var part=parts[i],sign=1;
            if(part.charAt(0)==="+") part=part.substring(1);
            else if(part.charAt(0)==="-"){sign=-1;part=part.substring(1);}
            if(!part) throw new Error("Invalid IC expression: "+value);
            total+=sign*parseInstructionCountTerm(part);
        }
        if(total<0||total>=INSTRUCTION_COUNT_MODULO) throw new Error("IC is outside the 48-bit range: "+value);
        return total;
    }

    function addExecutedInstructions(executed)
    {
        executed=Math.max(0,Math.floor(Number(executed)||0));
        sessionInstructions+=executed;
        instructionCount=normalizeInstructionCount(instructionCount+executed);
    }

    function instructionBreakpointReached()
    {
        return instructionBreakpointArmed&&instructionBreakpoint!==null&&instructionCount===instructionBreakpoint;
    }

    function capForInstructionBreakpoint(count)
    {
        if(!instructionBreakpointArmed||instructionBreakpoint===null) return count;
        var remaining=instructionBreakpoint-instructionCount;
        return remaining<=0?0:Math.min(count,remaining);
    }

    function syncInstructionBreakpointControls()
    {
        var input=$("wasm_break_ic"),clear=$("wasm_break_ic_clear"),state=$("wasm_break_ic_state");
        if(input&&typeof(document)!=="undefined"&&document.activeElement!==input)
        {
            var wanted=instructionBreakpoint===null?"":instructionHex(instructionBreakpoint);
            if(input.value!==wanted) input.value=wanted;
        }
        if(clear) clear.disabled=instructionBreakpoint===null;
        if(state) state.textContent=instructionBreakpointArmed?"armed":(instructionBreakpoint===null?"":"hit");
    }

    async function hitInstructionBreakpoint()
    {
        var target=instructionBreakpoint;
        instructionBreakpointArmed=false; // one-shot
        syncInstructionBreakpointControls();
        await finishHandoff("IC breakpoint "+instructionHex(target));
    }

'''
          once(marker,helpers+marker,'helpers')

          once('        var vals={pc:[state.pc,4],a:[state.a,2],x:[state.x,2],y:[state.y,2],sp:[state.sp,2],p:[state.p,2]};\n        Object.keys(vals).forEach(function(k){ var el=$("wasm_cur_"+k); if(el) el.value=toHex(vals[k][0],vals[k][1]); });\n',
               '        var vals={pc:[state.pc,4],a:[state.a,2],x:[state.x,2],y:[state.y,2],sp:[state.sp,2],p:[state.p,2]};\n        Object.keys(vals).forEach(function(k){ var el=$("wasm_cur_"+k); if(el) el.value=toHex(vals[k][0],vals[k][1]); });\n        var ic=$("wasm_cur_ic");\n        if(ic) ic.textContent=instructionHex(state.ic===undefined?instructionCount:state.ic);\n',
               'current IC display')

          once('            p:e.cpu_get_p()&0xff,\n            lastOpcode:e.cpu_get_last_opcode()&0xff,\n',
               '            p:e.cpu_get_p()&0xff,\n            ic:instructionCount,\n            lastOpcode:e.cpu_get_last_opcode()&0xff,\n',
               'WASM state IC')

          # Both execution paths report exact completed instruction counts.
          n=s.count('                sessionInstructions+=executed;\n')
          if n!=2: raise SystemExit(f'executed counters: expected 2, found {n}')
          s=s.replace('                sessionInstructions+=executed;\n','                addExecutedInstructions(executed);\n')

          once('            if(maxInstructions>0&&sessionInstructions>=maxInstructions){await finishHandoff("instruction limit");return;}\n\n            // Observe all wrapper-level addresses before opcode fetch.',
               '            if(instructionBreakpointReached()){await hitInstructionBreakpoint();return;}\n            if(maxInstructions>0&&sessionInstructions>=maxInstructions){await finishHandoff("instruction limit");return;}\n\n            // Observe all wrapper-level addresses before opcode fetch.',
               'loop boundary check')

          once('                if(maxInstructions>0) thisChunk=Math.min(thisChunk,Math.max(0,maxInstructions-sessionInstructions));\n                if(thisChunk<=0){await finishHandoff("instruction limit");return;}\n',
               '''                if(maxInstructions>0) thisChunk=Math.min(thisChunk,Math.max(0,maxInstructions-sessionInstructions));
                thisChunk=capForInstructionBreakpoint(thisChunk);
                if(thisChunk<=0)
                {
                    if(instructionBreakpointReached()){await hitInstructionBreakpoint();return;}
                    await finishHandoff("instruction limit");return;
                }
''',
               'chunk cap')

          once('            sessionInstructions=0;\n            dynamicEscape=null;\n',
               '''            sessionInstructions=0;
            instructionCount=normalizeInstructionCount(jsState.ic===undefined?0:jsState.ic);
            if(instructionBreakpointArmed&&instructionBreakpoint!==null&&instructionBreakpoint<instructionCount)
                throw new Error("Break IC "+instructionHex(instructionBreakpoint)+" already passed; current IC is "+instructionHex(instructionCount)+".");
            dynamicEscape=null;
''',
               'handoff IC import')

          once('        var msg="WASM finished: "+reason+"; "+sessionInstructions.toLocaleString()+" instruction(s).";\n        if(copy.ioWritesIgnored) msg+=" WARNING: "+copy.ioWritesIgnored+" write(s) in $C000-$CFFF were ignored.";\n        setStatus(msg,isError?"bad":"good");\n        if(copy.ioWritesIgnored) console.warn(msg);\n',
               '''        var msg="WASM finished: "+reason+"; IC "+instructionHex(instructionCount)+" / PC "+hex(state.pc,4)+"; "+sessionInstructions.toLocaleString()+" instruction(s) in this handoff.";
        if(copy.ioWritesIgnored) msg+=" WARNING: "+copy.ioWritesIgnored+" write(s) in $C000-$CFFF were ignored.";
        setStatus(msg,isError?"bad":"good");
        if(isError||copy.ioWritesIgnored) console.warn("[IC="+instructionHex(instructionCount)+" PC="+hex(state.pc,4)+"] "+reason);
''',
               'handoff warning/status')

          ui='''      +"<label>Limit<br><input id='wasm_limit' size='6' value='0' title='0 = unlimited' style='width:52px;padding:2px'></label>"\n      +"</div>"\n'''
          ui2=ui+'''      +"<div style='display:flex;gap:4px;align-items:center;margin-top:4px;white-space:nowrap'>"\n        +"<span>IC <span id='wasm_cur_ic' style='font-family:monospace'>$000000000000</span></span>"\n        +"<label>BREAK IC <input id='wasm_break_ic' size='14' placeholder='$............' title='One-shot global 48-bit instruction breakpoint; hex arithmetic accepted, e.g. $000000123456-$08' onchange='oEMU.component.CPU.WASM6502.setInstructionBreakpoint(this.value)' style='width:100px;padding:2px;font-family:monospace'></label>"\n        +"<button class='appbut skinny' id='wasm_break_ic_clear' onclick='oEMU.component.CPU.WASM6502.clearInstructionBreakpoint()' title='clear IC breakpoint'>×</button>"\n        +"<span id='wasm_break_ic_state' style='font-size:8px'></span>"\n      +"</div>"\n'''
          once(ui,ui2,'IC UI')

          once('            var state=readJsState();\n            setCurrentFields(state);\n',
               '''            var state=readJsState();
            instructionCount=normalizeInstructionCount(state.ic===undefined?0:state.ic);
            instructionBreakpoint=null;
            instructionBreakpointArmed=false;
            setCurrentFields(state);
            syncInstructionBreakpointControls();
''',
               'open IC sync')

          public=r'''    this.setInstructionBreakpoint=function(value)
    {
        try
        {
            var target=parseOptionalInstructionCount(value);
            if(target!==null&&target<instructionCount)
                throw new Error("Break IC "+instructionHex(target)+" already passed current IC "+instructionHex(instructionCount)+".");
            instructionBreakpoint=target;
            instructionBreakpointArmed=target!==null;
            syncInstructionBreakpointControls();
            setStatus(target===null?"WASM IC breakpoint cleared.":"WASM IC breakpoint armed for "+instructionHex(target)+"; current IC "+instructionHex(instructionCount)+".");
            return target;
        }
        catch(err){syncInstructionBreakpointControls();setStatus(String(err),"bad");return false;}
    };

    this.clearInstructionBreakpoint=function()
    {
        instructionBreakpoint=null;
        instructionBreakpointArmed=false;
        syncInstructionBreakpointControls();
        setStatus("WASM IC breakpoint cleared.");
        return true;
    };

'''
          once('    this.loggerChanged=function()\n',public+'    this.loggerChanged=function()\n','public API')

          once('    this.getState=function(){return {phase:phase,instructions:sessionInstructions,activityRecords:activityLogger?activityLogger.count:0};};\n',
               '    this.getState=function(){return {phase:phase,instructions:sessionInstructions,ic:instructionCount,breakIC:instructionBreakpoint,breakArmed:instructionBreakpointArmed,activityRecords:activityLogger?activityLogger.count:0};};\n',
               'getState')

          p.write_text(s)
          print('patched',p)
          PY

      - name: Validate
        run: |
          node --check res/EMU_WASMcpu6502.js
          grep -q 'INSTRUCTION_COUNT_MODULO=0x1000000000000' res/EMU_WASMcpu6502.js
          grep -q 'capForInstructionBreakpoint' res/EMU_WASMcpu6502.js
          grep -q 'ic:instructionCount' res/EMU_WASMcpu6502.js
          grep -q 'wasm_break_ic' res/EMU_WASMcpu6502.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add res/EMU_WASMcpu6502.js
          git commit -m "Add 48-bit IC breakpoint to WASM accelerator"
          git push origin HEAD:chatgpt/wasm-ic-breakpoint
