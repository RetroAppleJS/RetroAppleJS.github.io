name: Repair Liron two-device ProDOS acceptance

permissions:
  contents: write

on:
  push:
    branches:
      - fix/liron-two-device-prodos-followup
    paths:
      - .github/workflows/liron-two-device-prodos-repair.yml

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liron-two-device-prodos-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Repair acceptance to test real ProDOS MLI access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/liron_two_device_prodos_acceptance.js')
          s=p.read_text()
          old="""    if(prodos.s5d2[0]===prodos.nodev[0] && prodos.s5d2[1]===prodos.nodev[1])\n        throw new Error('S5,D2 driver vector still points to NO DEVICE CONNECTED');\n"""
          new="""    const mliRead=await page.evaluate(async()=>{\n        const mediaResponse=await fetch('/disks/Utility/CardCat%201.94.po');\n        if(!mediaResponse.ok) throw new Error('UniDisk image fetch failed for MLI verification: '+mediaResponse.status);\n        const mediaBytes=new Uint8Array(await mediaResponse.arrayBuffer());\n        const expectedBytes=Array.from(mediaBytes.slice(0,512));\n\n        const hw=apple2plus.hwObj();\n        const cpu=apple2plus.cpuObj();\n        const write=(addr,value)=>{\n            addr &= 0xFFFF;\n            const fn=hw.WR[hw.lineDecode(addr)];\n            if(typeof fn!=='function') throw new Error('No CPU-bus writer for $'+addr.toString(16));\n            fn(addr,value&0xFF);\n        };\n        const writeBytes=(addr,bytes)=>bytes.forEach((value,index)=>write(addr+index,value));\n\n        const codeAddr=0x6000;\n        const parmAddr=0x6100;\n        const bufferAddr=0x7000;\n        for(let i=0;i<512;i++) write(bufferAddr+i,0);\n\n        // JSR ProDOS MLI; READ_BLOCK; parameter pointer; NOP as the return trap.\n        writeBytes(codeAddr,[0x20,0x00,0xBF,0x80,0x00,0x61,0xEA]);\n        // READ_BLOCK params: count=3, unit=$D0 (slot 5 drive 2), buffer=$7000, block 0.\n        writeBytes(parmAddr,[0x03,0xD0,0x00,0x70,0x00,0x00]);\n\n        const before=cpu.watch();\n        cpu.setExecutionTrap(codeAddr+6);\n        cpu.setState({a:before.a,x:before.x,y:before.y,sp:before.sp,p:before.p,pc:codeAddr,cycle_delay:0});\n        const run=apple2plus.runLiveCpuTicks(2000000,{videoScale:0.001});\n        const after=cpu.watch();\n        cpu.clearExecutionTrap();\n\n        const actual=Array.from(hw.safe_dump(bufferAddr,bufferAddr+511));\n        const mismatches=[];\n        for(let i=0;i<512 && mismatches.length<8;i++)\n            if(actual[i]!==expectedBytes[i]) mismatches.push({offset:i,actual:actual[i],expected:expectedBytes[i]});\n\n        return {\n            trapped:!!run.trapped,\n            completedTicks:run.completedTicks,\n            pc:after.pc&0xFFFF,\n            a:after.a&0xFF,\n            carry:after.p&1,\n            match:mismatches.length===0,\n            mismatches,\n            actualPrefix:actual.slice(0,16),\n            expectedPrefix:expectedBytes.slice(0,16)\n        };\n    });\n    console.log('PRODOS_MLI_D0_READ',JSON.stringify(mliRead));\n    if(!mliRead.trapped || mliRead.carry || !mliRead.match)\n        throw new Error('ProDOS MLI READ_BLOCK on S5,D2 ($D0) failed: '+JSON.stringify(mliRead));\n"""
          if old not in s: raise SystemExit('stale S5,D2 vector assertion marker not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Syntax and harness guards
        run: |
          node --check tests/liron_two_device_prodos_acceptance.js
          node --check tests/cardcat_unidisk_browser_acceptance.js
          node --check tests/liron_surface_map_browser_acceptance.js
          if grep -nE '\.(loadImage|readBlock)[[:space:]]*\(' tests/cardcat_unidisk_browser_acceptance.js tests/liron_two_device_prodos_acceptance.js tests/liron_surface_map_browser_acceptance.js; then
            echo "Browser acceptance harness must not bypass the public mount/MLI paths"
            exit 1
          fi

      - name: Full Node regression suite
        run: node --test tests/*.test.js

      - name: Runtime identifier and Disk II guards
        run: |
          test -z "$(git ls-files 'node_modules/**')"
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_apple2io.js
          node --check res/EMU_apple2main.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for root in ('res','tests'):
              for p in Path(root).glob('*.js'):
                  text=p.read_text()
                  for pat in [r"(['\"])UNIDISK35\1",r'UNIDISK35_',r'UNIDISK35\.po']:
                      if re.search(pat,text): bad.append(f'{p}: {pat}')
          if bad: raise SystemExit('\n'.join(bad))
          PY
          git diff --exit-code 9534b27856a32c55d24eb426e2760ae16ad50960 -- res/EMU_CARD_appledisk2.js

      - name: Standalone build
        run: |
          node .github/scripts/inline.cjs
          test -s dist/RetroAppleJS.html
          grep -q 'lironSurfaceMap_popup' dist/RetroAppleJS.html
          grep -q 'deviceToolSurfaceMapHTML' dist/RetroAppleJS.html
          git checkout -- dist/RetroAppleJS.html
          git diff --exit-code -- dist/RetroAppleJS.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Full Liron browser acceptance suite
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-final.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/cardcat_unidisk_browser_acceptance.js
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_two_device_prodos_acceptance.js
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_surface_map_browser_acceptance.js

      - name: Remove temporary diagnostics and commit verified repair
        run: |
          rm -f \
            .github/workflows/liron-pr-readiness-verification.yml \
            .github/workflows/liron-smartport-unit0-repair.yml \
            .github/workflows/liron-two-device-prodos-diagnostic.yml \
            .github/workflows/liron-two-device-mli-diagnostic.yml \
            .github/workflows/liron-two-device-prodos-repair.yml \
            diagnostics-liron-two-device-prodos.txt \
            diagnostics-liron-two-device-mli.txt
          test ! -e .github/workflows/liron-pr-readiness-verification.yml
          test ! -e .github/workflows/liron-smartport-unit0-repair.yml
          test ! -e .github/workflows/liron-two-device-prodos-diagnostic.yml
          test ! -e .github/workflows/liron-two-device-mli-diagnostic.yml
          test ! -e diagnostics-liron-two-device-prodos.txt
          test ! -e diagnostics-liron-two-device-mli.txt
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify second SmartPort unit through ProDOS MLI"
          git push origin HEAD:fix/liron-two-device-prodos-followup
