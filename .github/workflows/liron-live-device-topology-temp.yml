name: Temporary Liron live topology fix

permissions:
  contents: write

on:
  push:
    branches: ["fix/liron-live-device-topology"]
    paths:
      - ".github/workflows/liron-live-device-topology-temp.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liron-live-device-topology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: RED - encode live topology behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          test_file=Path('tests/liron_toolbox.test.js')
          s=test_file.read_text()
          old="""test('Liron schedules a machine restart after a live SmartPort topology change', () => {
              let restarts=0;
              const warnings=[];
              const context=loadLiron({
                  console:{log(){},error(){},warn(msg){warnings.push(String(msg));}},
                  setTimeout(fn){fn();return 1;},
                  apple2plus:{restart(){restarts++;}}
              });
              const card=new context.AppleLiron();

              assert.equal(typeof card.onDeviceTopologyChanged,'function');
              assert.equal(card.onDeviceTopologyChanged({type:'attach',DCODE:'UNIDISK'}),true);
              assert.equal(restarts,1,
                  'live SmartPort attach must reboot so ProDOS rebuilds its boot-time device table');
              assert.ok(warnings.some(msg=>msg.includes('SmartPort topology changed')));
          });"""
          new="""test('Liron keeps device topology live: no restart and the next HD20 reuses unit 1', () => {
              let restarts=0;
              let timeouts=0;
              const warnings=[];
              const context=loadLiron({
                  console:{log(){},error(){},warn(msg){warnings.push(String(msg));}},
                  setTimeout(){timeouts++;return 1;},
                  apple2plus:{restart(){restarts++;}}
              });
              const card=new context.AppleLiron();
              const disk=new context.UniDisk35Device();

              assert.equal(disk.bindHost(card),true);
              assert.equal(disk.getUnit(),1);
              assert.equal(card.onDeviceTopologyChanged({type:'attach',DCODE:'UNIDISK',device:disk}),true);

              assert.equal(disk.unbindHost(card),true);
              assert.equal(card.getBus().getDevice(1),null);
              assert.equal(card.onDeviceTopologyChanged({type:'detach',DCODE:'UNIDISK',device:disk}),true);

              let hdUnit=0;
              const hd20={
                  id:{DCODE:'HD20',hostPCODE:'LIRON'},
                  getUnit(){return hdUnit;},
                  setUnit(unit){hdUnit=Number(unit);return hdUnit;}
              };
              assert.equal(card.attachSmartPortDevice(hd20),hd20);
              assert.equal(hd20.getUnit(),1,
                  'after ejecting Unit 1, HD20 must take the first free SmartPort unit');
              assert.equal(card.onDeviceTopologyChanged({type:'attach',DCODE:'HD20',device:hd20}),true);

              assert.equal(restarts,0,
                  'attaching or detaching a SmartPort device must not restart the emulator');
              assert.equal(timeouts,0,
                  'topology changes must not even schedule a deferred machine restart');
              assert.deepEqual(warnings,[]);
          });"""
          if old not in s:
              raise SystemExit('old topology restart test not found')
          test_file.write_text(s.replace(old,new,1))
          PY

          set +e
          node --test tests/liron_toolbox.test.js
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected RED failure, but the regression test passed before the implementation change."
            exit 1
          fi
          echo "RED confirmed: current Liron topology callback restarts the machine."

      - name: GREEN - keep SmartPort topology changes live
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          card=Path('res/EMU_CARD_LIRON.js')
          s=card.read_text()
          old="""    var topologyRestartPending=false;
              this.onDeviceTopologyChanged = function(change)
              {
                  if(topologyRestartPending) return true;
                  topologyRestartPending=true;
                  console.warn(\"Liron SmartPort topology changed; restarting the Apple II so ProDOS can rebuild its device table.\",change || {});

                  var restartHost=function()
                  {
                      topologyRestartPending=false;
                      if(typeof(apple2plus)===\"object\" && apple2plus && typeof(apple2plus.restart)===\"function\")
                          apple2plus.restart();
                  };

                  if(typeof(setTimeout)===\"function\") setTimeout(restartHost,0);
                  else restartHost();
                  return true;
              };"""
          new="""    this.onDeviceTopologyChanged = function(change)
              {
                  // Device attachment is a live hardware reconfiguration.  Do not
                  // reboot the emulated Apple II: a user may be deliberately changing
                  // SmartPort ordering (for example replacing Unit 1 with an HD20).
                  // Software such as ProDOS can rediscover the topology on the next
                  // explicit boot/reset chosen by the user.
                  if(bDebug) console.log(\"Liron SmartPort topology changed\",change || {});
                  return true;
              };"""
          if old not in s:
              raise SystemExit('Liron topology restart implementation not found')
          card.write_text(s.replace(old,new,1))
          PY

      - name: Verify targeted device-attachment suite
        shell: bash
        run: |
          node --check res/EMU_CARD_LIRON.js
          node --check tests/liron_toolbox.test.js
          node --test \
            tests/device_attachment_ui.test.js \
            tests/device_instance_identity.test.js \
            tests/liron_iwm.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js \
            tests/liron_readblock.test.js \
            tests/liron_writeblock.test.js \
            tests/smartport_port_metadata.test.js \
            tests/hd20_smartport_device.test.js \
            tests/hd20_writeblock.test.js \
            tests/hd20_media_routing.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/hd20_surface_map.test.js \
            tests/liron_browser_mount.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/liron_loader_diagnostics.test.js

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/liron-live-device-topology-temp.yml
          git add res/EMU_CARD_LIRON.js tests/liron_toolbox.test.js
          git commit -m "fix: keep Liron device topology changes live"
          git fetch origin fix/liron-live-device-topology
          git rebase origin/fix/liron-live-device-topology
          git push origin HEAD:fix/liron-live-device-topology
