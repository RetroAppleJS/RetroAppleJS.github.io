name: Fix WASM IC breakpoint edge cases

on:
  push:
    branches: [ "chatgpt/wasm-ic-breakpoint" ]
    paths:
      - ".github/workflows/chatgpt-fix-wasm-ic-edgecases.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wasm-ic-breakpoint

      - name: Apply edge-case patch
        shell: bash
        run: |
          echo '...

      - name: Validate
        run: |
          node --check res/EMU_WASMcpu6502.js
          grep -q 'instructionBreakpointArmIC' res/EMU_WASMcpu6502.js
          grep -q 'forwardInstructionDistance' res/EMU_WASMcpu6502.js
          grep -q 'finishHandoff("IC breakpoint "+instructionHex(target),false,true)' res/EMU_WASMcpu6502.js
          grep -q 'if(!keepJsPaused) closePopup();' res/EMU_WASMcpu6502.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add res/EMU_WASMcpu6502.js
          git commit -m "Fix WASM IC breakpoint rollover and pause semantics"
          git push origin HEAD:chatgpt/wasm-ic-breakpoint
