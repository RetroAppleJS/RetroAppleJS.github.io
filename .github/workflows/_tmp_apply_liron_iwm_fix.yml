name: Apply bounded Liron IWM handshake patch

permissions:
  contents: write

on:
  push:
    branches:
      - fix-liron-iwm-write-handshake-20260921
    paths:
      - ".github/workflows/_tmp_apply_liron_iwm_fix.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-liron-iwm-write-handshake-20260921
      - name: Apply exact LironIWM handshake fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('res/EMU_CARD_LIRON.js')
          s=p.read_text()
          old='''            // Without cycle-accurate IWM timing, a handshake poll advances the\n            // pending transmit byte. Only the final packet byte may underrun:\n            // SmartPortBus reaches RESPONSE_PENDING after accepting its $C8.\n            var busState = bus && typeof(bus.getState)==="function" ? bus.getState() : null;\n            if(busState && busState.protocolState==="RESPONSE_PENDING")\n                state.underrun=true;'''
          new='''            // Without cycle-accurate IWM timing, a handshake poll advances the\n            // pending transmit byte. Only the final packet byte may underrun.\n            // One-packet commands finish in RESPONSE_PENDING; WRITE BLOCK has\n            // separate command- and DATA-packet completion states.\n            var busState = bus && typeof(bus.getState)==="function" ? bus.getState() : null;\n            var packetComplete = busState && (\n                   busState.protocolState==="RESPONSE_PENDING"\n                || busState.protocolState==="WRITE_COMMAND_ACK"\n                || busState.protocolState==="WRITE_DATA_ACK"\n            );\n            if(packetComplete) state.underrun=true;'''
          if old not in s:
              raise SystemExit('expected LironIWM readHandshake snippet not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_CARD_LIRON.js
          git commit -m "fix: signal WRITE packet drain through Liron IWM"
          git push origin HEAD:fix-liron-iwm-write-handshake-20260921
