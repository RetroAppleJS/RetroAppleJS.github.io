name: Device attachment UI patch v2

permissions:
  contents: write

on:
  push:
    branches:
      - device-attachment-ui-20260919
    paths:
      - "tools/fix_patch_device_attachment_ui.py"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: device-attachment-ui-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct generator and apply patch
        run: |
          python3 tools/fix_patch_device_attachment_ui.py
          python3 tools/patch_device_attachment_ui.py
      - name: Verify focused tests
        run: |
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --test tests/device_attachment_ui.test.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js res/EMU_CARD_LIRON.js res/EMU_DEVICE_UNIDISK35.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add device attachment UI"
          git push
