name: Temporary UniDisk identity trace
on:
  push:
    branches: [feature/liron-unidisk-object-trace]
permissions:
  contents: write
jobs:
  test:
    if: github.event.head_commit.message == 'chore: implement temporary UniDisk identity trace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-object-trace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add UniDisk identity trace
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_apple2main.js')
          s=p.read_text()
          old='''        console.log("UniDisk 3.5 mount succeeded",details);\n        return true;\n'''
          new='''        console.log("UniDisk 3.5 mount succeeded",details);\n\n        // Diagnostic: compare the browser-router device with the exact\n        // SmartPort resident object currently attached to the owning Liron.\n        try\n        {\n            var io=typeof(apple2plus)==="object" && apple2plus\n                ? apple2plus.hwObj().io\n                : null;\n            var liron=io && Number.isInteger(Number(slotN))\n                ? io.SLOT2obj(Number(slotN))\n                : null;\n            var lironUnitDevice=null;\n            if(liron && liron.id?.PCODE==="LIRON" && typeof(liron.getBus)==="function")\n            {\n                var lironBus=liron.getBus();\n                if(lironBus && typeof(lironBus.getDevice)==="function")\n                    lironUnitDevice=lironBus.getDevice(Number(unit));\n            }\n\n            var routerState=typeof(unidisk.getState)==="function"\n                ? unidisk.getState() || {}\n                : {};\n            var lironUnitState=lironUnitDevice && typeof(lironUnitDevice.getState)==="function"\n                ? lironUnitDevice.getState() || {}\n                : {};\n\n            console.log("UniDisk 3.5 identity trace",{\n                 "slotN":slotN\n                ,"unit":unit\n                ,"sameObject":unidisk===lironUnitDevice\n                ,"routerDevice":unidisk\n                ,"lironUnitDevice":lironUnitDevice\n                ,"routerState":{\n                     "mediaLoaded":!!routerState.mediaLoaded\n                    ,"mediaFilename":routerState.mediaFilename || ""\n                }\n                ,"lironUnitState":{\n                     "mediaLoaded":!!lironUnitState.mediaLoaded\n                    ,"mediaFilename":lironUnitState.mediaFilename || ""\n                }\n            });\n        }\n        catch(traceErr)\n        {\n            console.warn("UniDisk 3.5 identity trace failed",traceErr);\n        }\n        return true;\n'''
          if old not in s:
              raise SystemExit('mount success marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify identity trace and regressions
        run: |
          node --check res/EMU_apple2main.js
          node --test tests/liron_unidisk_identity_trace.test.js tests/liron_loader_diagnostics.test.js tests/liron_browser_mount.test.js tests/liron_toolbox.test.js tests/liron_browser_integration.test.js tests/liron_card.test.js tests/liron_iwm.test.js tests/liron_readblock.test.js tests/liron_smartport_bus.test.js tests/liron_smartport_transport.test.js tests/unidisk35.test.js
      - name: Commit identity trace
        shell: bash
        run: |
          git config user.name "RetroAppleJS CI"
          git config user.email "actions@users.noreply.github.com"
          git add res/EMU_apple2main.js tests/liron_unidisk_identity_trace.test.js
          git commit -m "chore: trace UniDisk mount object identity"
          git pull --rebase origin feature/liron-unidisk-object-trace
          git push origin HEAD:feature/liron-unidisk-object-trace
