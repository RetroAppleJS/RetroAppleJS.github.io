name: Temporary UniDisk identity trace
on:
  push:
    branches: [feature/liron-unidisk-object-trace]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-object-trace
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run identity trace test
        run: node --test tests/liron_unidisk_identity_trace.test.js
