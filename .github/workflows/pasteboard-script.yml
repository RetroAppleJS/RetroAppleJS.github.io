name: Pasteboard Script
on:
  push:
    paths:
      - 'index.html'
      - 'res/EMU_pasteboard_script*'
      - 'res/EMU_apple2main.js'
      - 'res/pako.min.js'
      - 'res/EMU_DEVICE_keyboard.js'
      - 'res/EMU_CARD_appledisk2.js'
      - 'tests/pasteboard_script.test.cjs'
      - 'tests/pasteboard_prodos_automation.test.cjs'
      - 'tests/pasteboard_speed_uri.test.cjs'
      - 'tests/diskii_offline_embedded_images.test.cjs'
      - 'disks/*.dsk'
      - 'disks/*.DSK'
      - '.github/workflows/pasteboard-script.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'res/EMU_pasteboard_script*'
      - 'res/EMU_apple2main.js'
      - 'res/pako.min.js'
      - 'res/EMU_DEVICE_keyboard.js'
      - 'res/EMU_CARD_appledisk2.js'
      - 'tests/pasteboard_script.test.cjs'
      - 'tests/pasteboard_prodos_automation.test.cjs'
      - 'tests/pasteboard_speed_uri.test.cjs'
      - 'tests/diskii_offline_embedded_images.test.cjs'
      - 'disks/*.dsk'
      - 'disks/*.DSK'
      - '.github/workflows/pasteboard-script.yml'
permissions:
  contents: read
jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check page-context script runner
        run: |
          node --check res/EMU_pasteboard_script.js
          node --check res/EMU_apple2main.js
          node --check res/EMU_DEVICE_keyboard.js
          node --check res/EMU_CARD_appledisk2.js
      - name: Pasteboard Script unit tests
        run: node --test tests/pasteboard_script.test.cjs tests/pasteboard_prodos_automation.test.cjs tests/pasteboard_speed_uri.test.cjs tests/diskii_offline_embedded_images.test.cjs
