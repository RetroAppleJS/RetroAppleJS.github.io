name: Device picker interaction patch

permissions:
  contents: write

on:
  push:
    branches:
      - device-attachment-ui-20260919
    paths:
      - "tools/patch_device_picker_interaction.py"
      - ".github/workflows/device-picker-interaction-patch.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: device-attachment-ui-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply picker interaction patch
        run: python3 tools/patch_device_picker_interaction.py
      - name: Verify picker and Liron regressions
        run: |
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --test \
            tests/device_attachment_ui.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/liron_browser_integration.test.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js
          git diff --cached --quiet && exit 0
          git commit -m "refine: improve device picker interaction"
          git push
