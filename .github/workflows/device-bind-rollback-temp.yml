name: Device bind rollback patch temp

permissions:
  contents: write

on:
  push:
    branches:
      - device-instance-identity-20260920
    paths:
      - "tools/patch_device_bind_rollback.py"
      - ".github/workflows/device-bind-rollback-temp.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: device-instance-identity-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bind rollback patch
        run: python3 tools/patch_device_bind_rollback.py
      - name: Verify syntax and device-instance acceptance
        run: |
          node --check res/EMU_apple2io.js
          node --test \
            tests/device_attachment_ui.test.js \
            tests/device_instance_identity.test.js \
            tests/liron_smartport_bus.test.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: roll back failed device host binding"
          git push
