name: Apply HD20 media UI implementation

permissions:
  contents: write

on:
  push:
    branches:
      - hd20-download-filename-reset-20260921
    paths:
      - ".github/workflows/apply-hd20-media-ui-patch.yml"
      - ".github/scripts/apply_hd20_media_ui_patch.cjs"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-download-filename-reset-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply implementation patch
        run: node .github/scripts/apply_hd20_media_ui_patch.cjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js res/EMU_CARD_LIRON.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add HD20 download and logical media filename UI"
          git push origin HEAD:hd20-download-filename-reset-20260921
