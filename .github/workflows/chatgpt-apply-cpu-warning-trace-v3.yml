name: Apply CPU warning trace patch v3

on:
  push:
    branches:
      - chatgpt/cpu-warning-trace
    paths:
      - .github/workflows/chatgpt-apply-cpu-warning-trace-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cpu-warning-trace

      - name: Patch CPU source
        run: python3 .github/scripts/apply_cpu_warning_trace.py

      - name: Parse-check CPU source
        run: node --check res/EMU_cpu6502.js

      - name: Verify warning trace hooks
        shell: bash
        run: |
          grep -q 'const WARNING_TRACE_SIZE = 32' res/EMU_cpu6502.js
          test "$(grep -c 'warningTraceSuffix()' res/EMU_cpu6502.js)" -eq 4
          grep -q 'recordWarningTrace(instr_pc, opcode, warningTraceOperand)' res/EMU_cpu6502.js
          test "$(grep -c 'clearWarningTrace();' res/EMU_cpu6502.js)" -eq 3

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_cpu6502.js
          git commit -m "Add 32-instruction context to CPU warnings"
          git push origin HEAD:chatgpt/cpu-warning-trace
