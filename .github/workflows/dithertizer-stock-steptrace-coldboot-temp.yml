name: Temporary Dithertizer stock STEP TRACE observer

permissions:
  contents: read

on:
  push:
    branches: ["debug/dithertizer-stock-steptrace-observer"]
    paths:
      - ".github/workflows/dithertizer-stock-steptrace-coldboot-temp.yml"
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract original DSCAN 4.2 object from DOS disk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          disk=Path('disks/GFX/Computer Stations Dithertizer II Driver Software for II II+.dsk').read_bytes()
          def sec(t,s): return disk[(t*16+s)*256:(t*16+s+1)*256]
          def file_bytes(tt,ss):
              out=bytearray(); seen=set(); t,s=tt,ss
              while t and (t,s) not in seen:
                  seen.add((t,s)); b=sec(t,s); nt,ns=b[1],b[2]
                  for off in range(0x0C,0x100,2):
                      if off+1>=256: break
                      dt,ds=b[off],b[off+1]
                      if dt==0 and ds==0: continue
                      if dt<35 and ds<16: out.extend(sec(dt,ds))
                  t,s=nt,ns
              return bytes(out)
          vt=sec(17,0); t,s=vt[1],vt[2]; target=None; seen=set()
          while t and (t,s) not in seen:
              seen.add((t,s)); b=sec(t,s); nt,ns=b[1],b[2]
              for off in range(0x0B,0x100,35):
                  e=b[off:off+35]
                  if len(e)<35 or e[0] in (0,0xFF): continue
                  name=''.join(chr(x&0x7F) for x in e[3:33]).rstrip()
                  if name=='DSCAN 4.2.OBJ': target=(e[0],e[1])
              t,s=nt,ns
          assert target, 'DSCAN 4.2.OBJ not found'
          raw=file_bytes(*target)
          addr=raw[0]|raw[1]<<8; n=raw[2]|raw[3]<<8; payload=raw[4:4+n]
          assert addr==0x1C00 and n==1024 and len(payload)==1024,(addr,n,len(payload))
          Path('tests/_dscan42_payload.bin').write_bytes(payload)
          print(f'extracted DSCAN load=${addr:04X} len={len(payload)}')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production readVideoSync through real DSCAN machine code
        shell: bash
        run: |
          cat > /tmp/dscan-stock-observer.js <<'NODE'
          'use strict';
          const {chromium}=require('playwright');
          const baseURL='http://127.0.0.1:8000';
          const CHUNK_TICKS=250000;
          const MAX_CHUNKS=80;

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page=await browser.newPage({viewport:{width:1400,height:1000}});
            page.on('pageerror',err=>console.log('[pageerror]',String(err)));

            await page.goto(baseURL+'/index.html?mute=1',{waitUntil:'load',timeout:120000});
            await page.waitForFunction(()=>
              typeof apple2plus==='object' && apple2plus &&
              typeof DBG_STEPTRACE_SCENARIO==='object' && DBG_STEPTRACE_SCENARIO &&
              oEMU && oEMU.component && oEMU.component.CPU && oEMU.component.CPU.Apple2Debug &&
              document.getElementById('cpuDbg_breakCond'),
              {timeout:120000});

            await page.evaluate(()=>{
              if(typeof appleIntervalHandle!=='undefined' && appleIntervalHandle){clearInterval(appleIntervalHandle);appleIntervalHandle=null;}
              apple2plus.reset();
              apple2plus.runLiveCpuTicks(500000,{videoScale:0.02});
            });

            const setup=await page.evaluate(async()=>{
              const hw=apple2plus.hwObj();
              const dither=hw.io.SLOT2obj(8);
              if(!dither || !dither.id || dither.id.PCODE!=='DITHER') throw new Error('DITHER not present at SLOT2obj(8)');
              if(typeof dither.readVideoSync!=='function') throw new Error('production readVideoSync unavailable');

              const response=await fetch('/tests/_dscan42_payload.bin');
              if(!response.ok) throw new Error('DSCAN payload fetch failed '+response.status);
              const payload=new Uint8Array(await response.arrayBuffer());
              if(payload.length!==1024) throw new Error('DSCAN payload length '+payload.length);
              for(let i=0;i<payload.length;i++){
                const a=0x1C00+i, wr=hw.WR[hw.lineDecode(a)];
                if(typeof wr!=='function') throw new Error('RAM not writable at '+a.toString(16));
                wr(a,payload[i]);
              }

              globalThis.__dscanProductionReadVideoSync=dither.readVideoSync;
              globalThis.__dscanPassive={reached1D37:false,hits1D23:0,rows:[],reason:'running'};

              const dbg=oEMU.component.CPU.Apple2Debug;
              const cond=document.getElementById('cpuDbg_breakCond');
              cond.value='PC==$1D23 || PC==$1D2D || PC==$1D35 || PC==$1D37';
              let st=dbg.liveState();
              if(st.conditionalBreakpoint.armed) dbg.toggleConditionalBreakpointFromInput();
              if(!dbg.liveState().conditionalBreakpoint.armed) dbg.toggleConditionalBreakpointFromInput();

              DBG_STEPTRACE_SCENARIO.arm(`
                const FRAME=17030;
                onBreakpoint(function(bp) {
                  const s=globalThis.__dscanPassive;
                  const ticks=Number(oEMU.component.IO.self.getClockTicks())||0;
                  const phase=((ticks%FRAME)+FRAME)%FRAME;
                  const row={PC:bp.PC&0xFFFF,INS:Number(bp.INS)||0,A:bp.A&0xFF,D7:(bp.A&0x80)?1:0,clockTicks:Math.trunc(ticks),phase:Math.trunc(phase)};
                  s.rows.push(row);
                  if(row.PC===0x1D23)s.hits1D23++;
                  if(row.PC===0x1D37){s.reached1D37=true;s.reason='reached_$1D37';haltAtBreakpoint();}
                });
              `);

              const pcBefore=apple2plus.cpuObj().watch().pc&0xFFFF;
              const keys=apple2plus.keysObj();
              if(!keys || typeof keys.receiveText!=='function') throw new Error('A2KBD receiveText unavailable');
              keys.receiveText({data:'CALL 7168\n'});

              return {
                pcBefore,
                payloadBytes:payload.length,
                pcode:dither.id.PCODE,
                breakArmed:dbg.liveState().conditionalBreakpoint.armed,
                scenarioMode:DBG_STEPTRACE_SCENARIO.mode(),
                readVideoSyncUntouched:dither.readVideoSync===globalThis.__dscanProductionReadVideoSync
              };
            });
            console.log('DSCAN_PASSIVE_SETUP',JSON.stringify(setup));

            let state=null;
            for(let i=0;i<MAX_CHUNKS;i++){
              await page.evaluate(t=>apple2plus.runLiveCpuTicks(t,{videoScale:0.02}),CHUNK_TICKS);
              state=await page.evaluate(()=>{
                const s=globalThis.__dscanPassive;
                const d=apple2plus.hwObj().io.SLOT2obj(8);
                return {...s,pc:apple2plus.cpuObj().watch().pc&0xFFFF,readVideoSyncUntouched:d.readVideoSync===globalThis.__dscanProductionReadVideoSync};
              });
              if(state.reached1D37) break;
              if(state.rows.length>=2000) {state.reason='no_$1D37_after_2000_break_hits';break;}
            }

            console.log('DSCAN_PASSIVE_ROWS',JSON.stringify((state.rows||[]).slice(0,100)));
            console.log('DSCAN_PASSIVE_RESULT',JSON.stringify({
              reached1D37:state.reached1D37,
              reason:state.reason,
              hits1D23:state.hits1D23,
              rows:state.rows.length,
              pc:'$'+state.pc.toString(16).toUpperCase().padStart(4,'0'),
              readVideoSyncUntouched:state.readVideoSyncUntouched
            }));

            await browser.close();
            if(!setup.breakArmed || setup.scenarioMode!=='run' || !setup.readVideoSyncUntouched) process.exit(3);
            process.exit(state.reached1D37 ? 0 : 2);
          })().catch(err=>{console.error('DSCAN_PASSIVE_ERROR',err&&err.stack?err.stack:String(err));process.exit(10);});
          NODE

          python3 -m http.server 8000 >/tmp/retroapple-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node /tmp/dscan-stock-observer.js
