name: Liron toolbox Disk II layout temp

on:
  push:
    branches:
      - feature/liron-toolbox-diskii-layout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/liron_toolbox.test.js
