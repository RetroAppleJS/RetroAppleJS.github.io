name: Liron toolbox Disk II layout temp

on:
  push:
    branches:
      - feature/liron-toolbox-diskii-layout

jobs:
  test-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved shared-layout patch
        run: python3 .github/scripts/liron_toolbox_diskii_layout_patch.py
      - name: Syntax checks
        run: |
          node --check res/EMU_apple2io.js
          node --check res/EMU_CARD_appledisk2.js
          node --check res/EMU_CARD_LIRON.js
      - name: Focused regression
        shell: bash
        run: |
          set +e
          node --test tests/liron_toolbox.test.js > /tmp/liron-layout-test-output.txt 2>&1
          status=$?
          cat /tmp/liron-layout-test-output.txt
          if [ "$status" -ne 0 ]; then
            cp /tmp/liron-layout-test-output.txt .github/liron-layout-test-output.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/liron-layout-test-output.txt
            git commit -m "debug: capture Liron layout test output [skip ci]"
            git push
            exit "$status"
          fi
      - name: Liron regressions
        run: node --test tests/liron*.test.js tests/unidisk*.test.js
      - name: Commit GREEN production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js res/EMU_CARD_appledisk2.js res/EMU_CARD_LIRON.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: reuse Disk II media rows for Liron"
            git push
          fi
