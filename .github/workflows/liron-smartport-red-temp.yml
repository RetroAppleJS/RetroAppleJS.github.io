name: Temporary Liron SmartPort RED

on:
  push:
    branches: [ "feature/liron-unidisk-bus" ]
    paths:
      - ".github/workflows/liron-smartport-red-temp.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify transport test is RED for missing implementation
        shell: bash
        run: |
          set +e
          node --test tests/liron_smartport_transport.test.js > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Transport test unexpectedly passed before implementation"
            exit 1
          fi
          grep -Eq "setLines|protocolState" /tmp/red.log
