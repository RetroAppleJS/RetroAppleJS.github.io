name: Liron UniDisk surface map Task 1 native

permissions:
  contents: write

on:
  push:
    branches:
      - feature/liron-unidisk-surface-map
    paths:
      - .github/workflows/liron-unidisk-surface-map-task1-native.yml

jobs:
  task1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-surface-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: RED runtime rename
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          for p in Path('tests').glob('*.js'):
              s=p.read_text()
              s=re.sub(r"(['\"])UNIDISK35\1", lambda m: m.group(1)+'UNIDISK'+m.group(1), s)
              s=s.replace('UNIDISK35_','UNIDISK_').replace('UNIDISK35.po','UNIDISK.po')
              if p.name=='device_instance_identity.test.js':
                  s=s.replace('UNIDISK35','UNIDISK')
              p.write_text(s)
          PY
          set +e
          node --test \
            tests/unidisk35.test.js \
            tests/liron_smartport_bus.test.js \
            tests/hd20_media_routing.test.js \
            tests/liron_loader_diagnostics.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/device_instance_identity.test.js > /tmp/task1-red.log 2>&1
          rc=$?
          cat /tmp/task1-red.log
          test "$rc" -ne 0
      - name: GREEN runtime rename
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          for name in ['res/EMU_DEVICE_UNIDISK35.js','res/EMU_CARD_LIRON.js','res/EMU_apple2main.js']:
              p=Path(name)
              p.write_text(p.read_text().replace('UNIDISK35','UNIDISK'))
          PY
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --check res/EMU_CARD_LIRON.js
          node --check res/EMU_apple2main.js
          node --test \
            tests/unidisk35.test.js \
            tests/liron_smartport_bus.test.js \
            tests/hd20_media_routing.test.js \
            tests/liron_loader_diagnostics.test.js \
            tests/liron_toolbox.test.js \
            tests/liron_toolbox_eject.test.js \
            tests/hd20_toolbox_media.test.js \
            tests/device_instance_identity.test.js
      - name: Audit runtime token
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for root in ['res','tests']:
              for p in Path(root).glob('*.js'):
                  s=p.read_text()
                  for pat in [r"(['\"])UNIDISK35\1",r'UNIDISK35_',r'UNIDISK35\.po']:
                      if re.search(pat,s): bad.append(f'{p}: {pat}')
          if bad:
              raise SystemExit('Unexpected runtime UNIDISK35 references remain:\n'+'\n'.join(bad))
          PY
      - name: Commit Task 1
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/liron-unidisk-surface-map-task1-native.yml
          git add -A
          git commit -m "refactor: rename UniDisk runtime device code"
          git push origin HEAD:feature/liron-unidisk-surface-map
