name: Temporary UniDisk diagnostics debug
on:
  push:
    branches: [feature/liron-unidisk-loader-diagnostics]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-loader-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply proposed diagnostics without committing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_apple2main.js'); s=p.read_text()
          old='''    if(bytes.length===819200 || unidiskTarget)\n    {\n        if(bytes.length!==819200) return false;\n        var unidisk=EMU_unidisk35Device(slotN,unit);\n        if(!unidisk || typeof(unidisk.loadImage)!=="function") return false;\n        unidisk.loadImage(bytes,{"filename":filepath || ""});\n        return true;\n    }\n'''
          new='''    if(bytes.length===819200 || unidiskTarget)\n    {\n        var details={"slotN":slotN,"unit":unit,"filename":filepath || "","bytes":bytes.length};\n        if(bytes.length!==819200)\n        {\n            console.error("UniDisk 3.5 mount failed: invalid image size",{"slotN":slotN,"unit":unit,"filename":filepath || "","expected":819200,"actual":bytes.length});\n            return false;\n        }\n        var unidisk=EMU_unidisk35Device(slotN,unit);\n        if(!unidisk)\n        {\n            console.error("UniDisk 3.5 mount failed: target device not found",details);\n            return false;\n        }\n        if(typeof(unidisk.loadImage)!=="function")\n        {\n            console.error("UniDisk 3.5 mount failed: target device cannot load images",details);\n            return false;\n        }\n        try { unidisk.loadImage(bytes,{"filename":filepath || ""}); }\n        catch(err)\n        {\n            console.error("UniDisk 3.5 mount failed: device load exception",details,err);\n            throw err;\n        }\n        console.info("UniDisk 3.5 mount succeeded",details);\n        return true;\n    }\n'''
          if old not in s: raise SystemExit('router marker missing')
          p.write_text(s.replace(old,new,1))
          p=Path('res/EMU_CARD_LIRON.js'); s=p.read_text()
          s=s.replace('''    if(Number(file.size)!==819200)\n    {\n        if(typeof(alert)==="function")\n            alert("UniDisk 3.5 image must contain exactly 819200 bytes.");\n        clearInput();\n        return false;\n    }\n''','''    if(Number(file.size)!==819200)\n    {\n        console.error("UniDisk 3.5 load failed: invalid image size",{"slotN":slotN,"unit":unit,"filename":file.name || "","expected":819200,"actual":Number(file.size)});\n        if(typeof(alert)==="function") alert("UniDisk 3.5 image must contain exactly 819200 bytes.");\n        clearInput();\n        return false;\n    }\n''',1)
          s=s.replace('''            var mounted=typeof(EMU_mountDiskImage)==="function" &&\n                EMU_mountDiskImage(bytes,slotN,"UNIDISK35",file.name || "",unit);\n            if(!mounted) throw new Error("Unable to mount UniDisk 3.5 image.");\n''','''            var mounted=typeof(EMU_mountDiskImage)==="function" &&\n                EMU_mountDiskImage(bytes,slotN,"UNIDISK35",file.name || "",unit);\n            if(!mounted)\n            {\n                console.error("UniDisk 3.5 load failed: mount rejected",{"slotN":slotN,"unit":unit,"filename":file.name || "","bytes":bytes.length});\n                if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: mount rejected.");\n                return;\n            }\n''',1)
          s=s.replace('''    reader.onerror=function()\n    {\n        var msg=reader.error && reader.error.message\n            ? reader.error.message\n            : "Unable to read file.";\n        console.error("UniDisk 3.5 load failed: "+msg);\n        if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: "+msg);\n        clearInput();\n    };\n''','''    reader.onerror=function()\n    {\n        var msg=reader.error && reader.error.message ? reader.error.message : "Unable to read file.";\n        console.error("UniDisk 3.5 load failed: FileReader error",{"slotN":slotN,"unit":unit,"filename":file.name || "","error":msg});\n        if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: "+msg);\n        clearInput();\n    };\n''',1)
          p.write_text(s)
          PY
      - name: Capture test output
        shell: bash
        run: |
          set +e
          node --test tests/liron_loader_diagnostics.test.js > test-output.txt 2>&1
          echo $? > test-exit.txt
          set -e
          cat test-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liron-diagnostics-debug
          path: |
            test-output.txt
            test-exit.txt
