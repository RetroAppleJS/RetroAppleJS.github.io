name: Apply HD20 restart and eject fix

permissions:
  contents: write

on:
  push:
    branches:
      - hd20-download-filename-reset-20260921
    paths:
      - ".github/workflows/apply-hd20-restart-eject-fix.yml"
      - ".github/scripts/apply_hd20_restart_eject_fix.cjs"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-download-filename-reset-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply implementation fix
        run: node .github/scripts/apply_hd20_restart_eject_fix.cjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_apple2io.js res/EMU_DEVICE_HD20.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve HD20-only Liron restart and unformatted media name"
          git push origin HEAD:hd20-download-filename-reset-20260921
