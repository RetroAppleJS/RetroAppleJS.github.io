name: Temporary Card Cat manual Liron boot acceptance

permissions:
  contents: write

on:
  push:
    branches: ["feature/liron-unidisk-browser-mount"]
    paths:
      - ".github/workflows/liron-cardcat-manual-liron-boot-temp.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-browser-mount
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch Phase B to use the Apple II+ manual Liron boot path
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/cardcat_unidisk_browser_acceptance.js')
          s=p.read_text()
          old='''        const unmounted=io.unmount(diskInfo.card.mount.slotN);\n        if(!unmounted) throw new Error('Normal Apple2IO Disk II unmount failed');\n        apple2plus.reset();\n        return {\n            unmounted,\n            diskIIAfter:!!findCard(io,'DISKII'),\n            lironSlot:lironInfo.slotIndex,\n            media:disk.getState()\n        };'''
          new='''        const unmounted=io.unmount(diskInfo.card.mount.slotN);\n        if(!unmounted) throw new Error('Normal Apple2IO Disk II unmount failed');\n\n        // Apple II+ autostart only recognizes the original Disk II four-byte\n        // boot signature; Liron is normally started manually from slot 5.\n        // Invalidate the warm-start byte first so RESET returns to the monitor\n        // and performs the real slot scan before we enter the slot-5 boot command.\n        const hw=apple2plus.hwObj();\n        const softHigh=hw.safe_read(0x03F3);\n        const validPowerup=(softHigh^0xA5)&0xFF;\n        const forcedPowerup=(validPowerup^0xFF)&0xFF;\n        hw.WR[hw.lineDecode(0x03F4)](0x03F4,forcedPowerup);\n        const powerupAfterWrite=hw.safe_read(0x03F4);\n        if(powerupAfterWrite===validPowerup)\n            throw new Error('Unable to invalidate Apple II warm-start checksum');\n\n        apple2plus.reset();\n        return {\n            unmounted,\n            diskIIAfter:!!findCard(io,'DISKII'),\n            lironSlot:lironInfo.slotIndex,\n            coldReset:{softHigh,validPowerup,forcedPowerup,powerupAfterWrite},\n            media:disk.getState()\n        };'''
          if old not in s: raise SystemExit('Phase B reset pattern not found')
          s=s.replace(old,new,1)

          marker="""    console.log('UNIDISK_BOOT_SETUP',JSON.stringify(phaseBSetup));\n    if(!phaseBSetup.unmounted || phaseBSetup.diskIIAfter)\n        throw new Error('Disk II remained mounted during UniDisk boot');\n\n    const phaseB=await runUntil(page,snap=>{"""
          replacement="""    console.log('UNIDISK_BOOT_SETUP',JSON.stringify(phaseBSetup));\n    if(!phaseBSetup.unmounted || phaseBSetup.diskIIAfter)\n        throw new Error('Disk II remained mounted during UniDisk boot');\n\n    // Allow the cold-start ROM to finish its slot scan and settle in the\n    // monitor keyboard loop, then type the normal slot-5 boot command through\n    // the same pasteboard/keyboard pipe used by browser text input.\n    await runTicks(page,1);\n    const manualBoot=await page.evaluate(()=>{\n        const io=apple2plus.hwObj().io;\n        const boards=typeof(io.DCODE2obj)==='function' ? io.DCODE2obj('PASTEBO','A2BO') : [];\n        const pasteboard=boards.length===1 ? boards[0] : null;\n        if(!pasteboard || typeof(pasteboard.sendText)!=='function')\n            throw new Error('Normal browser pasteboard input is unavailable');\n        const pc=apple2plus.cpuObj().watch().pc&0xFFFF;\n        const target=pasteboard.getTargetAddress(io);\n        const sent=pasteboard.sendText(io,'C500G\\n');\n        return {pc,target,sent};\n    });\n    console.log('MANUAL_LIRON_BOOT',JSON.stringify(manualBoot));\n    if(!manualBoot.sent) throw new Error('Unable to type slot-5 Liron boot command');\n\n    const phaseB=await runUntil(page,snap=>{"""
          if marker not in s: raise SystemExit('manual boot insertion point not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          node --check tests/cardcat_unidisk_browser_acceptance.js
          if grep -nE '\.(loadImage|readBlock)[[:space:]]*\(' tests/cardcat_unidisk_browser_acceptance.js; then
            echo "Acceptance harness must not call UniDisk loadImage/readBlock directly"
            exit 1
          fi
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run corrected end-to-end acceptance
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/cardcat_unidisk_browser_acceptance.js
      - name: Commit acceptance correction after GREEN
        shell: bash
        run: |
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add tests/cardcat_unidisk_browser_acceptance.js
          git commit -m "test: boot browser-mounted UniDisk through Liron"
          git fetch origin feature/liron-unidisk-browser-mount
          git rebase origin/feature/liron-unidisk-browser-mount
          git push origin HEAD:feature/liron-unidisk-browser-mount
