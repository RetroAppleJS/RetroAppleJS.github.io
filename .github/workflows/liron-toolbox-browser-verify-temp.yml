name: Liron toolbox browser verify temp

on:
  push:
    branches:
      - feature/liron-toolbox-diskii-layout

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify native Liron file control displays mounted filename
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page=await browser.newPage({viewport:{width:1500,height:1000}});
            await page.goto('http://127.0.0.1:8000/index.html?mute=1',{waitUntil:'load',timeout:120000});
            await page.waitForFunction(()=>typeof apple2plus==='object' && !!apple2plus,{timeout:120000});
            const setup=await page.evaluate(()=>{
              if(typeof appleIntervalHandle!=='undefined' && appleIntervalHandle){clearInterval(appleIntervalHandle);appleIntervalHandle=null;}
              const io=apple2plus.hwObj().io;
              const lirons=io.PCODE2obj('LIRON');
              if(lirons.length!==1) throw new Error('Expected exactly one Liron');
              const liron=lirons[0];
              const slotN=Number(liron.mount.slotN);
              const slotID=io.slot2ID(slotN);
              io.refreshDeviceToolboxes({id:'devices',default_slot:slotID});
              return {slotN,slotID};
            });
            const inputID='#liron_unit_'+setup.slotID+'_1_file';
            const input=page.locator(inputID);
            if(await input.count()!==1) throw new Error('Missing Liron native file input '+inputID);
            if(!(await input.isVisible())) throw new Error('Liron native file input is not visible');
            const before=await page.locator('#device_tool_'+setup.slotID).innerText();
            if(/No disk/i.test(before)) throw new Error('Custom No disk label is still present: '+before);
            await input.setInputFiles('disks/Utility/ProDOS Packer 6.0.po');
            await page.waitForFunction(({slotN})=>{
              const io=apple2plus.hwObj().io;
              const liron=io.SLOT2obj(slotN);
              const disk=liron && liron.getUniDisk ? liron.getUniDisk() : null;
              const s=disk && disk.getState ? disk.getState() : null;
              return !!s && s.mediaLoaded===true && s.mediaBytes===819200 && s.mediaFilename==='ProDOS Packer 6.0.po';
            },{slotN:setup.slotN},{timeout:30000});
            const native=await input.evaluate(el=>({
              value:el.value,
              fileName:el.files && el.files[0] ? el.files[0].name : '',
              display:getComputedStyle(el).display
            }));
            const downloadDisabled=await page.locator('#liron_unit_'+setup.slotID+'_1_dump').isDisabled();
            console.log('LIRON_TOOLBOX_NATIVE_FILE',JSON.stringify({setup,native,downloadDisabled}));
            if(native.fileName!=='ProDOS Packer 6.0.po') throw new Error('Native input lost selected filename: '+JSON.stringify(native));
            if(native.display==='none') throw new Error('Native input became hidden');
            if(!downloadDisabled) throw new Error('UniDisk download placeholder must remain disabled');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
