name: Liron UniDisk surface map Task 4 final
permissions:
  contents: write
on:
  push:
    branches:
      - feature/liron-unidisk-surface-map
    paths:
      - .github/workflows/liron-unidisk-surface-map-task4-final-native.yml
      - .github/scripts/liron-task4-final.py
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-surface-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Task 4 implementation
        run: |
          python3 .github/scripts/liron-task4-final.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/liron_toolbox.test.js')
          s=p.read_text().replace('data-label="Unit1"','data-label="UNIDISK Unit1"').replace('data-label="Unit2"','data-label="UNIDISK Unit2"')
          p.write_text(s)
          PY
      - name: Verify Task 4
        run: |
          node --check res/EMU_CARD_LIRON.js
          node --check tests/liron_toolbox.test.js
          node --test tests/liron_toolbox.test.js tests/liron_toolbox_eject.test.js tests/hd20_toolbox_media.test.js
      - name: Commit Task 4
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/liron-unidisk-surface-map-task4-native.yml
          rm -f .github/workflows/liron-unidisk-surface-map-task4-green-native.yml
          rm -f .github/workflows/liron-unidisk-surface-map-task4-final-native.yml
          rm -f .github/scripts/liron-task4-final.py
          git add -A
          git commit -m "fix: synchronize Liron per-device media controls"
          git push origin HEAD:feature/liron-unidisk-surface-map
