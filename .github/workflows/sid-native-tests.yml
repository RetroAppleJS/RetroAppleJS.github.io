name: SID native 6502 regression tests

on:
  pull_request:
    paths:
      - 'asm/AUDIO/**'
      - 'tools/SID_Phase2A_build.js'
      - 'tools/SID_Phase2B1_build.js'
      - 'tools/SID_Phase2B2_build.js'
      - 'res/EMU_SID_PSID.js'
      - 'index.html'
      - 'res/EMU_CARD_SID.js'
      - 'tests/sid_phase*.test.js'
      - 'tests/sid_card.test.js'
      - 'res/ASM_core.js'
      - 'res/EMU_cpu6502.js'
      - 'res/EMU_CARD_SID.js'
      - 'res/EMU_DEVICE_SID_audio.js'
      - '.github/workflows/sid-native-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-psid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native PSID interpreter and raw transfer tests
        run: node --test tests/sid_phase2a_mrheli.test.js tests/sid_phase2b1.test.js tests/sid_phase2b2.test.js tests/sid_phase2b2_native.test.js tests/sid_card.test.js tests/sid_telemetry.test.js

      - name: Assemble distributable Phase 2B.2 player binaries
        run: node tools/SID_Phase2B2_build.js "$RUNNER_TEMP/sid-player"
      - name: Publish native player binaries and monitor listings
        uses: actions/upload-artifact@v4
        with:
          name: SID_Phase2B2_Native_6502
          path: ${{ runner.temp }}/sid-player/*
          if-no-files-found: error
