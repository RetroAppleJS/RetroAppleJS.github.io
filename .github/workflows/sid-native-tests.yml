name: SID reference and native 6502 regression tests

on:
  pull_request:
    paths:
      - 'asm/AUDIO/**'
      - 'tools/SID_Phase2A_build.js'
      - 'tools/SID_Phase2B1_build.js'
      - 'tools/SID_Phase2B2_build.js'
      - 'tools/SID_Phase2C1_build.js'
      - 'tools/SID_Phase2C2_build.js'
      - 'res/EMU_SID_PSID.js'
      - 'index.html'
      - 'res/EMU_CARD_SID.js'
      - 'tests/sid_phase*.test.js'
      - 'tests/sid_card.test.js'
      - 'res/ASM_core.js'
      - 'res/EMU_cpu6502.js'
      - 'res/EMU_CARD_SID.js'
      - 'res/EMU_DEVICE_SID_audio.js'
      - 'tools/SID_AUDIO_BENCH.html'
      - 'tools/SID_AUDIO_BENCH_core.js'
      - 'tests/sid_phase4a.test.js'
      - 'tests/sid_phase4b.test.js'
      - 'tests/helpers/sid_adsr_cycle_reference.js'
      - 'tests/sid_phase4c0.test.js'
      - 'tools/SID_ADSR_REFERENCE_COMPARE.js'
      - 'tools/SID_FILTER_BENCH.html'
      - 'tools/SID_FILTER_BENCH_core.js'
      - 'tests/sid_phase4d0.test.js'
      - 'tests/fixtures/sid_phase4d0_baseline.json'
      - 'docs/SID_PHASE4D.md'
      - 'docs/SID_PHASE4D2.md'
      - 'tools/SID_FILTER_CALIBRATION.html'
      - 'tools/SID_FILTER_CALIBRATION_core.js'
      - 'tests/sid_phase4d2.test.js'
      - '.github/workflows/sid-native-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-psid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SID synthesizer, telemetry, and Phase 4A–4D.2a tests
        run: node --test tests/sid_card.test.js tests/sid_telemetry.test.js tests/sid_phase4a.test.js tests/sid_phase4b.test.js tests/sid_phase4b1.test.js tests/sid_phase4c0.test.js tests/sid_phase4c12.test.js tests/sid_phase4d0.test.js tests/sid_phase4d1.test.js tests/sid_phase4d2.test.js
      - name: Smoke-test independent Phase 4C ADSR discrepancy report
        run: |
          node tools/SID_ADSR_REFERENCE_COMPARE.js --fixture=adsr-rate-change --clock=PAL > "$RUNNER_TEMP/sid-adsr-comparison.json"
          node -e "const d=require(process.argv[1]); if(d.schema!=='retroapplejs.sid.adsr-cycle-comparison.v1'||d.runs.length!==2) process.exit(1)" "$RUNNER_TEMP/sid-adsr-comparison.json"
      - name: Detect historical native PSID fixtures
        id: native-fixtures
        shell: bash
        run: |
          if [[ -f asm/AUDIO/SID2MB_prototype/Mr_Heli_original.sid &&
                -f asm/AUDIO/SID2MB_prototype/SID_PHASE2A_MR_HELI.S &&
                -f asm/AUDIO/SID_PHASE2B2_NATIVE_PLAYER.S &&
                -f asm/AUDIO/SID_PHASE2C1_IRQ_TIMER.S &&
                -f asm/AUDIO/SID_PHASE2C2_BACKGROUND_PLAYER.S ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Historical Phase 2A–2C fixture files are absent on this branch. Legacy native-player tests and historical build artifacts are skipped; the current SID device/Phase 4A tests above still run."
          fi
      - name: Run legacy native PSID interpreter tests (if fixtures exist)
        if: steps.native-fixtures.outputs.present == 'true'
        run: node --test tests/sid_phase2a_mrheli.test.js tests/sid_phase2b1.test.js tests/sid_phase2b2.test.js tests/sid_phase2b2_native.test.js tests/sid_phase2b2_rom.test.js tests/sid_phase2c1.test.js tests/sid_phase2c2.test.js

      - name: Assemble distributable Phase 2B.2 player binaries
        if: steps.native-fixtures.outputs.present == 'true'
        run: node tools/SID_Phase2B2_build.js "$RUNNER_TEMP/sid-player"
      - name: Publish native player binaries and monitor listings
        if: steps.native-fixtures.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SID_Phase2B2_Native_6502
          path: ${{ runner.temp }}/sid-player/*
          if-no-files-found: error

      - name: Assemble Phase 2C.1 native IRQ diagnostic
        if: steps.native-fixtures.outputs.present == 'true'
        run: node tools/SID_Phase2C1_build.js "$RUNNER_TEMP/sid-irq"
      - name: Publish native Phase 2C.1 IRQ diagnostic
        if: steps.native-fixtures.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SID_Phase2C1_IRQ_Diagnostic
          path: ${{ runner.temp }}/sid-irq/*
          if-no-files-found: error

      - name: Validate assembler-generated Phase 2C.2 contiguous image
        if: steps.native-fixtures.outputs.present == 'true'
        run: node tools/SID_Phase2C2_build.js
