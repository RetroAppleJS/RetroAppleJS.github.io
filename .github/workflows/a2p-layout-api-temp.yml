name: A2P Layout API Temp Verification

on:
  push:
    branches:
      - a2p-layout-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run layout API regression tests
        run: node --test tests/apple2_html_layout.test.js tests/preview_distribution.test.js
