name: Apply UniDisk export and topology fix

permissions:
  contents: write

on:
  push:
    branches:
      - fix-hd20-restart-eject-20260921
    paths:
      - ".github/workflows/apply-unidisk-topology-fix.yml"
      - ".github/scripts/apply_unidisk_topology_fix.cjs"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hd20-restart-eject-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply implementation fix
        run: node .github/scripts/apply_unidisk_topology_fix.cjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_DEVICE_UNIDISK35.js res/EMU_CARD_LIRON.js res/EMU_apple2io.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: export UniDisk media and restart after SmartPort hotplug"
          git push origin HEAD:fix-hd20-restart-eject-20260921
