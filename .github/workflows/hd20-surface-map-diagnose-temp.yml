name: HD20 surface map diagnose temp

permissions:
  contents: read

on:
  push:
    branches:
      - hd20-surface-map-geometry-20260923
    paths:
      - ".github/workflows/hd20-surface-map-diagnose-temp.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-surface-map-geometry-20260923
      - name: Run generator to inspection point
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/hd20-surface-map-patch3-temp.yml').read_text()
          section=text.split('      - name: Build production patch\n',1)[1].split('      - name: Commit implementation\n',1)[0]
          body=section.split('        run: |\n',1)[1]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          body=body.split('node --check res/EMU_DEVICE_HD20.js',1)[0]
          Path('/tmp/build-before-check.sh').write_text(body+'\n')
          PY
          bash /tmp/build-before-check.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('res/EMU_CARD_LIRON.js').read_text()
          lines=s.splitlines()
          for n in range(2006,2015):
              print(n,repr(lines[n-1]))
          a=s.index('    this.deviceToolSurfaceMapHTML = function(unit,expectedHash)')
          b=s.index('    this.deviceToolSurfaceMapPosition = function(unit)',a)
          region=s[a:b]
          print('single-backslash-quote',region.count(chr(92)+'"'))
          print('double-backslash-quote',region.count(chr(92)+chr(92)+'"'))
          print('backslash total',region.count(chr(92)))
          PY
