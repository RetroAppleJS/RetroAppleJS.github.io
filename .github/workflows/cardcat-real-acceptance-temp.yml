name: Temporary real CardCat 1.94 acceptance

permissions:
  contents: read

on:
  push:
    branches: [ "feature/liron-unidisk-bus" ]
    paths:
      - ".github/workflows/cardcat-real-acceptance-temp.yml"

jobs:
  cardcat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download official Card Cat 1.94 disk
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://henrylowe.net/wp-content/uploads/2026/06/card-cat-1.94.dsk_.zip' \
            -o /tmp/cardcat.zip
          mkdir -p /tmp/cardcat
          unzip -j /tmp/cardcat.zip -d /tmp/cardcat
          DSK="$(find /tmp/cardcat -maxdepth 1 -type f -iname '*.dsk' | head -1)"
          test -n "$DSK"
          cp "$DSK" cardcat194.dsk
          test "$(stat -c%s cardcat194.dsk)" -ge 140000
          sha256sum cardcat194.dsk
      - name: Install browser driver
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save puppeteer-core@24
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Boot Card Cat in RetroAppleJS and inspect Videx screen
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8123 >/tmp/cardcat-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          'use strict';
          const puppeteer = require('puppeteer-core');

          function cleanChar(raw)
          {
              if(raw===0) return ' ';
              let c=raw&0x7f;
              if(c===0x7f) return '?';
              if(c<0x20) c+=0x40;
              return String.fromCharCode(c);
          }

          (async()=>{
              const browser=await puppeteer.launch({
                  executablePath:process.env.CHROME_PATH,
                  headless:true,
                  args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
              });
              const page=await browser.newPage();
              await page.setViewport({width:1400,height:1000});
              page.on('console',msg=>{
                  const t=msg.text();
                  if(/Liron|SmartPort|ERROR|error/i.test(t)) console.log('[browser]',t);
              });
              page.on('pageerror',err=>console.log('[pageerror]',String(err)));

              await page.goto('http://127.0.0.1:8123/index.html?mute=1',{waitUntil:'load',timeout:120000});
              await page.waitForFunction(()=>typeof apple2plus==='object' && !!apple2plus && typeof loadDisk_fromBuffer==='function',{timeout:120000});

              const setup=await page.evaluate(async()=>{
                  if(typeof appleIntervalHandle!=='undefined' && appleIntervalHandle)
                  {
                      clearInterval(appleIntervalHandle);
                      appleIntervalHandle=null;
                  }
                  const response=await fetch('/cardcat194.dsk');
                  if(!response.ok) throw new Error('CardCat disk fetch failed: '+response.status);
                  const bytes=new Uint8Array(await response.arrayBuffer());
                  const slot=EMU_defaultDiskIISlot();
                  _o.D1_buffer=bytes;
                  apple2plus.restart();
                  if(typeof appleIntervalHandle!=='undefined' && appleIntervalHandle)
                  {
                      clearInterval(appleIntervalHandle);
                      appleIntervalHandle=null;
                  }
                  const disk=apple2plus.hwObj().io.SLOT2obj(slot);
                  const liron=apple2plus.hwObj().io.SLOT2obj(5);
                  return {
                      bytes:bytes.length,
                      bootSlot:slot,
                      diskPCODE:disk && disk.id && disk.id.PCODE,
                      lironPCODE:liron && liron.id && liron.id.PCODE,
                      units:liron && liron.getBus ? liron.getBus().getUnits() : []
                  };
              });
              console.log('SETUP',JSON.stringify(setup));
              if(setup.bootSlot!==6 || setup.diskPCODE!=='DISKII' || setup.lironPCODE!=='LIRON')
                  throw new Error('Unexpected slot configuration: '+JSON.stringify(setup));

              async function snapshot()
              {
                  return await page.evaluate(()=>{
                      function decode(raw)
                      {
                          if(raw===0) return ' ';
                          var c=raw&0x7f;
                          if(c===0x7f) return '?';
                          if(c<0x20) c+=0x40;
                          return String.fromCharCode(c);
                      }
                      var videx=apple2plus.hwObj().io.SLOT2obj(3);
                      if(!videx || typeof videx.getVideoRAM!=='function')
                          return {screen:'',linear:'',crtc:[],bus:null};
                      var vram=videx.getVideoRAM();
                      var crtc=videx.getCRTCRegisters();
                      var cols=(crtc[1]&0x7f)||80;
                      var rows=(crtc[6]&0x7f)||24;
                      cols=Math.min(80,Math.max(1,cols));
                      rows=Math.min(25,Math.max(1,rows));
                      var start=((crtc[12]<<8)|crtc[13])&0x07ff;
                      var lines=[];
                      for(var r=0;r<rows;r++)
                      {
                          var s='';
                          for(var c=0;c<cols;c++)
                              s+=decode(vram[(start+r*cols+c)&0x07ff]);
                          lines.push(s.replace(/\s+$/,''));
                      }
                      var linear='';
                      for(var i=0;i<vram.length;i++) linear+=decode(vram[i]);
                      var liron=apple2plus.hwObj().io.SLOT2obj(5);
                      return {
                          screen:lines.join('\n'),
                          linear:linear,
                          crtc:Array.from(crtc),
                          bus:liron && liron.getBus ? liron.getBus().getState() : null
                      };
                  });
              }

              let found=false;
              let finalSnap=null;
              const chunks=160;
              const ticksPerChunk=500000;
              for(let i=0;i<chunks;i++)
              {
                  await page.evaluate((ticks)=>apple2plus.runLiveCpuTicks(ticks,{videoScale:0.02}),ticksPerChunk);
                  if((i%4)===3)
                  {
                      const snap=await snapshot();
                      finalSnap=snap;
                      const hay=(snap.screen+'\n'+snap.linear).toUpperCase();
                      const hasCardCat=hay.includes('CARD CAT');
                      const hasLiron=hay.includes('LIRON');
                      const hasSP1=/SP\s*:\s*1/.test(hay);
                      const hasNoUnits=hay.includes('NO UNITS') || /SP\s*:\s*0/.test(hay);
                      console.log('PROGRESS',JSON.stringify({millionTicks:(i+1)*ticksPerChunk/1000000,hasCardCat,hasLiron,hasSP1,hasNoUnits,bus:snap.bus}));
                      if(hasLiron && (hasSP1 || hasNoUnits))
                      {
                          found=true;
                          break;
                      }
                  }
              }

              if(!finalSnap) finalSnap=await snapshot();
              console.log('--- CARD CAT VIDEX SCREEN ---');
              console.log(finalSnap.screen);
              console.log('--- END SCREEN ---');
              console.log('FINAL BUS',JSON.stringify(finalSnap.bus));
              const upper=(finalSnap.screen+'\n'+finalSnap.linear).toUpperCase();
              const hasLiron=upper.includes('LIRON');
              const hasSP1=/SP\s*:\s*1/.test(upper);
              const hasNoUnits=upper.includes('NO UNITS') || /SP\s*:\s*0/.test(upper);
              console.log('ACCEPTANCE',JSON.stringify({hasLiron,hasSP1,hasNoUnits,found}));

              await page.screenshot({path:'cardcat-final.png',fullPage:true});
              await browser.close();

              if(!hasLiron) process.exit(2);
              if(!hasSP1) process.exit(hasNoUnits?3:4);
          })().catch(err=>{console.error(err);process.exit(10);});
          NODE
      - name: Upload final browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardcat-real-acceptance
          path: cardcat-final.png
          if-no-files-found: ignore
