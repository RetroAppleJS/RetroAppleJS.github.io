name: Temporary fix duplicate Liron include

permissions:
  contents: write

on:
  push:
    branches: [ "feature/liron-unidisk-bus" ]
    paths:
      - ".github/workflows/fix-liron-duplicate-temp.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove duplicate Liron script tag
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='            <script type="text/javascript" src="res/EMU_CARD_LIRON.js"></script>'
          if s.count(tag) != 2:
              raise SystemExit(f'expected exactly 2 Liron tags before fix, found {s.count(tag)}')
          first=s.index(tag)
          second=s.index(tag,first+len(tag))
          s=s[:second]+s[second+len(tag):]
          if s.count(tag) != 1:
              raise SystemExit('failed to leave exactly one Liron tag')
          p.write_text(s)
          PY
          node --test tests/liron_browser_integration.test.js
      - name: Commit browser integration fix
        shell: bash
        run: |
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add index.html
          git commit -m "fix: load Liron browser script once"
          git fetch origin feature/liron-unidisk-bus
          git rebase origin/feature/liron-unidisk-bus
          git push origin HEAD:feature/liron-unidisk-bus
