name: Temporary Liron toolbox load GREEN
on:
  push:
    branches: [feature/liron-unidisk-toolbox]
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-toolbox
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Implement per-unit browser file loading
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_CARD_LIRON.js')
          s=p.read_text()

          old='''                + " <input type=\\"file\\" id=\\""+controlID+"_file\\" accept=\\".po\\" style=\\"display:none\\">"'''
          new='''                + " <input type=\\"file\\" id=\\""+controlID+"_file\\" accept=\\".po\\" style=\\"display:none\\" onchange=\\"apple2plus.hwObj().io.SLOT2obj("+slotN+").deviceToolLoadFile(this,"+unit+")\\">"'''
          if old not in s:
              raise SystemExit('Liron file input renderer marker not found')
          s=s.replace(old,new,1)

          marker='    this.deviceToolSlotHTML = function(ctx)\n'
          if marker not in s:
              raise SystemExit('Liron toolbox renderer marker not found')
          if 'this.deviceToolLoadFile = function(input,unit)' in s:
              raise SystemExit('Liron load handler unexpectedly already exists')

          method=r'''    this.deviceToolLoadFile = function(input,unit)
          {
              var file=input && input.files && input.files[0];
              if(!file) return false;

              unit=Number(unit);
              var slotN=liron.mount ? Number(liron.mount.slotN) : NaN;
              if(!Number.isInteger(unit) || unit<1 || unit>8 || !Number.isInteger(slotN))
                  return false;

              function clearInput()
              {
                  try { input.value=""; } catch(e) {}
              }

              if(Number(file.size)!==819200)
              {
                  if(typeof(alert)==="function")
                      alert("UniDisk 3.5 image must contain exactly 819200 bytes.");
                  clearInput();
                  return false;
              }

              var reader=new FileReader();
              reader.onload=function(ev)
              {
                  try
                  {
                      var bytes=new Uint8Array(ev.target.result);
                      var mounted=typeof(EMU_mountDiskImage)==="function" &&
                          EMU_mountDiskImage(bytes,slotN,"UNIDISK35",file.name || "",unit);
                      if(!mounted) throw new Error("Unable to mount UniDisk 3.5 image.");

                      if(typeof(apple2plus)==="object" && apple2plus)
                      {
                          var io=apple2plus.hwObj().io;
                          if(io && typeof(io.refreshDeviceToolboxes)==="function")
                              io.refreshDeviceToolboxes({
                                   "id":"devices"
                                  ,"default_slot":typeof(io.slot2ID)==="function"
                                      ? io.slot2ID(slotN)
                                      : undefined
                              });
                      }
                  }
                  catch(err)
                  {
                      console.error("UniDisk 3.5 load failed",err);
                      if(typeof(alert)==="function")
                          alert("UniDisk 3.5 load failed: "+(err && err.message ? err.message : err));
                  }
                  finally
                  {
                      clearInput();
                  }
              };
              reader.onerror=function()
              {
                  var msg=reader.error && reader.error.message
                      ? reader.error.message
                      : "Unable to read file.";
                  console.error("UniDisk 3.5 load failed: "+msg);
                  if(typeof(alert)==="function") alert("UniDisk 3.5 load failed: "+msg);
                  clearInput();
              };
              reader.readAsArrayBuffer(file);
              return true;
          };

          '''
          s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Run toolbox and Liron regressions
        run: |
          node --check res/EMU_CARD_LIRON.js
          node --test tests/liron_toolbox.test.js tests/liron_browser_mount.test.js tests/liron_browser_integration.test.js tests/liron_card.test.js tests/liron_iwm.test.js tests/liron_readblock.test.js tests/liron_smartport_bus.test.js tests/liron_smartport_transport.test.js tests/unidisk35.test.js
      - name: Commit production load handler
        shell: bash
        run: |
          git config user.name "RetroAppleJS CI"
          git config user.email "actions@users.noreply.github.com"
          git add res/EMU_CARD_LIRON.js
          git commit -m "feat: load UniDisk media from Liron toolbox"
          git pull --rebase origin feature/liron-unidisk-toolbox
          git push origin HEAD:feature/liron-unidisk-toolbox
