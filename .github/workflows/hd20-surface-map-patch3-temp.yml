name: HD20 surface map patch v3 temp

permissions:
  contents: write

on:
  push:
    branches:
      - hd20-surface-map-geometry-20260923
    paths:
      - ".github/workflows/hd20-surface-map-patch3-temp.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-surface-map-geometry-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build production patch
        shell: bash
        run: |
          cat > /tmp/hd20_surface_html.js <<'JS'
              this.deviceToolSurfaceMapHTML = function(unit,expectedHash)
              {
                  unit=Number(unit); expectedHash=Number(expectedHash);
                  var device=deviceToolSurfaceTarget(unit,expectedHash);
                  var slotN=liron.mount ? Number(liron.mount.slotN) : NaN;
                  var iconClass=deviceSurfaceMapSyncEnabled ? "fa-stop-circle" : "fa-sync-alt";
                  var syncOnClick=Number.isInteger(slotN)
                      ? "apple2plus.hwObj().io.SLOT2obj("+slotN+").deviceToolSurfaceMapToggleSync();event.stopPropagation();"
                      : "event.stopPropagation();";
                  var header='<div class="liron-surface-header" style="display:flex;align-items:center;gap:6px;margin:0 0 4px 0">'+
                      '<button class="appbut" type="button" style="text-align:center" title="Disk surface map sync" onclick="'+syncOnClick+'">'+
                      '<i class="fa '+iconClass+'" id="lironSurfaceMap_monitoring"></i></button>'+
                      '<div class="liron-surface-title"><b>Disk surface map</b></div>'+
                      '</div>';

                  if(!device)
                      return header+'<div class="liron-surface-status">Device instance is no longer attached.</div>';

                  var instance=deviceToolInstanceHex(device) || "????";
                  var state=typeof(device.getState)==="function" ? device.getState() || {} : {};
                  var deviceCode=String(device.id?.DCODE || "");

                  if(deviceCode==="HD20")
                  {
                      var geometry=device.getSurfaceMapGeometry();
                      var page=Math.max(0,Math.min(geometry.pageCount-1,Number(deviceSurfaceMapState.page)||0));
                      deviceSurfaceMapState.page=page;
                      var pageBase=page*geometry.blocksPerPage;
                      var image=typeof(device.getImage)==="function" ? device.getImage() : null;
                      var position=typeof(device.getSurfaceMapPosition)==="function" ? device.getSurfaceMapPosition() : null;
                      var prevDisabled=page<=0 ? " disabled" : "";
                      var nextDisabled=page>=geometry.pageCount-1 ? " disabled" : "";
                      var nav='<div class="liron-surface-page-nav" style="display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 4px 0">'+
                          '<button class="appbut" type="button" title="Previous MiB" onclick="apple2plus.hwObj().io.SLOT2obj('+slotN+').deviceToolSurfaceMapPage(-1);event.stopPropagation();"'+prevDisabled+'><i class="fa fa-chevron-left"></i></button>'+
                          '<span class="liron-surface-page" style="min-width:70px;text-align:center;font-size:10px">MiB '+page+' / '+(geometry.pageCount-1)+'</span>'+
                          '<button class="appbut" type="button" title="Next MiB" onclick="apple2plus.hwObj().io.SLOT2obj('+slotN+').deviceToolSurfaceMapPage(1);event.stopPropagation();"'+nextDisabled+'><i class="fa fa-chevron-right"></i></button>'+
                          '</div>';
                      var meta='<div class="liron-surface-meta" style="font-size:10px;color:#888;margin-top:4px;line-height:12px">'+
                          'Instance #'+instance+' · 20 MiB · 40960 × 512-byte blocks'+
                          '</div>';
                      var out=header+nav+'<div class="liron-surface-panels liron-surface-hd20" style="display:inline-flex;align-items:flex-start;gap:8px;width:max-content">';

                      function rangeTitle(panel)
                      {
                          var start=page+(panel*0.5);
                          var end=start+0.5;
                          if(page===0 && panel===0) return "0–512 KiB";
                          if(page===0 && panel===1) return "512 KiB–1 MiB";
                          return String(start).replace(/\.0$/,"")+"–"+String(end).replace(/\.0$/,"")+" MiB";
                      }

                      function offsetLabel(bytes)
                      {
                          var mib=bytes/1048576;
                          if(Math.abs(mib-Math.round(mib))<1e-9) return Math.round(mib)+"M";
                          return (bytes/1024)+"K";
                      }

                      for(var panel=0;panel<geometry.panelsPerPage;panel++)
                      {
                          out += '<section class="liron-surface-side liron-surface-hd20-panel" data-hd20-panel="'+panel+'" style="flex:0 0 auto;margin:0">'+
                              '<div class="liron-surface-side-title" style="text-align:center;font-size:11px;line-height:12px;padding:0 0 2px 36px">'+rangeTitle(panel)+'</div>'+
                              '<div class="liron-surface-grid liron-surface-hd20-grid" style="display:grid;grid-template-columns:36px repeat(16,10px);grid-template-rows:repeat(64,10px);gap:0;overflow:hidden">';

                          var panelBase=pageBase+panel*geometry.blocksPerPanel;
                          for(var row=0;row<geometry.rowsPerPanel;row++)
                          {
                              var rowOffset=(panelBase+row*geometry.columnsPerPanel)*geometry.bytesPerBlock;
                              var label=(row%8===0) ? offsetLabel(rowOffset) : "";
                              out += '<span class="liron-surface-track liron-surface-block-row" data-row-label="'+row+'" style="display:flex;align-items:center;justify-content:flex-end;height:10px;padding-right:4px;box-sizing:border-box;color:#aaa;font-family:Courier;font-size:9px">'+label+'</span>';
                              for(var column=0;column<geometry.columnsPerPanel;column++)
                              {
                                  var block=panelBase+row*geometry.columnsPerPanel+column;
                                  var offset=block*geometry.bytesPerBlock;
                                  var density=deviceToolSurfaceDensity(image,block);
                                  var isHead=!!(position && position.block===block);
                                  var bandEnd=(row%8===7 && row<geometry.rowsPerPanel-1);
                                  var tip="Block "+block+" · $"+block.toString(16).toUpperCase().padStart(6,"0")+" · 512 bytes · Offset $"+offset.toString(16).toUpperCase().padStart(8,"0")+" · nonzero="+density.nonzero+"/512 · avg="+density.avg;
                                  out += '<span class="liron-surface-cell active'+(isHead?' liron-surface-head':'')+'" style="'+
                                      deviceToolSurfaceDensityCellStyle(density.pct,true)+(bandEnd?'border-bottom:2px solid #777;':'')+(isHead?'outline:2px solid #FFF;outline-offset:-1px;':'')+
                                      '" data-surface-cell="1" data-active="1" data-density="'+density.pct+'" data-panel="'+panel+'" data-row="'+row+'" data-column="'+column+
                                      '" data-block="'+block+'" data-offset="'+offset+'" data-head="'+(isHead?'1':'0')+'" title="'+deviceToolSurfaceEscape(tip)+'"></span>';
                              }
                          }
                          out += '</div></section>';
                      }
                      return out+'</div>'+meta;
                  }

                  var meta='<div class="liron-surface-meta" style="font-size:10px;color:#888;margin-top:4px;line-height:12px">'+
                      'Instance #'+instance+' · 800 KB · 1600 × 512-byte sectors'+
                      '</div>';

                  if(!state.mediaLoaded)
                      return header+'<div class="liron-surface-status">No media loaded.</div>'+meta;

                  var image=typeof(device.getImage)==="function" ? device.getImage() : null;
                  var head=typeof(device.getHeadSurfacePosition)==="function" ? device.getHeadSurfacePosition() : null;
                  var out=header+'<div class="liron-surface-panels" style="display:inline-flex;align-items:flex-start;gap:8px;width:max-content">';

                  for(var side=0;side<2;side++)
                  {
                      out += '<section class="liron-surface-side" data-side="'+side+'" style="flex:0 0 auto;margin:0">'+
                          '<div class="liron-surface-side-title" style="text-align:center;font-size:11px;line-height:12px;padding:0 0 2px 22px">Side '+side+'</div>'+
                          '<div class="liron-surface-grid" style="display:grid;grid-template-columns:22px repeat(12,10px);grid-template-rows:repeat(80,10px);gap:0;overflow:hidden">';

                      for(var track=0;track<80;track++)
                      {
                          out += '<span class="liron-surface-track" data-track-label="'+track+'" style="display:flex;align-items:center;justify-content:flex-end;height:10px;padding-right:4px;box-sizing:border-box;color:#aaa;font-family:Courier;font-size:9px">T'+track+'</span>';
                          for(var sector=11;sector>=0;sector--)
                          {
                              var count=device.getSurfaceTrackSectorCount(track);
                              var active=sector<count;
                              if(active)
                              {
                                  var block=device.surfaceSectorToBlock(side,track,sector);
                                  var offset=block*512;
                                  var density=deviceToolSurfaceDensity(image,block);
                                  var isHead=!!(head && head.side===side && head.track===track && head.sector===sector);
                                  var tip="Side "+side+" · Track "+track+" · Sector "+sector+" · Block "+block+" · 512 bytes · nonzero="+density.nonzero+"/512 · avg="+density.avg;
                                  out += '<span class="liron-surface-cell active'+(isHead?' liron-surface-head':'')+'" style="'+
                                      deviceToolSurfaceDensityCellStyle(density.pct,true)+(isHead?'outline:2px solid #FFF;outline-offset:-1px;':'')+
                                      '" data-surface-cell="1" data-active="1" data-density="'+density.pct+'" data-side="'+side+'" data-track="'+track+'" data-sector="'+sector+
                                      '" data-block="'+block+'" data-offset="'+offset+'" data-head="'+(isHead?'1':'0')+'" title="'+deviceToolSurfaceEscape(tip)+'"></span>';
                              }
                              else
                              {
                                  out += '<span class="liron-surface-cell inactive" style="'+deviceToolSurfaceDensityCellStyle(0,false)+
                                      '" data-surface-cell="1" data-active="0" data-side="'+side+'" data-track="'+track+'" data-sector="'+sector+
                                      '" title="Side '+side+' · Track '+track+' · Sector '+sector+' · not present"></span>';
                              }
                          }
                      }
                      out += '</div></section>';
                  }
                  return out+'</div>'+meta;
              };
          JS

          cat > /tmp/hd20_surface_update.js <<'JS'
              this.deviceToolSurfaceMapUpdate = function()
              {
                  if(typeof(document)==="undefined" || !document.getElementById) return false;
                  if(!Number.isInteger(deviceSurfaceMapState.unit) || !Number.isInteger(deviceSurfaceMapState.hash)) return false;

                  var device=deviceToolSurfaceTarget(deviceSurfaceMapState.unit,deviceSurfaceMapState.hash);
                  var popup=document.getElementById("lironSurfaceMap_popup");
                  var text=document.getElementById("lironSurfaceMap_popup_text");
                  if(!device || !popup || !text || popup.hidden!==false) return false;

                  var state=typeof(device.getState)==="function" ? device.getState() || {} : {};
                  var hardDisk=String(device.id?.DCODE || "")==="HD20";
                  if(!hardDisk && !state.mediaLoaded) return false;

                  if(hardDisk && deviceSurfaceMapSyncEnabled && typeof(device.getSurfaceMapPosition)==="function")
                  {
                      var follow=device.getSurfaceMapPosition();
                      if(follow && Number.isInteger(follow.page) && follow.page!==deviceSurfaceMapState.page)
                      {
                          deviceSurfaceMapState.page=follow.page;
                          text.innerHTML=liron.deviceToolSurfaceMapHTML(deviceSurfaceMapState.unit,deviceSurfaceMapState.hash);
                          return true;
                      }
                  }

                  var image=typeof(device.getImage)==="function" ? device.getImage() : null;
                  var cells=typeof(text.querySelectorAll)==="function"
                      ? text.querySelectorAll('[data-surface-cell="1"][data-active="1"]')
                      : [];

                  for(var i=0;i<cells.length;i++)
                  {
                      var cell=cells[i];
                      var block=Number(cell.dataset ? cell.dataset.block : cell.getAttribute("data-block"));
                      var density=deviceToolSurfaceDensity(image,block);
                      cell.style.backgroundColor=deviceToolSurfaceDensityPalette()[density.pct];
                      if(cell.dataset) cell.dataset.density=String(density.pct);
                      cell.style.outline="";
                      cell.style.outlineOffset="";
                      if(cell.classList) cell.classList.remove("liron-surface-head");
                      if(cell.dataset) cell.dataset.head="0";
                  }

                  var selector=null;
                  if(hardDisk && typeof(device.getSurfaceMapPosition)==="function")
                  {
                      var position=device.getSurfaceMapPosition();
                      if(position && position.page===deviceSurfaceMapState.page)
                          selector='[data-surface-cell="1"][data-block="'+position.block+'"]';
                  }
                  else
                  {
                      var head=typeof(device.getHeadSurfacePosition)==="function" ? device.getHeadSurfacePosition() : null;
                      if(head) selector='[data-surface-cell="1"][data-side="'+head.side+'"][data-track="'+head.track+'"][data-sector="'+head.sector+'"]';
                  }

                  if(selector && typeof(text.querySelector)==="function")
                  {
                      var headCell=text.querySelector(selector);
                      if(headCell)
                      {
                          headCell.style.outline="2px solid #FFF";
                          headCell.style.outlineOffset="-1px";
                          if(headCell.classList) headCell.classList.add("liron-surface-head");
                          if(headCell.dataset) headCell.dataset.head="1";
                      }
                  }
                  return true;
              };
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re

          hd=Path('res/EMU_DEVICE_HD20.js')
          s=hd.read_text()
          s=s.replace('    const DEVICE_NAME = String(options.name===undefined ? "HARD DISK 20" : options.name).slice(0,16);\n', '''    const DEVICE_NAME = String(options.name===undefined ? "HARD DISK 20" : options.name).slice(0,16);\n    const SURFACE_COLUMNS = 16;\n    const SURFACE_ROWS = 64;\n    const SURFACE_BLOCKS_PER_PANEL = SURFACE_COLUMNS * SURFACE_ROWS;\n    const SURFACE_PANELS_PER_PAGE = 2;\n    const SURFACE_BLOCKS_PER_PAGE = SURFACE_BLOCKS_PER_PANEL * SURFACE_PANELS_PER_PAGE;\n    const SURFACE_PAGE_COUNT = BLOCK_COUNT / SURFACE_BLOCKS_PER_PAGE;\n''')
          s=s.replace('        ,dirty:false\n', '        ,dirty:false\n        ,lastBlock:null\n')
          s=s.replace('''    function notifyFilenameChange(previous)\n    {\n        if(previous===suggestedFilename()) return;\n        if(host && typeof(host.deviceMediaMetadataChanged)==="function")\n            host.deviceMediaMetadataChanged(device);\n    }\n''', '''    function notifyFilenameChange(previous)\n    {\n        if(previous===suggestedFilename()) return;\n        if(host && typeof(host.deviceMediaMetadataChanged)==="function")\n            host.deviceMediaMetadataChanged(device);\n    }\n\n    function surfacePosition(blockNumber)\n    {\n        blockNumber=Number(blockNumber);\n        if(!Number.isInteger(blockNumber) || blockNumber<0 || blockNumber>=BLOCK_COUNT) return null;\n        var page=Math.floor(blockNumber/SURFACE_BLOCKS_PER_PAGE);\n        var withinPage=blockNumber%SURFACE_BLOCKS_PER_PAGE;\n        var panel=Math.floor(withinPage/SURFACE_BLOCKS_PER_PANEL);\n        var withinPanel=withinPage%SURFACE_BLOCKS_PER_PANEL;\n        return {\n             "block":blockNumber\n            ,"page":page\n            ,"panel":panel\n            ,"row":Math.floor(withinPanel/SURFACE_COLUMNS)\n            ,"column":withinPanel%SURFACE_COLUMNS\n        };\n    }\n''')
          s=s.replace('    this.getSuggestedFilename = function() { return suggestedFilename(); };\n', '''    this.getSuggestedFilename = function() { return suggestedFilename(); };\n    this.getSurfaceMapGeometry = function()\n    {\n        return {\n             "kind":"logical-blocks"\n            ,"cellWidth":10\n            ,"cellHeight":10\n            ,"bytesPerBlock":BLOCK_SIZE\n            ,"totalBlocks":BLOCK_COUNT\n            ,"columnsPerPanel":SURFACE_COLUMNS\n            ,"rowsPerPanel":SURFACE_ROWS\n            ,"blocksPerPanel":SURFACE_BLOCKS_PER_PANEL\n            ,"panelsPerPage":SURFACE_PANELS_PER_PAGE\n            ,"blocksPerPage":SURFACE_BLOCKS_PER_PAGE\n            ,"bytesPerPage":SURFACE_BLOCKS_PER_PAGE*BLOCK_SIZE\n            ,"pageCount":SURFACE_PAGE_COUNT\n        };\n    };\n    this.getSurfaceMapPosition = function() { return surfacePosition(state.lastBlock); };\n''')
          s=s.replace('''        state.online=true;\n        state.dirty=false;\n        state.mediaFilename = metadata && metadata.filename\n''', '''        state.online=true;\n        state.dirty=false;\n        state.lastBlock=null;\n        state.mediaFilename = metadata && metadata.filename\n''')
          s=s.replace('''        state.online=true;\n        state.mediaFilename="";\n        state.dirty=false;\n        notifyFilenameChange(previous);\n''', '''        state.online=true;\n        state.mediaFilename="";\n        state.dirty=false;\n        state.lastBlock=null;\n        notifyFilenameChange(previous);\n''')
          s=s.replace('''        var offset=blockNumber*BLOCK_SIZE;\n        return {"error":0x00,"data":media.slice(offset,offset+BLOCK_SIZE)};\n''', '''        var offset=blockNumber*BLOCK_SIZE;\n        state.lastBlock=blockNumber;\n        return {"error":0x00,"data":media.slice(offset,offset+BLOCK_SIZE)};\n''')
          s=s.replace('''        media.set(data,blockNumber*BLOCK_SIZE);\n        state.dirty=true;\n''', '''        media.set(data,blockNumber*BLOCK_SIZE);\n        state.dirty=true;\n        state.lastBlock=blockNumber;\n''')
          s=s.replace('''        media.fill(0);\n        state.dirty=true;\n        notifyFilenameChange(previous);\n''', '''        media.fill(0);\n        state.dirty=true;\n        state.lastBlock=null;\n        notifyFilenameChange(previous);\n''')
          s=s.replace('            ,"dirty":state.dirty\n', '            ,"dirty":state.dirty\n            ,"lastBlock":state.lastBlock\n')
          hd.write_text(s)

          card=Path('res/EMU_CARD_LIRON.js')
          s=card.read_text()
          s=s.replace('var deviceSurfaceMapState = {"unit":null,"hash":null};', 'var deviceSurfaceMapState = {"unit":null,"hash":null,"page":0};')
          s=s.replace('''            var canMap=deviceCode==="UNIDISK" && typeof(device.getSurfaceMapGeometry)==="function" && !!state.mediaLoaded;\n            surface.disabled=!canMap; surface.title=canMap ? "Disk Surface Map" : "Disk Surface Map (no media loaded)";\n''', '''            var canMap=typeof(device.getSurfaceMapGeometry)==="function" && (hardDisk || !!state.mediaLoaded);\n            surface.disabled=!canMap; surface.title=canMap ? "Disk Surface Map" : "Disk Surface Map (no media loaded)";\n''')
          s=s.replace('''        var device=deviceToolUnitDevice(unit);\n        if(!device || device.id?.DCODE!=="UNIDISK" || typeof(device.getSurfaceMapGeometry)!=="function") return null;\n        if(Number(device.attach?.hash)!==expectedHash) return null;\n''', '''        var device=deviceToolUnitDevice(unit);\n        var deviceCode=String(device && device.id ? device.id.DCODE || "" : "");\n        if(!device || (deviceCode!=="UNIDISK" && deviceCode!=="HD20") || typeof(device.getSurfaceMapGeometry)!=="function") return null;\n        if(Number(device.attach?.hash)!==expectedHash) return null;\n''')

          html=Path('/tmp/hd20_surface_html.js').read_text()
          pat=r'    this\.deviceToolSurfaceMapHTML = function\(unit,expectedHash\)\n    \{.*?\n    \};\n\n    this\.deviceToolSurfaceMapUpdate = function\(\)'
          if not re.search(pat,s,re.S): raise SystemExit('surface HTML function not found')
          s=re.sub(pat,html.rstrip()+'\n\n    this.deviceToolSurfaceMapUpdate = function()',s,count=1,flags=re.S)

          update=Path('/tmp/hd20_surface_update.js').read_text()
          pat=r'    this\.deviceToolSurfaceMapUpdate = function\(\)\n    \{.*?\n    \};\n\n    this\.deviceToolSurfaceMapToggleSync = function\(force\)'
          if not re.search(pat,s,re.S): raise SystemExit('surface update function not found')
          s=re.sub(pat,update.rstrip()+'\n\n    this.deviceToolSurfaceMapToggleSync = function(force)',s,count=1,flags=re.S)

          marker='    this.deviceToolSurfaceMapToggleSync = function(force)\n'
          paging='''    this.deviceToolSurfaceMapSetPage = function(page)\n    {\n        page=Math.trunc(Number(page));\n        if(!Number.isFinite(page)) page=0;\n        var maxPage=19;\n        var device=deviceToolSurfaceTarget(deviceSurfaceMapState.unit,deviceSurfaceMapState.hash);\n        var geometry=device && typeof(device.getSurfaceMapGeometry)==="function" ? device.getSurfaceMapGeometry() : null;\n        if(geometry && Number.isInteger(geometry.pageCount)) maxPage=Math.max(0,geometry.pageCount-1);\n        page=Math.max(0,Math.min(maxPage,page));\n        deviceSurfaceMapState.page=page;\n        if(typeof(document)!==="undefined" && document.getElementById)\n        {\n            var popup=document.getElementById("lironSurfaceMap_popup");\n            if(popup && popup.hidden===false) liron.deviceToolSurfaceMapRefresh();\n        }\n        return page;\n    };\n\n    this.deviceToolSurfaceMapPage = function(delta)\n    {\n        liron.deviceToolSurfaceMapToggleSync(false);\n        return liron.deviceToolSurfaceMapSetPage((Number(deviceSurfaceMapState.page)||0)+(Number(delta)||0));\n    };\n\n'''
          if marker not in s: raise SystemExit('toggle sync marker missing')
          s=s.replace(marker,paging+marker,1)

          s=s.replace('        popup.style.width=Math.min(326,available)+"px";\n', '''        var target=deviceToolSurfaceTarget(unit,deviceSurfaceMapState.hash);\n        var desiredWidth=target && String(target.id?.DCODE || "")==="HD20" ? 414 : 326;\n        popup.style.width=Math.min(desiredWidth,available)+"px";\n''')

          opening='''            deviceSurfaceMapState.unit=unit;\n            deviceSurfaceMapState.hash=expectedHash;\n            if(!liron.deviceToolSurfaceMapRefresh()) return false;\n'''
          opening_new='''            deviceSurfaceMapState.unit=unit;\n            deviceSurfaceMapState.hash=expectedHash;\n            var openingDevice=deviceToolSurfaceTarget(unit,expectedHash);\n            var openingPosition=openingDevice && typeof(openingDevice.getSurfaceMapPosition)==="function" ? openingDevice.getSurfaceMapPosition() : null;\n            deviceSurfaceMapState.page=openingPosition && Number.isInteger(openingPosition.page) ? openingPosition.page : 0;\n            if(!liron.deviceToolSurfaceMapRefresh()) return false;\n'''
          if opening not in s: raise SystemExit('toggle opening block missing')
          s=s.replace(opening,opening_new,1)

          direct='''        deviceSurfaceMapState.unit=unit;\n        deviceSurfaceMapState.hash=expectedHash;\n        if(!liron.deviceToolSurfaceMapRefresh()) return false;\n'''
          direct_new='''        deviceSurfaceMapState.unit=unit;\n        deviceSurfaceMapState.hash=expectedHash;\n        var openingDevice=deviceToolSurfaceTarget(unit,expectedHash);\n        var openingPosition=openingDevice && typeof(openingDevice.getSurfaceMapPosition)==="function" ? openingDevice.getSurfaceMapPosition() : null;\n        deviceSurfaceMapState.page=openingPosition && Number.isInteger(openingPosition.page) ? openingPosition.page : 0;\n        if(!liron.deviceToolSurfaceMapRefresh()) return false;\n'''
          if direct not in s: raise SystemExit('direct opening block missing')
          s=s.replace(direct,direct_new,1)

          s=s.replace('            var isUniDisk=deviceCode==="UNIDISK" && typeof(device.getSurfaceMapGeometry)==="function";\n', '''            var hasSurfaceMap=typeof(device.getSurfaceMapGeometry)==="function";\n            var surfaceMapAvailable=hasSurfaceMap && (hardDisk || !!deviceState.mediaLoaded);\n''')
          old='''                ,"capabilityActions":isUniDisk ? [{"id":controlID+"_surface","icon":"fa fa-th","title":deviceState.mediaLoaded ? "Disk Surface Map" : "Disk Surface Map (no media loaded)","onClick":deviceState.mediaLoaded ? ("apple2plus.hwObj().io.SLOT2obj("+slotN+").deviceToolSurfaceMapToggle("+unit+","+instanceHash+")") : undefined,"disabled":!deviceState.mediaLoaded}] : []\n'''
          new='''                ,"capabilityActions":hasSurfaceMap ? [{"id":controlID+"_surface","icon":"fa fa-th","title":surfaceMapAvailable ? "Disk Surface Map" : "Disk Surface Map (no media loaded)","onClick":surfaceMapAvailable ? ("apple2plus.hwObj().io.SLOT2obj("+slotN+").deviceToolSurfaceMapToggle("+unit+","+instanceHash+")") : undefined,"disabled":!surfaceMapAvailable}] : []\n'''
          if old not in s: raise SystemExit('capability action block missing')
          s=s.replace(old,new,1)
          card.write_text(s)

          toolbox=Path('tests/liron_toolbox.test.js')
          t=toolbox.read_text().replace('/deviceToolSurfaceMap\\(1,39685\\)/','/deviceToolSurfaceMapToggle\\(1,39685\\)/')
          toolbox.write_text(t)
          PY

          node --check res/EMU_DEVICE_HD20.js
          node --check res/EMU_CARD_LIRON.js
          node --test tests/hd20_surface_map.test.js tests/liron_surface_map.test.js tests/liron_toolbox.test.js tests/hd20_writeblock.test.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_DEVICE_HD20.js res/EMU_CARD_LIRON.js tests/liron_toolbox.test.js
          git commit -m "feat: add paged HD20 surface map"
          git push origin HEAD:hd20-surface-map-geometry-20260923
