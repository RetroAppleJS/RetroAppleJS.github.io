name: Temporary UniDisk loader diagnostics RED
on:
  push:
    branches: [feature/liron-unidisk-loader-diagnostics]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-loader-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify diagnostics tests are RED for missing logging
        shell: bash
        run: |
          set +e
          node --test tests/liron_loader_diagnostics.test.js > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "Expected RED but diagnostics tests passed"
            exit 1
          fi
          grep -F "not ok" /tmp/red.log >/dev/null
          grep -F "router logs invalid 800K image size with mount details" /tmp/red.log >/dev/null
          grep -F "router logs missing target instead of silently returning false" /tmp/red.log >/dev/null
          grep -F "router logs successful mount details" /tmp/red.log >/dev/null
          grep -F "file chooser logs invalid size before FileReader starts" /tmp/red.log >/dev/null
          grep -F "file chooser logs FileReader errors explicitly" /tmp/red.log >/dev/null
          grep -F "file chooser logs mount rejection explicitly" /tmp/red.log >/dev/null
