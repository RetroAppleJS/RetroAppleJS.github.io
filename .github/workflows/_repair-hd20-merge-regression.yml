name: Repair HD20 merge regression

permissions:
  contents: write

on:
  push:
    paths:
      - "tests/_repair_hd20_merge_regression.js"
      - ".github/workflows/_repair-hd20-merge-regression.yml"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply merge-regression repair
        run: node tests/_repair_hd20_merge_regression.js
      - name: Verify syntax and targeted regression
        run: |
          node --check res/EMU_DEVICE_HD20.js
          node --test tests/hd20_smartport_device.test.js tests/hd20_surface_map.test.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- res/EMU_DEVICE_HD20.js; then
            echo "No production change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_DEVICE_HD20.js
          git commit -m "fix: restore HD20 constructor after surface-map merge"
          git push origin HEAD:${GITHUB_REF_NAME}
