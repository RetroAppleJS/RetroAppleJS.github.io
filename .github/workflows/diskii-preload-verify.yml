name: Disk II preload regression
on:
  push:
    branches: ["fix/diskii-sample-preload"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/appledisk2_sound.test.js
      - run: node --check res/EMU_CARD_appledisk2.js
