name: Apply Disk II LED/lid runtime patch

on:
  push:
    branches:
      - fix-diskii-led-lid-wiring
    paths:
      - .github/workflows/apply-diskii-green-patch.yml
      - .github/scripts/patch_diskii_led_lid.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-diskii-led-lid-wiring

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply and verify runtime wiring
        shell: bash
        run: |
          python3 .github/scripts/patch_diskii_led_lid.py
          node --test tests/apple2_html_layout.test.js tests/appledisk2_layout_visuals.test.js tests/preview_distribution.test.js

      - name: Commit production patch and remove temporary runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-diskii-green-patch.yml .github/scripts/patch_diskii_led_lid.py
          git add -A
          git commit -m "fix: wire Disk II LEDs and lids to layout API"
          git push origin HEAD:fix-diskii-led-lid-wiring
