name: Repair SmartPort resident-addressed unit-zero STATUS

permissions:
  contents: write

on:
  push:
    branches:
      - feature/liron-unidisk-surface-map
    paths:
      - .github/workflows/liron-smartport-unit0-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-surface-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add focused regression test
        run: |
          cat >> tests/liron_smartport_transport.test.js <<'EOF'

          test('resident-addressed SmartPort unit-zero STATUS reports the full two-device chain', () => {
              const context=loadLiron();
              const bus=new context.SmartPortBus();
              const disk1=new context.UniDisk35Device();
              const disk2=new context.UniDisk35Device();
              bus.attach(disk1,1);
              bus.attach(disk2,2);

              const init1=decodePacket(exchange(bus,encodePacket({dest:1,payload:[0x05,0x00]})));
              const init2=decodePacket(exchange(bus,encodePacket({dest:2,payload:[0x05,0x00]})));
              assert.equal(init1.status,0x00,'first resident must report another device follows');
              assert.equal(init2.status,0x7F,'second resident must report end of chain');

              // ProDOS addresses the SmartPort interface through resident ID 1 while
              // requesting status for logical unit 0 (the controller itself).
              const reply=decodePacket(exchange(bus,encodePacket({dest:1,payload:[0x00,0x03,0x00,0x00,0x00]})));
              assert.equal(reply.src,1,'controller STATUS response keeps the addressed resident ID');
              assert.equal(reply.type,0x01);
              assert.equal(reply.status,0x00);
              assert.equal(reply.payload[0],2,'controller status must report both attached devices');
          });
          EOF

      - name: RED resident-addressed controller status
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/liron_smartport_transport.test.js >/tmp/unit0-red.tap 2>&1
          rc=$?
          set -e
          cat /tmp/unit0-red.tap
          test "$rc" -ne 0
          grep -q 'not ok .*resident-addressed SmartPort unit-zero STATUS reports the full two-device chain' /tmp/unit0-red.tap

      - name: Fix unit-zero STATUS dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('res/EMU_CARD_LIRON.js')
          s=p.read_text()
          old='''        if(dest===0 && frameUnit===0 && statusCode===0)\n        {\n            buildResponse(0,0x00,[devices.length&0xFF,0x00,0x01,0x13]);\n            return;\n        }'''
          new='''        if(frameUnit===0 && statusCode===0)\n        {\n            // Unit zero is controller/interface status. After INIT, hosts such as\n            // ProDOS address this request through resident ID 1 rather than DEST 0.\n            // Preserve that resident ID as the response source while reporting the\n            // complete SmartPort chain, so ProDOS can install drive-2's vector.\n            buildResponse(dest,0x00,[devices.length&0xFF,0x00,0x01,0x13]);\n            return;\n        }'''
          if old not in s: raise SystemExit('unit-zero STATUS dispatch marker not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: GREEN focused SmartPort transport
        run: node --test tests/liron_smartport_transport.test.js

      - name: Full Node regression suite
        run: node --test tests/*.test.js

      - name: Syntax runtime and Disk II guards
        run: |
          test -z "$(git ls-files 'node_modules/**')"
          node --check res/EMU_CARD_LIRON.js
          node --check tests/liron_smartport_transport.test.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for root in ('res','tests'):
              for p in Path(root).glob('*.js'):
                  text=p.read_text()
                  for pat in [r"(['\"])UNIDISK35\1",r'UNIDISK35_',r'UNIDISK35\.po']:
                      if re.search(pat,text): bad.append(f'{p}: {pat}')
          if bad: raise SystemExit('\n'.join(bad))
          PY
          git diff --exit-code 9534b27856a32c55d24eb426e2760ae16ad50960 -- res/EMU_CARD_appledisk2.js

      - name: Standalone build
        run: |
          node .github/scripts/inline.cjs
          test -s dist/RetroAppleJS.html
          grep -q 'lironSurfaceMap_popup' dist/RetroAppleJS.html
          grep -q 'deviceToolSurfaceMapHTML' dist/RetroAppleJS.html
          git checkout -- dist/RetroAppleJS.html
          git diff --exit-code -- dist/RetroAppleJS.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptances
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-unit0.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/cardcat_unidisk_browser_acceptance.js
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_two_device_prodos_acceptance.js
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_surface_map_browser_acceptance.js

      - name: Commit repair and remove temporary verification workflows
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/liron-pr-readiness-verification.yml
          rm -f .github/workflows/liron-smartport-unit0-repair.yml
          git add res/EMU_CARD_LIRON.js tests/liron_smartport_transport.test.js .github/workflows/liron-pr-readiness-verification.yml .github/workflows/liron-smartport-unit0-repair.yml
          git commit -m "fix: report SmartPort unit-zero status through resident ID"
          git push origin HEAD:feature/liron-unidisk-surface-map
