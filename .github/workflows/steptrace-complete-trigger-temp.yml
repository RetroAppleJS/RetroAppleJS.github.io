name: Temporary STEP TRACE completion trigger

permissions:
  contents: write

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/steptrace-complete-trigger-temp.yml"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steptrace-breakpoint-scenario-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decode and apply staged completion payload
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64,gzip
          p=Path('.github/workflows/steptrace-breakpoint-scenario-complete-temp.yml')
          lines=p.read_text().splitlines()
          i=next(i for i,x in enumerate(lines) if 'CORE_B64: >-' in x)+1
          parts=[]
          for line in lines[i:]:
              if line.startswith('            '): parts.append(line.strip())
              else: break
          raw=gzip.decompress(base64.b64decode(''.join(parts)))
          Path('/tmp/steptrace-complete.patch').write_bytes(raw)
          PY
          grep '^diff --git ' /tmp/steptrace-complete.patch
          git apply --check /tmp/steptrace-complete.patch
          git apply /tmp/steptrace-complete.patch
      - name: Run focused STEP TRACE and INFLATE regressions
        shell: bash
        run: |
          node --check res/EMU_apple2debug.js
          node --check res/DBG_steptrace_scenario.js
          node --check asm/_TODO/INFLATE_ASM_CORE_testbench.js
          node --test \
            tests/cpu_execution_condition.test.js \
            tests/debugger_steptrace_scenario.test.js \
            tests/debugger_testbench_loader.test.js \
            tests/inflate_steptrace_harness.test.js
      - name: Commit real implementation and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/steptrace-breakpoint-scenario-complete-temp.yml
          rm -f .github/workflows/steptrace-complete-trigger-temp.yml
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add -A
          git commit -m "feat: complete STEP TRACE breakpoint scenarios"
          git push origin HEAD:feat/steptrace-breakpoint-scenario-complete
