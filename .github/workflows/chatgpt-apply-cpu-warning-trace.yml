name: Apply CPU warning trace patch

on:
  push:
    branches: [ "chatgpt/cpu-warning-trace" ]
    paths:
      - ".github/workflows/chatgpt-apply-cpu-warning-trace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cpu-warning-trace

      - name: Patch EMU_cpu6502.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("res/EMU_cpu6502.js")
          s = path.read_text()

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {n}")
              s = s.replace(old, new, 1)

          rep(
          '''    function instructionWarningPrefix(instr_pc)
              {
                  return "[IC=$"
                      + instruction_count.toString(16).toUpperCase().padStart(12,"0")
                      + " PC=$"
                      + ((Number(instr_pc) || 0) & 0xffff)
                          .toString(16).toUpperCase().padStart(4,"0")
                      + "] ";
              }


              // Precomputed N/Z status bits for set_nz().  This keeps the hot flag''',
          '''    function instructionWarningPrefix(instr_pc)
              {
                  return "[IC=$"
                      + instruction_count.toString(16).toUpperCase().padStart(12,"0")
                      + " PC=$"
                      + ((Number(instr_pc) || 0) & 0xffff)
                          .toString(16).toUpperCase().padStart(4,"0")
                      + "] ";
              }

              // Always-on lead-up trace for CPU warnings.  Typed arrays avoid
              // allocating an object for every executed instruction.  Entries are
              // committed after execution, so warning traces contain the 32 prior
              // instructions; the offending instruction remains in the warning header.
              const WARNING_TRACE_SIZE = 32;
              const WARNING_TRACE_MASK = WARNING_TRACE_SIZE - 1;
              var warningTraceIC = new Float64Array(WARNING_TRACE_SIZE);
              var warningTracePC = new Uint16Array(WARNING_TRACE_SIZE);
              var warningTraceInst = new Uint32Array(WARNING_TRACE_SIZE); // opcode + fetched operand
              var warningTraceRegs = new Uint32Array(WARNING_TRACE_SIZE); // post-exec A/X/Y/P
              var warningTraceSP = new Uint8Array(WARNING_TRACE_SIZE);    // post-exec SP
              var warningTraceNext = 0;
              var warningTraceCount = 0;

              function clearWarningTrace()
              {
                  warningTraceNext = 0;
                  warningTraceCount = 0;
              }

              function recordWarningTrace(instr_pc, opcode, fetchedOperand)
              {
                  var i = warningTraceNext;
                  warningTraceIC[i] = instruction_count;
                  warningTracePC[i] = instr_pc & 0xffff;
                  warningTraceInst[i] = ((opcode & 0xff) | ((fetchedOperand & 0xffff) << 8)) >>> 0;
                  warningTraceRegs[i] = (
                      (a & 0xff)
                      | ((x & 0xff) << 8)
                      | ((y & 0xff) << 16)
                      | ((p & 0xff) << 24)
                  ) >>> 0;
                  warningTraceSP[i] = sp & 0xff;

                  warningTraceNext = (i + 1) & WARNING_TRACE_MASK;
                  if(warningTraceCount < WARNING_TRACE_SIZE)
                      warningTraceCount++;
              }

              function warningTraceHex(value, width)
              {
                  return (Number(value) >>> 0).toString(16).toUpperCase().padStart(width,"0");
              }

              function warningTraceSuffix()
              {
                  var lines = [
                      "",
                      "Previous " + warningTraceCount + " instruction(s) (oldest -> newest):"
                  ];

                  if(warningTraceCount === 0)
                  {
                      lines.push("  <none>");
                      return lines.join("\\n");
                  }

                  var start = (warningTraceNext - warningTraceCount + WARNING_TRACE_SIZE) & WARNING_TRACE_MASK;
                  for(var n = 0; n < warningTraceCount; n++)
                  {
                      var i = (start + n) & WARNING_TRACE_MASK;
                      var packed = warningTraceInst[i] >>> 0;
                      var opc = packed & 0xff;
                      var fetchedOperand = (packed >>> 8) & 0xffff;
                      var len = instrlen[opc] || 1;
                      var bytes = warningTraceHex(opc,2);
                      if(len > 1) bytes += " " + warningTraceHex(fetchedOperand & 0xff,2);
                      if(len > 2) bytes += " " + warningTraceHex((fetchedOperand >>> 8) & 0xff,2);
                      bytes = bytes.padEnd(8," ");

                      var meta = opctab[opc] || ["???",""];
                      var mnemonic = String(meta[0] || "???");
                      var mode = String(meta[1] || "");
                      var regs = warningTraceRegs[i] >>> 0;

                      lines.push(
                          "  [IC=$" + warningTraceIC[i].toString(16).toUpperCase().padStart(12,"0")
                          + " PC=$" + warningTraceHex(warningTracePC[i],4) + "] "
                          + bytes + " " + mnemonic + (mode ? "/" + mode : "")
                          + "  => A=$" + warningTraceHex(regs & 0xff,2)
                          + " X=$" + warningTraceHex((regs >>> 8) & 0xff,2)
                          + " Y=$" + warningTraceHex((regs >>> 16) & 0xff,2)
                          + " P=$" + warningTraceHex((regs >>> 24) & 0xff,2)
                          + " SP=$" + warningTraceHex(warningTraceSP[i],2)
                      );
                  }

                  return lines.join("\\n");
              }


              // Precomputed N/Z status bits for set_nz().  This keeps the hot flag''',
          "warning trace helpers")

          rep(
          '''        cycle_delay = 0;
              instruction_count = 0;
              resetSelfLoopTrap();''',
          '''        cycle_delay = 0;
              instruction_count = 0;
              clearWarningTrace();
              resetSelfLoopTrap();''',
          "reset trace")

          rep(
          '''            case 3:
                      operand = readWord(pc);
                      pc = (pc + 2) & 0xffff;
                      break;
              }

              if(bDebug_boot)''',
          '''            case 3:
                      operand = readWord(pc);
                      pc = (pc + 2) & 0xffff;
                      break;
              }

              // Execution cases frequently reuse/overwrite operand; preserve the
              // bytes fetched from the instruction stream for the warning trace.
              var warningTraceOperand = operand;

              if(bDebug_boot)''',
          "preserve fetched operand")

          rep(
          '''                + opcode.toString(16).toUpperCase().padStart(2,"0")
                      + " cycle_count is zero!"
                  );''',
          '''                + opcode.toString(16).toUpperCase().padStart(2,"0")
                      + " cycle_count is zero!"
                      + warningTraceSuffix()
                  );''',
          "zero cycle warning")

          rep(
          '''                + "Cpu6502:cycle: undefined opcode: $"
                      + opcode.toString(16).toUpperCase().padStart(2,"0")
                  );''',
          '''                + "Cpu6502:cycle: undefined opcode: $"
                      + opcode.toString(16).toUpperCase().padStart(2,"0")
                      + warningTraceSuffix()
                  );''',
          "undefined opcode warning")

          rep(
          '''        // Count exactly one fetched/executed opcode.
              //
              // cycle_delay ticks return before reaching this point, so they are not
              // counted as instructions. Hardware IRQ/NMI entry also returns before
              // this point because it is not itself a fetched 6502 opcode. BRK, on
              // the other hand, is an opcode and is counted normally.
              incrementInstructionCount();''',
          '''        // Preserve the just-completed instruction before advancing IC.
              // Warning handlers execute earlier, so their trace contains only the
              // lead-up and never duplicates the offending opcode as a trace row.
              recordWarningTrace(instr_pc, opcode, warningTraceOperand);

              // Count exactly one fetched/executed opcode.
              //
              // cycle_delay ticks return before reaching this point, so they are not
              // counted as instructions. Hardware IRQ/NMI entry also returns before
              // this point because it is not itself a fetched 6502 opcode. BRK, on
              // the other hand, is an opcode and is counted normally.
              incrementInstructionCount();''',
          "record completed opcode")

          rep(
          '''                + "Cpu6502:cycle: unofficial opcode: $"
                      + opcode.toString(16).toUpperCase().padStart(2,"0")
                  );''',
          '''                + "Cpu6502:cycle: unofficial opcode: $"
                      + opcode.toString(16).toUpperCase().padStart(2,"0")
                      + warningTraceSuffix()
                  );''',
          "unofficial opcode warning")

          rep(
          '''        pc = parseInt(l[5], 16) & 0xffff;
              cycle_delay = 0;
              resetSelfLoopTrap();
          }

          // Exact architectural-state import used when the flat WASM accelerator''',
          '''        pc = parseInt(l[5], 16) & 0xffff;
              cycle_delay = 0;
              clearWarningTrace();
              resetSelfLoopTrap();
          }

          // Exact architectural-state import used when the flat WASM accelerator''',
          "load clears trace")

          rep(
          '''        cycle_delay = state.cycle_delay===undefined
                  ? 0
                  : Math.max(0,Number(state.cycle_delay)|0);

              resetSelfLoopTrap();''',
          '''        cycle_delay = state.cycle_delay===undefined
                  ? 0
                  : Math.max(0,Number(state.cycle_delay)|0);

              // A state import may jump over arbitrarily many WASM instructions;
              // stale JavaScript history would be misleading after the handoff.
              clearWarningTrace();
              resetSelfLoopTrap();''',
          "setState clears trace")

          path.write_text(s)
          PY

      - name: Parse-check CPU source
        run: node --check res/EMU_cpu6502.js

      - name: Verify warning trace hooks
        shell: bash
        run: |
          grep -q 'const WARNING_TRACE_SIZE = 32' res/EMU_cpu6502.js
          test "$(grep -c 'warningTraceSuffix()' res/EMU_cpu6502.js)" -eq 4
          grep -q 'recordWarningTrace(instr_pc, opcode, warningTraceOperand)' res/EMU_cpu6502.js

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_cpu6502.js
          git commit -m "Add 32-instruction context to CPU warnings"
          git push origin HEAD:chatgpt/cpu-warning-trace
