name: Temporary STEP TRACE INFLATE GREEN

permissions:
  contents: write

on:
  pull_request:
    branches: ["main"]

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steptrace-breakpoint-scenario-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply breakpoint-driven INFLATE conversion
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_inflate.py
          python3 /tmp/apply_inflate.py
      - name: Run INFLATE GREEN regression suite
        shell: bash
        run: |
          node --check asm/_TODO/INFLATE_ASM_CORE_testbench.js
          node --test tests/inflate_steptrace_harness.test.js
          node --test tests/cpu_execution_condition.test.js tests/debugger_steptrace_scenario.test.js tests/debugger_testbench_loader.test.js tests/inflate_steptrace_harness.test.js
      - name: Commit Task 5 and remove temporary scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/steptrace-inflate-red-temp.yml
          rm -rf .superpowers-tmp
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add -A
          git commit -m "test: drive INFLATE validation from STEP TRACE breakpoints"
          git push origin HEAD:feat/steptrace-breakpoint-scenario-complete
