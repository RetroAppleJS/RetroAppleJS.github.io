name: Temporary Liron READBLOCK GREEN

permissions:
  contents: write

on:
  push:
    branches: ["feature/liron-unidisk-bus"]
    paths:
      - ".github/workflows/liron-readblock-green-temp.yml"

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-bus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Implement read-only UniDisk media and READBLOCK dispatch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('res/EMU_DEVICE_UNIDISK35.js')
          s=p.read_text()
          s=s.replace(
              '// This layer models SmartPort-visible identity/status only. It deliberately\n// does not implement block reads/writes or the UniDisk internal 65C02 yet.',
              '// This layer models SmartPort-visible identity/status and read-only 512-byte block media.\n// WRITEBLOCK and the UniDisk internal 65C02 remain outside this milestone.'
          )
          state='''    var state = {\n         unit:0\n        ,online:options.online===undefined ? true : !!options.online\n        ,writeProtected:!!options.writeProtected\n    };\n'''
          if state not in s: raise SystemExit('UniDisk state block not found')
          s=s.replace(state,state+'\n    var media = null;\n',1)

          anchor='''    this.setWriteProtected = function(value)\n    {\n        state.writeProtected = !!value;\n        return state.writeProtected;\n    };\n\n'''
          addition='''    this.loadImage = function(data)\n    {\n        // Uint8Array.from is deliberately used here because it accepts typed\n        // arrays and Buffers from another JavaScript realm as well.\n        var bytes = Uint8Array.from(data || []);\n        if(bytes.length!==BLOCK_SIZE*BLOCK_COUNT)\n            throw new RangeError("UniDisk 3.5 image must be exactly 819200 bytes");\n\n        media=bytes;\n        state.online=true;\n        return media.length;\n    };\n\n    this.readBlock = function(blockNumber)\n    {\n        blockNumber=Number(blockNumber);\n        if(!state.online || media===null || !Number.isInteger(blockNumber) ||\n           blockNumber<0 || blockNumber>=BLOCK_COUNT)\n            return {"error":0x27,"data":new Uint8Array(0)};\n\n        var offset=blockNumber*BLOCK_SIZE;\n        return {"error":0x00,"data":media.slice(offset,offset+BLOCK_SIZE)};\n    };\n\n'''
          if anchor not in s: raise SystemExit('UniDisk write-protect anchor not found')
          s=s.replace(anchor,anchor+addition,1)
          marker='''            ,"status":statusByte()\n'''
          if marker not in s: raise SystemExit('UniDisk state marker not found')
          s=s.replace(marker,marker+'            ,"mediaLoaded":media!==null\n            ,"mediaBytes":media===null ? 0 : media.length\n',1)
          p.write_text(s)

          p=Path('res/EMU_CARD_LIRON.js')
          s=p.read_text()
          gate='''        if(command!==0x00)\n        {\n            buildResponse(dest,0x01,[]);\n            return;\n        }\n\n'''
          readblock='''        if(command===0x01)\n        {\n            var readUnit=findUnitByResidentID(dest);\n            if(!readUnit && dest>=1 && dest<=8 && units[dest]!==null) readUnit=dest;\n            if(!readUnit)\n            {\n                buildResponse(dest,0x28,[]);\n                return;\n            }\n\n            var readDevice=units[readUnit];\n            if(!readDevice || typeof(readDevice.readBlock)!=="function")\n            {\n                buildResponse(dest,0x01,[]);\n                return;\n            }\n\n            // External SmartPort transmits the parameter list beginning after\n            // the unit byte: command, count, buffer pointer, 24-bit block.\n            // DEST already identifies the resident/device.\n            var blockNumber =\n                 (payload.length>4 ? payload[4]&0xFF : 0)\n                |((payload.length>5 ? payload[5]&0xFF : 0)<<8)\n                |((payload.length>6 ? payload[6]&0xFF : 0)<<16);\n\n            var readReply=readDevice.readBlock(blockNumber);\n            var readError=readReply && readReply.error!==undefined\n                ? Number(readReply.error)&0x7F : 0x27;\n            var readData=readReply && readReply.data ? Array.from(readReply.data) : [];\n            buildResponse(dest,readError,readData);\n            return;\n        }\n\n'''
          if gate not in s: raise SystemExit('SmartPort unsupported-command gate not found')
          s=s.replace(gate,readblock+gate,1)
          p.write_text(s)
          PY

      - name: Run GREEN unit and regression suite
        shell: bash
        run: |
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --check res/EMU_CARD_LIRON.js
          node --test \
            tests/unidisk35.test.js \
            tests/liron_readblock.test.js \
            tests/liron_iwm.test.js \
            tests/liron_card.test.js \
            tests/liron_smartport_bus.test.js \
            tests/liron_smartport_transport.test.js \
            tests/liron_browser_integration.test.js

      - name: Show CardCat Pascal volume directory block
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          data=Path('disks/Utility/CardCat 1.94.po').read_bytes()
          assert len(data)==819200
          b=data[1024:1536]
          printable=''.join(chr(x) if 32<=x<127 else ' ' for x in b)
          print('PO_SIZE',len(data))
          print('BLOCK2_HEX',b[:64].hex())
          print('BLOCK2_TEXT',' '.join(printable.split())[:300])
          PY

      - name: Authentic Liron ROM READBLOCK acceptance
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const vm=require('node:vm');
          const po=fs.readFileSync('disks/Utility/CardCat 1.94.po');
          if(po.length!==819200) throw new Error('CardCat 1.94.po must be 819200 bytes');

          const cpuCtx={console}; vm.createContext(cpuCtx);
          vm.runInContext(fs.readFileSync('res/EMU_cpu6502.js','utf8'),cpuCtx,{filename:'EMU_cpu6502.js'});
          const actionMap={Hslot:null,RD:new Array(0x1000),WR:new Array(0x1000)};
          const ctx={console,oEMU:{component:{IO:{ACTION_MAP:actionMap}}}};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('res/EMU_DEVICE_UNIDISK35.js','utf8'),ctx,{filename:'EMU_DEVICE_UNIDISK35.js'});
          vm.runInContext(fs.readFileSync('res/EMU_CARD_LIRON.js','utf8'),ctx,{filename:'EMU_CARD_LIRON.js'});

          const card=new ctx.AppleLiron();
          card.getUniDisk().loadImage(po);
          const iwm=card.getIWM(), bus=card.getBus(), rom=card.getROM();
          const mem=new Uint8Array(0x10000);
          const entry=(0xC500+(rom[0x5FF]&0xFF)+3)&0xFFFF;
          const statusParams=0x0280, readParams=0x0290, statusBuf=0x0400, dataBuf=0x3000;
          const blockNo=2;

          // JSR SmartPort STATUS(unit 0) followed by JSR READBLOCK(unit 1).
          mem[0x0200]=0x20; mem[0x0201]=entry&0xFF; mem[0x0202]=entry>>8;
          mem[0x0203]=0x00; mem[0x0204]=statusParams&0xFF; mem[0x0205]=statusParams>>8;
          mem[0x0206]=0x20; mem[0x0207]=entry&0xFF; mem[0x0208]=entry>>8;
          mem[0x0209]=0x01; mem[0x020A]=readParams&0xFF; mem[0x020B]=readParams>>8;
          mem[0x020C]=0xEA;

          mem[statusParams]=0x03;
          mem[statusParams+1]=0x00;
          mem[statusParams+2]=statusBuf&0xFF;
          mem[statusParams+3]=statusBuf>>8;
          mem[statusParams+4]=0x00;

          mem[readParams]=0x03;
          mem[readParams+1]=0x01;
          mem[readParams+2]=dataBuf&0xFF;
          mem[readParams+3]=dataBuf>>8;
          mem[readParams+4]=blockNo&0xFF;
          mem[readParams+5]=(blockNo>>8)&0xFF;
          mem[readParams+6]=(blockNo>>16)&0xFF;

          mem[0xFFFC]=0x00; mem[0xFFFD]=0x02;
          let currentPC=0;
          const hw={irq_signal:0,nmi_signal:0};
          hw.lineDecode=addr=>(addr>>>8)&0xFF;
          hw.RD=new Array(256); hw.WR=new Array(256);
          for(let p=0;p<256;p++){
            hw.RD[p]=a=>mem[a&0xFFFF];
            hw.WR[p]=(a,v)=>{mem[a&0xFFFF]=v&0xFF;};
          }
          hw.RD[0xC0]=addr=>{
            addr&=0xFFFF;
            if(addr>=0xC0D0&&addr<=0xC0DF)return iwm.read(addr&15,{pc:currentPC})&0xFF;
            return mem[addr];
          };
          hw.WR[0xC0]=(addr,v)=>{
            addr&=0xFFFF;
            if(addr>=0xC0D0&&addr<=0xC0DF){iwm.write(addr&15,v,{pc:currentPC});return;}
            mem[addr]=v&0xFF;
          };
          hw.RD[0xC5]=addr=>rom[0x500+(addr&0xFF)];
          for(let p=0xC8;p<=0xCF;p++)hw.RD[p]=addr=>rom[0x800+((addr&0xFFFF)-0xC800)];
          for(let p=0xC5;p<=0xCF;p++)hw.WR[p]=()=>{};

          const cpu=new cpuCtx.Cpu6502(hw); cpu.reset();
          function step(){
            currentPC=cpu.watch().pc&0xFFFF;
            cpu.cycle();
            while(cpu.watch().cycle_delay>0)cpu.cycle();
          }
          let returned=false,instructions=0;
          for(;instructions<2000000;instructions++){
            if(instructions>0&&cpu.watch().cycle_delay===0&&(cpu.watch().pc&0xFFFF)===0x020C){returned=true;break;}
            step();
          }

          const actual=Buffer.from(mem.slice(dataBuf,dataBuf+512));
          const expected=po.subarray(blockNo*512,(blockNo+1)*512);
          const match=actual.equals(expected);
          const printable=actual.toString('latin1').replace(/[^\x20-\x7E]+/g,' ').replace(/\s+/g,' ').trim().slice(0,240);
          const result={entry:entry.toString(16),returned,instructions,status0:mem[statusBuf],residentIDs:bus.getState().residentIDs,blockNo,match,printable};
          console.log('AUTHENTIC_READBLOCK',JSON.stringify(result));
          if(!returned||mem[statusBuf]!==1||!match)process.exit(1);
          NODE

      - name: Commit verified production source
        shell: bash
        run: |
          git config user.name "Zen"
          git config user.email "freddy.vandriessche@gmail.com"
          git add res/EMU_DEVICE_UNIDISK35.js res/EMU_CARD_LIRON.js
          git commit -m "feat: add read-only UniDisk SmartPort block access"
          git fetch origin feature/liron-unidisk-bus
          git rebase origin/feature/liron-unidisk-bus
          git push origin HEAD:feature/liron-unidisk-bus
