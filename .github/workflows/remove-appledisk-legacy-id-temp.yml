name: Temporary AppleDisk legacy ID cleanup

on:
  push:
    branches: ["fix/remove-appledisk-legacy-id"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/diskjs_component_id.test.js
