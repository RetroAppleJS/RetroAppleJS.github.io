name: Temporary AppleDisk legacy ID cleanup

permissions:
  contents: write

on:
  push:
    branches: ["fix/remove-appledisk-legacy-id"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-appledisk-legacy-id
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove legacy AppleDisk component ID
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('tools/DiskJS.html')
          s = p.read_text()

          old_lookup = '  var disk2 = oEMU.component.IO["AppleDisk2"] || oEMU.component.IO["AppleDisk"];'
          new_lookup = '  var disk2 = oEMU.component.IO["AppleDisk2"];'
          if s.count(old_lookup) != 1:
              raise SystemExit(f'legacy lookup: expected one match, found {s.count(old_lookup)}')
          s = s.replace(old_lookup, new_lookup, 1)

          old_alias = '''\n    // Legacy alias for older DiskJS/helper code.\n    oEMU.component.IO["AppleDisk"] = disk2;'''
          if s.count(old_alias) != 1:
              raise SystemExit(f'legacy alias: expected one match, found {s.count(old_alias)}')
          s = s.replace(old_alias, '', 1)

          p.write_text(s)
          PY

      - name: Verify canonical Disk II component ID
        run: node --test tests/diskjs_component_id.test.js tests/appledisk2_layout_visuals.test.js

      - name: Verify no legacy AppleDisk component ID remains
        shell: bash
        run: |
          if grep -RFn 'oEMU.component.IO["AppleDisk"]' tools res tests --exclude='remove-appledisk-legacy-id-temp.yml'; then
            echo "Legacy AppleDisk component ID remains."
            exit 1
          fi

      - name: Run full Node suite and confirm existing baseline only
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js > /tmp/all-tests.log 2>&1
          status=$?
          set -e
          cat /tmp/all-tests.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -q 'ℹ fail 5' /tmp/all-tests.log
          grep -q 'default Apple II Plus boot mounts AppleMouse in physical slot 4' /tmp/all-tests.log
          grep -q 'fixed scenario companion is mounted in viewport coordinate space' /tmp/all-tests.log
          grep -q 'layout companion prefers the right side, falls back left, and uses a narrower preferred width' /tmp/all-tests.log
          grep -q 'Liron advertises HD20 as optional and attaches mixed SmartPort devices to distinct units' /tmp/all-tests.log
          grep -q 'UniDisk Surface Map capability button toggles the popup open and closed' /tmp/all-tests.log

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/DiskJS.html
          git commit -m "refactor: remove legacy AppleDisk component ID"
          git fetch origin fix/remove-appledisk-legacy-id
          git rebase origin/fix/remove-appledisk-legacy-id
          git push origin HEAD:fix/remove-appledisk-legacy-id
