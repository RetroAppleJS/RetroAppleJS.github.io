name: Mockingboard audio telemetry verification
on:
  push:
    branches: ["feat/mockingboard-audio-live-telemetry"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/mockingboard_audio_telemetry.test.js
      - run: node --check res/EMU_CARD_mockingboard.js
      - run: node --check res/EMU_DEVICE_mockingboard_audio.js
