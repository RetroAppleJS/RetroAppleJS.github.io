name: Diagnose Liron two-device ProDOS MLI access

permissions:
  contents: write

on:
  push:
    branches:
      - fix/liron-two-device-prodos-followup
    paths:
      - .github/workflows/liron-two-device-mli-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liron-two-device-prodos-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace stale vector assertion with functional D0 MLI probe in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/liron_two_device_prodos_acceptance.js')
          s=p.read_text()
          old="""    if(prodos.s5d2[0]===prodos.nodev[0] && prodos.s5d2[1]===prodos.nodev[1])\n        throw new Error('S5,D2 driver vector still points to NO DEVICE CONNECTED');\n"""
          new="""    const mliRead=await page.evaluate(()=>{\n        const hw=apple2plus.hwObj();\n        const cpu=apple2plus.cpuObj();\n        const write=(addr,value)=>{\n            addr &= 0xFFFF;\n            const fn=hw.WR[hw.lineDecode(addr)];\n            if(typeof fn!=='function') throw new Error('No CPU-bus writer for $'+addr.toString(16));\n            fn(addr,value&0xFF);\n        };\n        const writeBytes=(addr,bytes)=>bytes.forEach((value,index)=>write(addr+index,value));\n\n        let liron=null;\n        for(let i=0;i<hw.io.slots.length;i++)\n        {\n            const card=hw.io.SLOT2obj(i);\n            if(card && card.id && card.id.PCODE==='LIRON') { liron=card; break; }\n        }\n        if(!liron) throw new Error('Liron missing for MLI probe');\n        const unit2=liron.getUniDisk(2);\n        if(!unit2) throw new Error('UniDisk unit 2 missing for MLI probe');\n        const expected=unit2.readBlock(0);\n        if(expected.error) throw new Error('Direct unit-2 block zero unavailable: '+expected.error);\n\n        const codeAddr=0x6000;\n        const parmAddr=0x6100;\n        const bufferAddr=0x7000;\n        for(let i=0;i<512;i++) write(bufferAddr+i,0);\n        writeBytes(codeAddr,[0x20,0x00,0xBF,0x80,0x00,0x61,0xEA]);\n        writeBytes(parmAddr,[0x03,0xD0,0x00,0x70,0x00,0x00]);\n\n        const before=cpu.watch();\n        cpu.setExecutionTrap(codeAddr+6);\n        cpu.setState({a:before.a,x:before.x,y:before.y,sp:before.sp,p:before.p,pc:codeAddr,cycle_delay:0});\n        const run=apple2plus.runLiveCpuTicks(2000000,{videoScale:0.001});\n        const after=cpu.watch();\n        cpu.clearExecutionTrap();\n\n        const actual=Array.from(hw.safe_dump(bufferAddr,bufferAddr+511));\n        const expectedBytes=Array.from(expected.data);\n        const mismatches=[];\n        for(let i=0;i<512 && mismatches.length<8;i++)\n            if(actual[i]!==expectedBytes[i]) mismatches.push({offset:i,actual:actual[i],expected:expectedBytes[i]});\n        return {\n            trapped:!!run.trapped,\n            completedTicks:run.completedTicks,\n            pc:after.pc&0xFFFF,\n            a:after.a&0xFF,\n            carry:after.p&1,\n            match:mismatches.length===0,\n            mismatches,\n            actualPrefix:actual.slice(0,16),\n            expectedPrefix:expectedBytes.slice(0,16),\n            s5d2:[hw.safe_read(0xBF2A),hw.safe_read(0xBF2B)],\n            nodev:[hw.safe_read(0xBF10),hw.safe_read(0xBF11)]\n        };\n    });\n    console.log('PRODOS_MLI_D0_READ',JSON.stringify(mliRead));\n    if(!mliRead.trapped || mliRead.carry || !mliRead.match)\n        throw new Error('ProDOS MLI READ_BLOCK on $D0 failed: '+JSON.stringify(mliRead));\n"""
          if old not in s: raise SystemExit('vector assertion marker not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run functional D0 probe and capture output
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/retroapple-http-mli.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          set +e
          RETROAPPLE_URL=http://127.0.0.1:8000 node tests/liron_two_device_prodos_acceptance.js > /tmp/mli.out 2>&1
          rc=$?
          set -e
          {
            echo "exit_code=$rc"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "--- MLI probe output ---"
            cat /tmp/mli.out
          } > diagnostics-liron-two-device-mli.txt

      - name: Commit diagnostic output only
        run: |
          git checkout -- tests/liron_two_device_prodos_acceptance.js
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics-liron-two-device-mli.txt
          git commit -m "chore: capture functional D0 MLI probe"
          git push origin HEAD:fix/liron-two-device-prodos-followup
