name: Temporary UniDisk eject GREEN
on:
  push:
    branches: [feature/liron-unidisk-toolbox]
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/liron-unidisk-toolbox
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add minimal UniDisk media eject operation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('res/EMU_DEVICE_UNIDISK35.js')
          s=p.read_text()
          marker='    this.readBlock = function(blockNumber)\n'
          if marker not in s:
              raise SystemExit('UniDisk readBlock marker not found')
          if 'this.ejectImage = function()' in s:
              raise SystemExit('ejectImage unexpectedly already exists')
          method='''    this.ejectImage = function()\n    {\n        media=null;\n        state.mediaFilename="";\n        return true;\n    };\n\n'''
          s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Run UniDisk and Liron regressions
        run: |
          node --check res/EMU_DEVICE_UNIDISK35.js
          node --test tests/unidisk35.test.js tests/liron_toolbox.test.js tests/liron_browser_mount.test.js tests/liron_browser_integration.test.js tests/liron_card.test.js tests/liron_iwm.test.js tests/liron_readblock.test.js tests/liron_smartport_bus.test.js tests/liron_smartport_transport.test.js
      - name: Commit production eject operation
        shell: bash
        run: |
          git config user.name "RetroAppleJS CI"
          git config user.email "actions@users.noreply.github.com"
          git add res/EMU_DEVICE_UNIDISK35.js
          git commit -m "feat: eject UniDisk media without detaching device"
          git pull --rebase origin feature/liron-unidisk-toolbox
          git push origin HEAD:feature/liron-unidisk-toolbox
