name: Temporary assembler include-files UI patch

on:
  push:
    branches:
      - feature/assembler-include-files-ui
    paths:
      - .github/workflows/tmp-assembler-include-ui.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/assembler-include-files-ui
          fetch-depth: 0

      - name: RED - prove feature is absent
        run: python3 .github/tmp/assembler_include_test.py --expect-missing

      - name: Apply include-files UI patch
        run: python3 .github/tmp/assembler_include_patch.py

      - name: GREEN - structural checks
        run: python3 .github/tmp/assembler_include_test.py

      - name: GREEN - state and real include resolution
        run: node .github/tmp/assembler_include_test.js

      - name: Verify diff
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load assembler include files in tab 2.2"
          git push origin HEAD:feature/assembler-include-files-ui
