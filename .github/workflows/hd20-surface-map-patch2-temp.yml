name: HD20 surface map patch retry temp

permissions:
  contents: write

on:
  push:
    branches:
      - hd20-surface-map-geometry-20260923
    paths:
      - ".github/workflows/hd20-surface-map-patch2-temp.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd20-surface-map-geometry-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply corrected patch generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/hd20-surface-map-patch-temp.yml').read_text()
          script=workflow.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script=script.replace("new_html=r'''","new_html='''").replace("new_update=r'''","new_update='''")
          exec(compile(script,'hd20-surface-map-generator','exec'))
          PY

          node --check res/EMU_DEVICE_HD20.js
          node --check res/EMU_CARD_LIRON.js
          node --test tests/hd20_surface_map.test.js tests/liron_surface_map.test.js tests/liron_toolbox.test.js tests/hd20_writeblock.test.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/EMU_DEVICE_HD20.js res/EMU_CARD_LIRON.js tests/liron_toolbox.test.js
          git commit -m "feat: add paged HD20 surface map"
          git push origin HEAD:hd20-surface-map-geometry-20260923
