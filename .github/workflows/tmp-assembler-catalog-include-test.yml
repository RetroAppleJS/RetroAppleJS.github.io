name: Temporary assembler catalog include routing test

on:
  push:
    branches:
      - feature/assembler-include-files-ui
    paths:
      - index.html
      - .github/tmp/assembler_catalog_include_test.js
      - .github/tmp/assembler_catalog_include_patch.py
      - .github/workflows/tmp-assembler-catalog-include-test.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/assembler-include-files-ui
          fetch-depth: 0

      - name: Apply catalog include routing patch
        run: python3 .github/tmp/assembler_catalog_include_patch.py

      - name: Run catalog include routing test
        run: node .github/tmp/assembler_catalog_include_test.js

      - name: Verify diff
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load catalog .INC files as assembler includes"
          git push origin HEAD:feature/assembler-include-files-ui
